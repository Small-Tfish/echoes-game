//  Boss 更新
// ============================================================
function updateBoss(en, dt) {
  const p = S.player;
  const bossNum = Math.floor(S.wave / BOSS_INTERVAL);
  const dx = p.x - en.x, dy = p.y - en.y;
  const d = Math.hypot(dx, dy) || 1;
  const nx = dx / d, ny = dy / d;

  en.x += nx * en.speed * dt;
  en.y += ny * en.speed * dt;
  if (S.map) {
    en.x = Math.max(en.r, Math.min(S.map.w - en.r, en.x));
    en.y = Math.max(en.r, Math.min(S.map.h - en.r, en.y));
    resolveCircleWalls(en);
    slideAlongWalls(en, nx, ny, dt);
  }

  en.ringCd -= dt;
  if (en.ringCd <= 0) {
    en.ringCd = 3.5;
    const count = 14;
    const ringLife = Math.min(4.2, 2.2 + bossNum * 0.35);
    for (let i = 0; i < count; i++) {
      const a = (i / count) * Math.PI * 2;
      S.eBullets.push({
        x: en.x + Math.cos(a) * en.r, y: en.y + Math.sin(a) * en.r,
        vx: Math.cos(a) * 180, vy: Math.sin(a) * 180,
        r: 5, life: ringLife, color: '#ff3b5c'
      });
    }
    sfx(220, 0.2, 'sawtooth', 0.05);
  }

  en.fireCd -= dt;
  if (en.fireCd <= 0) {
    en.fireCd = 1.8;
    const baseA = Math.atan2(dy, dx);
    const aimLife = Math.min(3.8, 2.4 + bossNum * 0.3);
    for (let i = -1; i <= 1; i++) {
      const a = baseA + i * 0.14;
      S.eBullets.push({
        x: en.x, y: en.y, vx: Math.cos(a) * 280, vy: Math.sin(a) * 280,
        r: 5, life: aimLife, color: '#ff5c7a'
      });
    }
    sfx(300, 0.08, 'square', 0.03);
  }

  if (p.invuln <= 0 && d < en.r + p.r) hurtPlayer();
}

// ============================================================
//  更新
// ============================================================
function update(dt) {
  const now = performance.now();
  S.gameTime += dt;
  const p = S.player;

  // 手机右摇杆：把瞄准方向换算成鼠标世界坐标（带一点角度平滑）
  if (MOBILE && touchAim.active && p) {
    const target = Math.atan2(touchAim.y, touchAim.x);
    if (!S.aimInit) { S.aimAngle = target; S.aimInit = true; }
    let diff = target - S.aimAngle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    S.aimAngle += diff * Math.min(1, dt * 22);
    const sx = W / 2 + (p.x - S.cam.x) * S.cam.zoom;
    const sy = H / 2 + (p.y - S.cam.y) * S.cam.zoom;
    S.mouse.x = sx + Math.cos(S.aimAngle) * 400;
    S.mouse.y = sy + Math.sin(S.aimAngle) * 400;
  }
  const mw = mouseWorld();

  if (p.invuln > 0) p.invuln -= dt;
  if (S.echoCd > 0) S.echoCd -= dt;
  if (S.detonateCd > 0) S.detonateCd = Math.max(0, S.detonateCd - dt);
  if (S.visionTimer > 0) S.visionTimer = Math.max(0, S.visionTimer - dt);
  if (S.blindLock > 0) S.blindLock = Math.max(0, S.blindLock - dt);
  if (S.blindTimer > 0) S.blindTimer = Math.max(0, S.blindTimer - dt);
  S.blindAlpha += ((S.blindTimer > 0 ? 1 : 0) - S.blindAlpha) * Math.min(1, dt * 4);
  if (S.comboTimer > 0) { S.comboTimer -= dt; if (S.comboTimer <= 0) S.combo = 0; }
  if (S.banner.life > 0) S.banner.life -= dt;
  if (S.flash > 0) S.flash -= dt;
  if (S.whiteFlash > 0) S.whiteFlash -= dt;
  if (S.bombCd > 0) S.bombCd = Math.max(0, S.bombCd - dt);
  
  if (S.sniperCd > 0) {
    const prevCd = S.sniperCd;
    S.sniperCd = Math.max(0, S.sniperCd - dt);
    if (prevCd > 0 && S.sniperCd === 0 && S.sniperMode) sfx(1050, 0.05, 'square', 0.02);
  }
  if (S.sniperRecoil > 0) S.sniperRecoil = Math.max(0, S.sniperRecoil - dt * 8);
  if (S.muzzleFlash > 0) S.muzzleFlash -= dt;
  if (S.sniperFailFlash > 0) S.sniperFailFlash -= dt;

  if (S.meleeCd > 0) S.meleeCd = Math.max(0, S.meleeCd - dt);

  if (S.isChargingMelee) {
    S.meleeCharge = Math.min(MELEE_MAX_CHARGE, S.meleeCharge + dt);
    if (Math.random() < 0.3) {
      const side = Math.random() < 0.5 ? -1 : 1;
      const a = p.angle + side * MELEE_ANGLE;
      const dist = 20 + S.meleeCharge * 15;
      S.particles.push({
        x: p.x + Math.cos(a) * dist + (Math.random()-0.5)*10,
        y: p.y + Math.sin(a) * dist + (Math.random()-0.5)*10,
        vx: Math.cos(a) * -50, vy: Math.sin(a) * -50,
        life: 0.2, maxLife: 0.2, color: '95,184,255', size: 1 + Math.random() * 2
      });
    }
  }

  const targetAid = S.sniperMode ? 1 : 0;
  S.sniperAidAlpha += (targetAid - S.sniperAidAlpha) * Math.min(1, dt * 8);

  if (S.buffs.fireRate > 0) S.buffs.fireRate = Math.max(0, S.buffs.fireRate - dt);
  if (S.buffs.spread > 0) S.buffs.spread = Math.max(0, S.buffs.spread - dt);

  S.powerupTimer -= dt;
  if (S.powerupTimer <= 0) {
    S.powerupTimer = POWERUP_SPAWN_INTERVAL;
    if (S.powerups.length < 2) spawnRandomPowerup();
  }

  for (let i = S.powerups.length - 1; i >= 0; i--) {
    const pu = S.powerups[i];
    pu.life -= dt; pu.spawnT += dt;
    if (pu.life <= 0) { S.powerups.splice(i, 1); continue; }
    if (Math.hypot(pu.x - p.x, pu.y - p.y) < 24 + p.r) {
      pickupPowerup(pu); S.powerups.splice(i, 1);
    }
  }

  // 冲击波更新
  for (let i = S.shockwaves.length - 1; i >= 0; i--) {
    const sw = S.shockwaves[i];
    sw.life -= dt;
    const prog = 1 - sw.life / sw.maxLife;
    sw.r = sw.maxR * Math.pow(prog, 0.6);
    if (sw.life <= 0) S.shockwaves.splice(i, 1);
  }

  // —— 移动：键盘 / 手机左摇杆，带平滑加减速 ——
  let inX = 0, inY = 0;
  if (keys[KEYBINDS.moveLeft] || keys['arrowleft']) inX -= 1;
  if (keys[KEYBINDS.moveRight] || keys['arrowright']) inX += 1;
  if (keys[KEYBINDS.moveUp] || keys['arrowup']) inY -= 1;
  if (keys[KEYBINDS.moveDown] || keys['arrowdown']) inY += 1;
  let stickMag;
  if (MOBILE && touchMove.active) {
    inX = touchMove.x; inY = touchMove.y;
    stickMag = touchMove.mag;
  } else {
    stickMag = Math.hypot(inX, inY);
    if (stickMag > 1) stickMag = 1;
  }
  const inLen = Math.hypot(inX, inY);
  const dirX = inLen > 0.0001 ? inX / inLen : 0;
  const dirY = inLen > 0.0001 ? inY / inLen : 0;
  if (stickMag < 0.08) stickMag = 0;

  const speedCap = PLAYER_MAX_SPEED * (S.focusActive ? FOCUS_SPEED_MULT : 1);
  let tvx = 0, tvy = 0;
  if (stickMag > 0.001) {
    tvx = dirX * speedCap * Math.min(1, stickMag);
    tvy = dirY * speedCap * Math.min(1, stickMag);
  }

  const rate = stickMag > 0.01 ? MOVE_ACCEL : MOVE_DECEL;
  const dvx = tvx - S.pvx, dvy = tvy - S.pvy;
  const dvLen = Math.hypot(dvx, dvy);
  const maxStep = rate * dt;
  if (dvLen <= maxStep) { S.pvx = tvx; S.pvy = tvy; }
  else { S.pvx += dvx / dvLen * maxStep; S.pvy += dvy / dvLen * maxStep; }
  if (stickMag <= 0.001 && Math.abs(S.pvx) < 3 && Math.abs(S.pvy) < 3) { S.pvx = 0; S.pvy = 0; }

  const ox = p.x, oy = p.y;
  p.x += S.pvx * dt;
  p.y += S.pvy * dt;
  if (S.map) {
    p.x = Math.max(p.r + 6, Math.min(S.map.w - p.r - 6, p.x));
    p.y = Math.max(p.r + 6, Math.min(S.map.h - p.r - 6, p.y));
    resolveCircleWalls(p);
  }
  // 碰撞后按实际位移修正速度，避免贴着墙抖动
  if (dt > 0.0001) {
    S.pvx = (p.x - ox) / dt;
    S.pvy = (p.y - oy) / dt;
    const spdNow = Math.hypot(S.pvx, S.pvy), spdCap = PLAYER_MAX_SPEED * 1.5;
    if (spdNow > spdCap) { S.pvx = S.pvx / spdNow * spdCap; S.pvy = S.pvy / spdNow * spdCap; }
  }

  if (S.prevX !== null) {
    const instSp = Math.hypot(p.x - S.prevX, p.y - S.prevY) / Math.max(dt, 0.001);
    S.playerSpeed = S.playerSpeed * 0.8 + instSp * 0.2;
  }
  S.prevX = p.x; S.prevY = p.y;

  let targetSpread = SPREAD_MIN + Math.min(1, S.playerSpeed / PLAYER_MAX_SPEED) * SPREAD_MAX_ADD;
  if (S.focusActive) targetSpread *= FOCUS_SPREAD_MULT;
  S.currentSpread += (targetSpread - S.currentSpread) * Math.min(1, dt * 10);

  if (S.sniperMode) {
    p.angle = Math.atan2(mw.y - p.y, mw.x - p.x);
    if (MOBILE) {
      if (touchAim.active && touchAim.mag > 0.55) {
        if (!S.sniperTriggered) {
          S.sniperTriggered = true;
          sniperShoot();
        }
      } else if (!touchAim.active || touchAim.mag < 0.3) {
        S.sniperTriggered = false;
      }
    }
  }

  S.history.push({ t: now, x: p.x, y: p.y });
  while (S.history.length && now - S.history[0].t > 3000) S.history.shift();

  const canFire = MOBILE ? (touchAim.active && touchAim.mag > 0.16) : true;
  if (!S.sniperMode && !S.isChargingMelee && canFire) playerShoot(now);

  updateKnives(dt);

  for (let i = S.echoes.length - 1; i >= 0; i--) {
    const e = S.echoes[i];
    e.elapsed += dt; e.life -= dt; e.shootCd -= dt;
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.life <= 0) { S.echoes.splice(i, 1); continue; }
    const path = e.path;
    let pos = null;
    if (path.length) {
      let lo = 0, hi = path.length - 1;
      while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (path[mid].dt <= e.elapsed) lo = mid; else hi = mid - 1; }
      if (e.elapsed >= path[path.length - 1].dt) pos = { x: path[path.length - 1].x, y: path[path.length - 1].y };
      else if (e.elapsed <= path[0].dt) pos = { x: path[0].x, y: path[0].y };
      else {
        const a = path[lo], b = path[lo + 1] || a;
        const span = b.dt - a.dt || 1, k = (e.elapsed - a.dt) / span;
        pos = { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k };
      }
    }
    if (pos) { e.x = pos.x; e.y = pos.y; }

    if (e.shootCd <= 0) {
      let nearest = null, nd = Infinity;
      for (const en of S.enemies) {
        if (en.delay > 0) continue;
        const dx = en.x - e.x, dy = en.y - e.y, d2 = dx * dx + dy * dy;
        if (d2 < nd) { nd = d2; nearest = en; }
      }
      if (nearest && nd < 450 * 450) {
        e.shootCd = S.buffs.fireRate > 0 ? ECHO_SHOT_CD_FAST : ECHO_SHOT_CD;
        const dx = nearest.x - e.x, dy = nearest.y - e.y, d = Math.hypot(dx, dy) || 1;
        S.pBullets.push({ x: e.x, y: e.y, vx: dx / d * 680, vy: dy / d * 680, r: 3, life: 999, damage: BULLET_DAMAGE, color: '#5fb8ff', echo: true });
        sfx(760, 0.03, 'sine', 0.01);
      }
    }
  }

  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const en = S.enemies[i];
    en.age += dt;
    if (en.delay > 0) { en.delay -= dt; continue; }
    if (en.hitFlash > 0) en.hitFlash -= dt;

    // 远处刷出的怪在玩家靠近或受伤前保持蛰伏，迫使玩家走遍地图
    if (en.dormant) {
      if (en.hp < en.maxHp) en.dormant = false;
      else if (Math.hypot(p.x - en.x, p.y - en.y) < en.aggroRange) en.dormant = false;
      else continue;
    }

    if (en.type === 'boss') { updateBoss(en, dt); continue; }

    let speedMul = 1;
    for (const e of S.echoes) { if (Math.hypot(en.x - e.x, en.y - e.y) < SLOW_RADIUS) { speedMul = 0.5; break; } }

    const dx = p.x - en.x, dy = p.y - en.y, d = Math.hypot(dx, dy) || 1;
    const nx = dx / d, ny = dy / d;

    if (en.type === 'hunter') {
      let target = null, minD = Infinity;
      for (const e of S.echoes) { const ed = Math.hypot(e.x - en.x, e.y - en.y); if (ed < minD) { minD = ed; target = e; } }
      if (target) {
        const edx = target.x - en.x, edy = target.y - en.y, ed = Math.hypot(edx, edy) || 1;
        en.x += edx / ed * en.speed * speedMul * dt; en.y += edy / ed * en.speed * speedMul * dt;
        if (ed < en.r + target.r) { target.hp -= 5 * dt; target.hitFlash = 0.1; if (target.hp <= 0) destroyEcho(target); }
      } else {
        en.x += nx * en.speed * speedMul * dt; en.y += ny * en.speed * speedMul * dt;
      }
    } else if (en.type === 'tracker' || en.type === 'mini' || en.type === 'splitter') {
      en.x += nx * en.speed * speedMul * dt; en.y += ny * en.speed * speedMul * dt;
    } else if (en.type === 'shooter' || en.type === 'blinder') {
      const isBlind = en.type === 'blinder';
      if (d < 230) { en.x -= nx * en.speed * speedMul * dt; en.y -= ny * en.speed * speedMul * dt; }
      else if (d > 330) { en.x += nx * en.speed * speedMul * dt; en.y += ny * en.speed * speedMul * dt; }
      else { en.x += -ny * en.speed * 0.5 * speedMul * dt; en.y += nx * en.speed * 0.5 * speedMul * dt; }
      en.fireCd -= dt;
      if (en.fireCd <= 0 && d < 700) {
        if (isBlind) {
          en.fireCd = 2.4 + Math.random() * 1.0;
          const blindLife = Math.min(3.4, 2.2 + S.wave * 0.06);
          S.eBullets.push({ x: en.x, y: en.y, vx: nx * 250, vy: ny * 250, r: 6, life: blindLife, color: '#ffd166', blind: true });
          sfx(520, 0.08, 'sine', 0.02);
        } else {
          en.fireCd = 1.8 + Math.random() * 0.8;
          const shotLife = Math.min(3.4, 1.7 + S.wave * 0.09);
          S.eBullets.push({ x: en.x, y: en.y, vx: nx * 240, vy: ny * 240, r: 5, life: shotLife, color: '#c084fc' });
          sfx(300, 0.06, 'sawtooth', 0.015);
        }
      }
    }

    if (S.map) {
      en.x = Math.max(en.r, Math.min(S.map.w - en.r, en.x));
      en.y = Math.max(en.r, Math.min(S.map.h - en.r, en.y));
      resolveCircleWalls(en);
      slideAlongWalls(en, nx, ny, dt);
    }

    const pd = Math.hypot(p.x - en.x, p.y - en.y);
    if (p.invuln <= 0 && pd < en.r + p.r) { hurtPlayer(); en.x -= nx * 40; en.y -= ny * 40; }
  }

  for (let i = S.pBullets.length - 1; i >= 0; i--) {
    const b = S.pBullets[i];

    // 爆破排斥力影响
    if (b.pushVx) {
      b.x += b.pushVx * dt;
      b.y += b.pushVy * dt;
      b.pushVx *= Math.pow(0.92, dt * 60);
      b.pushVy *= Math.pow(0.92, dt * 60);
      if (Math.abs(b.pushVx) < 1 && Math.abs(b.pushVy) < 1) {
        b.pushVx = 0; b.pushVy = 0;
      }
    }

    const sx = b.x, sy = b.y;
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.isSniper) {
      if (!b.trail) b.trail = [];
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 8) b.trail.shift();
    }
    if (b.life <= 0 || (S.map && (b.x < -40 || b.x > S.map.w + 40 || b.y < -40 || b.y > S.map.h + 40))) { S.pBullets.splice(i, 1); continue; }

    // 墙体：线段检测，防止高速子弹穿模
    let wallT = 2;
    if (S.map) {
      for (const wl of S.map.walls) {
        const t = segRectT(sx, sy, b.x, b.y, wl, b.r);
        if (t >= 0 && t < wallT) wallT = t;
      }
    }

    // 敌人：线段检测，避免跳过小怪
    let hitIdx = -1, hitT = 2, hitX = 0, hitY = 0;
    for (let j = S.enemies.length - 1; j >= 0; j--) {
      const en = S.enemies[j];
      if (en.delay > 0) continue;
      const t = segCircleT(sx, sy, b.x, b.y, en.x, en.y, en.r + b.r);
      if (t >= 0 && t < hitT) {
        hitT = t; hitIdx = j;
        hitX = sx + (b.x - sx) * t;
        hitY = sy + (b.y - sy) * t;
      }
    }

    if (hitIdx >= 0 && hitT <= wallT) {
      const en = S.enemies[hitIdx];
      b.x = hitX; b.y = hitY;
      if (b.trail && b.trail.length) b.trail[b.trail.length - 1] = { x: b.x, y: b.y };
      en.dormant = false;

      let finalDamage = b.damage, critMult = 1;
      if (b.isSniper && en.type === 'boss') {
        let cx = b.x, cy = b.y;
        if (b.trail && b.trail.length >= 2) {
          const prev = b.trail[b.trail.length - 2];
          const sdx = b.x - prev.x, sdy = b.y - prev.y, len2 = sdx * sdx + sdy * sdy;
          let t = 0;
          if (len2 > 0.0001) { t = ((en.x - prev.x) * sdx + (en.y - prev.y) * sdy) / len2; t = Math.max(0, Math.min(1, t)); }
          cx = prev.x + sdx * t; cy = prev.y + sdy * t;
        }
        const dc = Math.hypot(cx - en.x, cy - en.y), norm = Math.min(1, dc / en.r);
        critMult = CORE_MULT_MAX - (CORE_MULT_MAX - CORE_MULT_MIN) * norm;
        finalDamage = b.damage * critMult;
      }

      en.hp -= finalDamage; en.hitFlash = 0.12;

      if (b.isSniper) {
        const isCrit = critMult >= 2.5, isMax = critMult >= 3.5;
        const fxColor = isCrit ? '255,209,102' : '255,255,255';
        S.particles.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: isMax ? 0.3 : 0.18, maxLife: isMax ? 0.3 : 0.18, color: fxColor, size: isMax ? 52 : 40, ring: true });
        for (let k = 0; k < (isMax ? 8 : 6); k++) {
          const a = (k / (isMax ? 8 : 6)) * Math.PI * 2;
          S.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * 300, vy: Math.sin(a) * 300, life: 0.15, maxLife: 0.15, color: fxColor, size: 3 });
        }
        S.whiteFlash = Math.max(S.whiteFlash, isMax ? 0.12 : 0.08);
        sfx(isMax ? 2200 : 2000, 0.05, 'square', 0.025);
        if (en.type === 'boss' || isCrit) {
          S.particles.push({ x: b.x, y: b.y - 12, vx: 0, vy: -75, life: 0.75, maxLife: 0.75, color: fxColor, text: en.type === 'boss' ? `${finalDamage.toFixed(1)} ×${critMult.toFixed(2)}` : `${finalDamage.toFixed(1)}`, size: isMax ? 18 : 14 });
        }
      } else {
        for (let k = 0; k < 4; k++) {
          const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 100;
          S.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .25, maxLife: .25, color: b.echo ? '95,184,255' : '255,209,102', size: 1.5 + Math.random() * 2 });
        }
      }
      if (en.hp <= 0) killEnemy(hitIdx, b.echo ? 0.8 : 0.4);
      S.pBullets.splice(i, 1);
      continue;
    }

    if (wallT <= 1) {
      b.x = sx + (b.x - sx) * wallT;
      b.y = sy + (b.y - sy) * wallT;
      for (let k = 0; k < 4; k++) {
        const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 90;
        S.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.18, maxLife: 0.18, color: '255,209,102', size: 1.5 + Math.random() * 1.5 });
      }
      S.pBullets.splice(i, 1);
      continue;
    }
  }

  for (let i = S.eBullets.length - 1; i >= 0; i--) {
    const b = S.eBullets[i];
    
    // 爆破排斥力影响
    if (b.pushVx) {
      b.x += b.pushVx * dt;
      b.y += b.pushVy * dt;
      b.pushVx *= Math.pow(0.92, dt * 60);
      b.pushVy *= Math.pow(0.92, dt * 60);
      if (Math.abs(b.pushVx) < 1 && Math.abs(b.pushVy) < 1) {
        b.pushVx = 0; b.pushVy = 0;
      }
    }
    
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || (S.map && (b.x < -40 || b.x > S.map.w + 40 || b.y < -40 || b.y > S.map.h + 40))) { S.eBullets.splice(i, 1); continue; }
    if (hitsWall(b.x, b.y, 2)) {
      for (let k = 0; k < 3; k++) {
        const a = Math.random() * Math.PI * 2, sp = 25 + Math.random() * 70;
        S.particles.push({ x: b.x, y: b.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.16, maxLife: 0.16, color: '255,92,122', size: 1.5 + Math.random() });
      }
      S.eBullets.splice(i, 1); continue;
    }
    let hitEcho = false;
    for (const e of S.echoes) {
      const dx = b.x - e.x, dy = b.y - e.y;
      if (dx * dx + dy * dy < (b.r + e.r) * (b.r + e.r)) {
        e.hp -= 1; e.hitFlash = 0.15;
        if (e.hp <= 0) destroyEcho(e);
        S.eBullets.splice(i, 1); hitEcho = true; break;
      }
    }
    if (hitEcho) continue;
    const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + p.r;
    if (dx * dx + dy * dy < rr * rr) {
      if (b.blind) {
        applyBlind();
        for (let k = 0; k < 8; k++) {
          const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 80;
          S.particles.push({ x: p.x, y: p.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.4, maxLife: 0.4, color: '255,209,102', size: 2 });
        }
        S.eBullets.splice(i, 1);
      } else if (p.invuln <= 0) {
        hurtPlayer();
        S.eBullets.splice(i, 1);
      }
    }
  }

  const damp = Math.pow(0.9, dt * 60);
  for (let i = S.particles.length - 1; i >= 0; i--) {
    const pt = S.particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt;
    pt.vx *= damp; pt.vy *= damp; pt.life -= dt;
    if (pt.life <= 0) S.particles.splice(i, 1);
  }

  let alive = 0;
  for (const en of S.enemies) if (en.delay <= 0) alive++;
  if (alive === 0 && !S.over) {
    S.waveTimer += dt;
    if (S.waveTimer > 1.5) nextWave();
  }

  // Boss 血条：进入视野淡入，离开视野淡出
  let bossTarget = 0;
  if (S.bossRef && S.enemies.includes(S.bossRef) && S.bossRef.delay <= 0) {
    const v = viewRect(), b = S.bossRef;
    if (b.x + b.r > v.l && b.x - b.r < v.r && b.y + b.r > v.t && b.y - b.r < v.b) bossTarget = 1;
  }
  S.bossBarAlpha += (bossTarget - S.bossBarAlpha) * Math.min(1, dt * 5);
  if (S.bossBarAlpha < 0.004) S.bossBarAlpha = 0;

  if (!MOBILE) updateSkillFades(dt);
  updateCamera(dt);
  updateHUD();
  S.buffUITimer -= dt;
  if (S.buffUITimer <= 0) { S.buffUITimer = 0.1; updateBuffsUI(false); }
}

// ============================================================
//  击杀
// ============================================================
function killEnemy(idx, energyGain) {
  const en = S.enemies[idx];
  if (!en) return;

  if (en.type === 'boss') {
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, sp = 100 + Math.random() * 320;
      S.particles.push({ x: en.x, y: en.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.7, maxLife: 0.7, color: '255,92,122', size: 2 + Math.random() * 4 });
    }
    S.particles.push({ x: en.x, y: en.y, vx: 0, vy: 0, life: 0.8, maxLife: 0.8, color: '255,255,255', size: en.r * 3, ring: true });
    S.score += 100; S.energy = Math.min(S.maxEnergy, S.energy + 4); S.shake = 25; S.flash = 0.6;
    spawnPowerupAt(en.x - 40, en.y, true); spawnPowerupAt(en.x + 40, en.y, true);
    S.eBullets = []; S.bossRef = null;
    sfx(80, 0.5, 'sawtooth', 0.1); setTimeout(() => sfx(140, 0.4, 'sawtooth', 0.06), 120); setTimeout(() => sfx(220, 0.3, 'triangle', 0.05), 260);
    S.enemies.splice(idx, 1); updateHUD(); return;
  }

  for (let i = 0; i < 14; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 180;
    S.particles.push({ x: en.x, y: en.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .5, maxLife: .5, color: en.type === 'shooter' ? '192,132,252' : en.type === 'splitter' ? '126,249,208' : en.type === 'hunter' ? '255,157,92' : '255,92,122', size: 2 + Math.random() * 3 });
  }
  S.particles.push({ x: en.x, y: en.y, vx: 0, vy: 0, life: .3, maxLife: .3, color: '255,255,255', size: en.r * 2, ring: true });

  if (Math.random() < POWERUP_DROP_CHANCE) spawnPowerupAt(en.x, en.y);

  if (en.type === 'splitter') {
    for (let i = 0; i < 2; i++) {
      spawnEnemy('mini', 0);
      const mini = S.enemies[S.enemies.length - 1];
      mini.x = en.x + (Math.random() - .5) * 30; mini.y = en.y + (Math.random() - .5) * 30; mini.delay = 0;
    }
  }
  S.enemies.splice(idx, 1);
  S.combo++; S.comboTimer = 2.0;
  const mult = 1 + S.combo * 0.1;
  S.score += Math.round(10 * mult);
  S.energy = Math.min(S.maxEnergy, S.energy + energyGain);
  S.shake = Math.max(S.shake, 4);
  sfx(880, 0.06, 'sine', 0.025);
  updateHUD();
}

function applyBlind() {
  if (!S.running || S.over) return;
  if (S.blindLock > 0) return;          // 3 秒内不能再次叠加
  S.blindTimer = BLIND_DURATION;
  S.blindLock = BLIND_COOLDOWN;
  sfx(180, 0.28, 'sawtooth', 0.035);
  setTimeout(() => sfx(110, 0.35, 'sine', 0.025), 110);
}

function hurtPlayer() {
  if (S.player.invuln > 0) return;
  S.player.hp--;
  
  if (S.player.hp <= 0 && S.secondChance) {
    S.secondChance = false;
    S.player.hp = 1;
    S.player.invuln = 5.0;
    S.shake = 20;
    S.flash = 0.6;
    S.banner = { text: '第二次机会！', life: 2.0 };
    
    for (let i = 0; i < 40; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 250;
      S.particles.push({
        x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.8, maxLife: 0.8, color: '0,255,204', size: 2 + Math.random() * 3
      });
    }
    S.particles.push({
      x: S.player.x, y: S.player.y, vx: 0, vy: 0,
      life: 0.6, maxLife: 0.6, color: '0,255,204', size: 80, ring: true
    });
    
    sfx(880, 0.15, 'sine', 0.05);
    setTimeout(() => sfx(1320, 0.2, 'sine', 0.04), 100);
    setTimeout(() => sfx(1760, 0.3, 'sine', 0.04), 200);
    updateHUD();
    return;
  }
  
  S.player.invuln = 1.4;
  S.shake = 16; S.flash = 0.35;
  S.combo = 0; S.comboTimer = 0;
  sfx(180, 0.2, 'sawtooth', 0.05);
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 160;
    S.particles.push({ x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .55, maxLife: .55, color: '255,59,92', size: 2 + Math.random() * 3 });
  }
  if (S.player.hp <= 0) gameOver();
  updateHUD();
}

function gameOver() {
  S.over = true; S.running = false;
  setTimeout(showGameOver, 500);
}

// ============================================================
//  渲染
// ============================================================
function render() {
  ctx.fillStyle = '#05060a'; ctx.fillRect(0, 0, W, H);

  // 摄像机：玩家固定在屏幕中央，靠近地图边界时由边界把镜头挡住
  const zoom = S.cam.zoom || 1;
  let shx = 0, shy = 0;
  if (S.shake > 0.4) {
    shx = (Math.random() - .5) * S.shake;
    shy = (Math.random() - .5) * S.shake;
    S.shake *= 0.88;
  } else S.shake = 0;

  ctx.save();
  ctx.translate(W / 2 + shx, H / 2 + shy);
  ctx.scale(zoom, zoom);
  ctx.translate(-S.cam.x, -S.cam.y);
  drawMap();

  // 冲击波（底层）
  for (const sw of S.shockwaves) {
    const a = Math.max(0, sw.life / sw.maxLife);
    ctx.globalAlpha = a * 0.7;
    ctx.strokeStyle = `rgba(${sw.color},1)`;
    ctx.lineWidth = 4 * a;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, 7); ctx.stroke();
    // 内层余波
    ctx.globalAlpha = a * 0.3;
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r * 0.8, 0, 7); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for (const e of S.echoes) {
    if (!e.path.length) continue;
    ctx.beginPath(); ctx.moveTo(e.path[0].x, e.path[0].y);
    for (let i = 1; i < e.path.length; i++) ctx.lineTo(e.path[i].x, e.path[i].y);
    ctx.strokeStyle = 'rgba(95,184,255,.08)'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  drawSniperAid();

  for (const e of S.echoes) {
    const a = Math.min(1, e.life / e.maxLife * 1.5);
    const grd = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, SLOW_RADIUS);
    grd.addColorStop(0, 'rgba(95,184,255,.06)'); grd.addColorStop(1, 'rgba(95,184,255,0)');
    ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(e.x, e.y, SLOW_RADIUS, 0, 7); ctx.fill();

    ctx.globalAlpha = a * .75;
    ctx.shadowColor = e.hitFlash > 0 ? '#ff5c7a' : '#5fb8ff'; ctx.shadowBlur = 16;
    ctx.fillStyle = e.hitFlash > 0 ? 'rgba(255,92,122,.5)' : 'rgba(95,184,255,.35)';
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(95,184,255,.9)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(200,240,255,.9)'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r * .3, 0, 7); ctx.fill();

    const bw = 24, bh = 3, bx = e.x - bw / 2, by = e.y - e.r - 8;
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = e.hp > 1 ? '#5fb8ff' : '#ff5c7a'; ctx.fillRect(bx, by, bw * (e.hp / e.maxHp), bh);
    ctx.globalAlpha = 1;
  }

  // 飞刀
  for (const k of S.knives) {
    if (k.trail.length > 1) {
      for (let i = 0; i < k.trail.length - 1; i++) {
        const t = i / k.trail.length;
        ctx.globalAlpha = t * 0.5;
        ctx.strokeStyle = '#5fb8ff';
        ctx.lineWidth = 1 + t * 2;
        ctx.beginPath(); ctx.moveTo(k.trail[i].x, k.trail[i].y); ctx.lineTo(k.trail[i+1].x, k.trail[i+1].y); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.rotate(k.angle);
    ctx.shadowColor = '#5fb8ff';
    ctx.shadowBlur = 15;
    
    // 核弹标志飞刀造型
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.rotate(i * Math.PI * 2 / 3);
      ctx.arc(0, 0, 22, -Math.PI/6, Math.PI/6);
      ctx.lineTo(8 * Math.cos(Math.PI/6), 8 * Math.sin(Math.PI/6));
      ctx.arc(0, 0, 8, Math.PI/6, -Math.PI/6, true);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.beginPath();
    ctx.arc(0, 0, 5, 0, Math.PI*2);
    ctx.fillStyle = '#0a0b10';
    ctx.fill();
    ctx.strokeStyle = '#e8f4ff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    ctx.restore();
  }

  const cull = viewRect();
  for (const en of S.enemies) {
    if (en.delay > 0) continue;
    if (en.x + en.r < cull.l - 80 || en.x - en.r > cull.r + 80 ||
        en.y + en.r < cull.t - 80 || en.y - en.r > cull.b + 80) continue;
    if (en.type === 'boss') drawBoss(en); else drawEnemy(en);
  }

  for (const b of S.pBullets) {
    if (b.isSniper) {
      if (b.trail && b.trail.length > 1) {
        for (let i = 0; i < b.trail.length - 1; i++) {
          const t = i / b.trail.length;
          ctx.globalAlpha = t * 0.55; ctx.strokeStyle = '#9be7ff'; ctx.lineWidth = 0.4 + t * 2;
          ctx.beginPath(); ctx.moveTo(b.trail[i].x, b.trail[i].y); ctx.lineTo(b.trail[i+1].x, b.trail[i+1].y); ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx));
      ctx.shadowColor = '#9be7ff'; ctx.shadowBlur = 18; ctx.fillStyle = '#ffffff';
      ctx.fillRect(-9, -1, 18, 2); ctx.shadowBlur = 0; ctx.restore();
    } else {
      ctx.shadowColor = b.color; ctx.shadowBlur = 10; ctx.fillStyle = b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    }
  }

  for (const b of S.eBullets) {
    ctx.globalAlpha = Math.min(1, b.life / 0.45);   // 到射程末端淡出
    if (b.blind) {
      ctx.shadowColor = '#ffd166'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffe9b0';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.05, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,209,102,.8)';
      ctx.beginPath(); ctx.arc(b.x - b.vx * 0.012, b.y - b.vy * 0.012, b.r * 0.62, 0, 7); ctx.fill();
      continue;
    }
    if (b.pushVx || b.pushVy) {
      // 受爆破影响的子弹附加银金发光
      ctx.shadowColor = '#d4c48a'; ctx.shadowBlur = 15;
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.2, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
    }
    ctx.shadowColor = '#ff3b5c'; ctx.shadowBlur = 12; ctx.fillStyle = '#ff3b5c';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(b.x - b.r * .25, b.y - b.r * .25, b.r * .4, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawPowerups();
  drawPlayer();
  drawSniperBarrel();
  
  // 蓄力特效
  if (S.isChargingMelee) {
    const power = S.meleeCharge / MELEE_MAX_CHARGE;
    const p = S.player;
    for (const side of [-1, 1]) {
      const a = p.angle + side * MELEE_ANGLE;
      const dist = 20 + power * 15;
      const kx = p.x + Math.cos(a) * dist;
      const ky = p.y + Math.sin(a) * dist;
      
      ctx.save();
      ctx.translate(kx, ky);
      ctx.rotate(performance.now() / 1000 * (10 + power * 15));
      ctx.scale(0.6 + power * 0.4, 0.6 + power * 0.4);
      ctx.globalAlpha = 0.5 + power * 0.5;
      
      ctx.shadowColor = '#5fb8ff';
      ctx.shadowBlur = 10 + power * 15;
      ctx.fillStyle = '#e8f4ff';
      
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        ctx.save();
        ctx.rotate(i * Math.PI * 2 / 3);
        ctx.arc(0, 0, 22, -Math.PI/6, Math.PI/6);
        ctx.lineTo(8 * Math.cos(Math.PI/6), 8 * Math.sin(Math.PI/6));
        ctx.arc(0, 0, 8, Math.PI/6, -Math.PI/6, true);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2);
      ctx.fillStyle = '#0a0b10'; ctx.fill();
      ctx.strokeStyle = '#e8f4ff'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }
    
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(-Math.PI / 2);
    ctx.beginPath();
    ctx.arc(0, 0, p.r + 18, 0, power * Math.PI * 2);
    ctx.strokeStyle = '#5fb8ff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();
  }

  for (const pt of S.particles) {
    const a = Math.max(0, pt.life / pt.maxLife);
    if (pt.text) {
      ctx.globalAlpha = Math.min(1, a * 1.6); ctx.fillStyle = `rgba(${pt.color},1)`;
      ctx.font = `900 ${pt.size}px -apple-system, "PingFang SC", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.shadowColor = `rgba(${pt.color},.8)`; ctx.shadowBlur = 8;
      ctx.fillText(pt.text, pt.x, pt.y); ctx.shadowBlur = 0; continue;
    }
    if (pt.ring) {
      ctx.globalAlpha = a * .6; ctx.strokeStyle = `rgba(${pt.color},1)`; ctx.lineWidth = 2 * a;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * (1.3 - a * .6), 0, 7); ctx.stroke();
    } else {
      ctx.globalAlpha = a; ctx.fillStyle = `rgba(${pt.color},1)`;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * a, 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawBlindMask();
  drawSniperCrosshair();
  drawBossBar();
  drawMinimap();
  if (!MOBILE) drawSkillHUD();
  drawBlindBadge();

  // 广域视野：紫色边缘提示
  const vk = Math.max(0, Math.min(1, (1 - S.cam.zoom) / (1 - VISION_ZOOM)));
  if (vk > 0.01) {
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.max(W, H) * 0.72);
    vg.addColorStop(0, 'rgba(192,132,252,0)');
    vg.addColorStop(1, `rgba(192,132,252,${0.20 * vk})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(192,132,252,${0.35 * vk})`;
    ctx.lineWidth = 3; ctx.strokeRect(1.5, 1.5, W - 3, H - 3);
  }

  if (S.flash > 0) { ctx.fillStyle = `rgba(255,59,92,${S.flash * .45})`; ctx.fillRect(0, 0, W, H); }
  if (S.whiteFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${S.whiteFlash * 3})`; ctx.fillRect(0, 0, W, H); }

  if (S.banner.life > 0) {
    const a = Math.min(1, S.banner.life * 1.8);
    ctx.globalAlpha = a;
    ctx.fillStyle = S.banner.text.includes('BOSS') ? '#ff3b5c' : 
                    (S.banner.text.includes('飞刀') || S.banner.text.includes('恢复') ? '#5fb8ff' :
                    (S.banner.text.includes('爆破') || S.banner.text.includes('机会') ? '#d4c48a' :
                    (S.banner.text.includes('视野') ? '#c084fc' : '#e8ecf5')));
    const bfs = Math.min(64, Math.max(26, (W * 0.92) / Math.max(5, S.banner.text.length)));
    ctx.font = `900 ${bfs}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.banner.text, W / 2, H * .4);
    ctx.globalAlpha = 1;
  }
}

function drawMap() {
  const map = S.map;
  if (!map) return;
  const theme = map.theme || {};
  const z = S.cam.zoom || 1;
  const vw = W / z, vh = H / z;
  const l = S.cam.x - vw / 2, t = S.cam.y - vh / 2;
  const r = l + vw, b = t + vh;

  // 地面
  ctx.fillStyle = theme.floor || '#0b0e17';
  ctx.fillRect(0, 0, map.w, map.h);

  // 网格
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, map.w, map.h); ctx.clip();
  ctx.strokeStyle = theme.grid || 'rgba(90,130,200,.05)';
  ctx.lineWidth = 1 / z;
  const gs = 56;
  ctx.beginPath();
  const gx0 = Math.max(0, Math.floor(l / gs) * gs), gx1 = Math.min(map.w, r);
  const gy0 = Math.max(0, Math.floor(t / gs) * gs), gy1 = Math.min(map.h, b);
  for (let x = gx0; x <= gx1; x += gs) { ctx.moveTo(x, Math.max(0, t)); ctx.lineTo(x, Math.min(map.h, b)); }
  for (let y = gy0; y <= gy1; y += gs) { ctx.moveTo(Math.max(0, l), y); ctx.lineTo(Math.min(map.w, r), y); }
  ctx.stroke();
  ctx.restore();

  // 地图边界
  ctx.strokeStyle = theme.edge || 'rgba(95,184,255,.35)';
  ctx.lineWidth = 2 / z;
  ctx.strokeRect(0, 0, map.w, map.h);

  // 墙体结构
  const glow = theme.glow || '95,184,255';
  for (const wl of map.walls) {
    if (wl.x > r + 20 || wl.x + wl.w < l - 20 || wl.y > b + 20 || wl.y + wl.h < t - 20) continue;
    ctx.fillStyle = theme.wall || '#161d2c';
    ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
    ctx.strokeStyle = theme.edge || 'rgba(95,184,255,.5)';
    ctx.lineWidth = 1.5 / z;
    ctx.strokeRect(wl.x + 0.75, wl.y + 0.75, wl.w - 1.5, wl.h - 1.5);
    ctx.fillStyle = `rgba(${glow},.12)`;
    ctx.fillRect(wl.x + 4, wl.y + 4, Math.max(0, wl.w - 8), 3);
  }
}

// —— 小地图：只由黑白结构 + 绿点（玩家）+ 粉点（Boss）构成 ——
function drawMinimap() {
  const bw = MINIMAP_W, bh = MINIMAP_H;
  if (S._miniShown !== !!S.mini.global) {
    S._miniShown = !!S.mini.global;
    updateMinimapLabel();
  }
  miniCtx.setTransform(miniDpr, 0, 0, miniDpr, 0, 0);
  miniCtx.clearRect(0, 0, bw, bh);
  miniCtx.fillStyle = '#000';
  miniCtx.fillRect(0, 0, bw, bh);

  const map = S.map;
  if (!map || !map.mm || !S.player) return;
  const p = S.player;
  const global = !!S.mini.global;
  let toBox;

  if (global) {
    // 按 M：整张地图，玩家点移动到绝对位置
    const fit = Math.min(bw / map.w, bh / map.h);
    const dw = map.w * fit, dh = map.h * fit;
    const ox = (bw - dw) / 2, oy = (bh - dh) / 2;
    miniCtx.drawImage(map.mm, 0, 0, map.mm.width, map.mm.height, ox, oy, dw, dh);

    const vw = W / S.cam.zoom, vh = H / S.cam.zoom;
    miniCtx.strokeStyle = 'rgba(255,255,255,.42)';
    miniCtx.lineWidth = 1;
    miniCtx.setLineDash([3, 3]);
    miniCtx.strokeRect(ox + (S.cam.x - vw / 2) * fit, oy + (S.cam.y - vh / 2) * fit, vw * fit, vh * fit);
    miniCtx.setLineDash([]);
    toBox = (x, y) => ({ x: ox + x * fit, y: oy + y * fit });
  } else {
    // 默认：固定世界跨度的局部缩略，玩家永远在中心
    const s = bw / MINIMAP_LOCAL_SPAN;
    miniCtx.save();
    miniCtx.beginPath(); miniCtx.rect(0, 0, bw, bh); miniCtx.clip();
    miniCtx.translate(bw / 2, bh / 2);
    miniCtx.scale(s, s);
    miniCtx.translate(-p.x, -p.y);
    miniCtx.drawImage(map.mm, 0, 0, map.mm.width, map.mm.height, 0, 0, map.w, map.h);
    miniCtx.restore();
    toBox = (x, y) => ({ x: bw / 2 + (x - p.x) * s, y: bh / 2 + (y - p.y) * s });
  }

  // Boss：粉点（超出视野时贴着边缘显示）
  const boss = S.bossRef;
  if (boss && S.enemies.includes(boss) && boss.delay <= 0) {
    const q = toBox(boss.x, boss.y);
    const cx = Math.max(5, Math.min(bw - 5, q.x));
    const cy = Math.max(5, Math.min(bh - 5, q.y));
    const clamped = cx !== q.x || cy !== q.y;
    miniCtx.globalAlpha = clamped ? 0.55 : 1;
    miniCtx.fillStyle = '#ff4fa8';
    miniCtx.shadowColor = '#ff4fa8';
    miniCtx.shadowBlur = 9;
    miniCtx.beginPath(); miniCtx.arc(cx, cy, 4, 0, 7); miniCtx.fill();
    miniCtx.shadowBlur = 0;
    miniCtx.globalAlpha = 1;
  }

  // 只剩少量怪时，用青点标出剩余位置，方便寻找
  const rest = [];
  for (const en of S.enemies) {
    if (en.type !== 'boss' && en.delay <= 0) rest.push(en);
  }
  if (rest.length > 0 && rest.length <= 4) {
    for (const en of rest) {
      const q = toBox(en.x, en.y);
      const cx = Math.max(4, Math.min(bw - 4, q.x));
      const cy = Math.max(4, Math.min(bh - 4, q.y));
      const clamped = cx !== q.x || cy !== q.y;
      miniCtx.globalAlpha = clamped ? 0.55 : 0.95;
      miniCtx.fillStyle = '#22e6ff';
      miniCtx.shadowColor = '#22e6ff';
      miniCtx.shadowBlur = 8;
      miniCtx.beginPath(); miniCtx.arc(cx, cy, 3.2, 0, 7); miniCtx.fill();
      miniCtx.shadowBlur = 0;
    }
    miniCtx.globalAlpha = 1;
  }

  // 玩家：绿点
  const pm = global ? toBox(p.x, p.y) : { x: bw / 2, y: bh / 2 };
  miniCtx.fillStyle = '#39ff88';
  miniCtx.shadowColor = '#39ff88';
  miniCtx.shadowBlur = 10;
  miniCtx.beginPath(); miniCtx.arc(pm.x, pm.y, 4, 0, 7); miniCtx.fill();
  miniCtx.shadowBlur = 0;
  miniCtx.strokeStyle = 'rgba(0,0,0,.85)';
  miniCtx.lineWidth = 1;
  miniCtx.beginPath(); miniCtx.arc(pm.x, pm.y, 4, 0, 7); miniCtx.stroke();
}

// —— 技能状态环：圆环进度 + 中心图标，未生效淡出、生效淡入 ——
function getSkillHudStates() {
  const bombMax = Math.max(0.8, BOMB_CD_BASE - 0.3 * (Math.max(1, S.bombStacks) - 1));
  return [
    {
      id: 'echo', label: '残影', color: '95,184,255',
      show: S.echoes.length > 0 || S.echoCd > 0,
      active: S.energy >= ECHO_COST && S.echoes.length < MAX_ECHO && S.echoCd <= 0,
      progress: Math.min(1, S.energy / ECHO_COST)
    },
    {
      id: 'detonate', label: '引爆', color: '255,157,92',
      show: S.echoes.length > 0 || S.detonateCd > 0,
      active: S.echoes.length > 0 && S.detonateCd <= 0,
      progress: S.detonateCd > 0 ? 1 - S.detonateCd / DETONATE_CD : (S.echoes.length > 0 ? 1 : 0)
    },
    {
      id: 'bomb', label: '爆破', color: '212,196,138',
      show: S.bombCd > 0,
      active: S.bombUnlocked && S.bombCd <= 0,
      progress: !S.bombUnlocked ? 0 : 1 - S.bombCd / bombMax
    },
    {
      id: 'sniper', label: '狙击', color: '232,244,255',
      show: S.sniperMode || S.sniperCd > 0,
      active: S.sniperMode && S.sniperMag > 0,
      progress: S.sniperMag / SNIPER_MAX_MAG
    },
    {
      id: 'melee', label: '飞刀', color: '95,184,255',
      show: S.isChargingMelee || S.meleeCd > 0 || S.knives.length > 0,
      active: S.isChargingMelee || (S.meleeUnlocked && S.meleeCount >= 2 && S.meleeCd <= 0),
      progress: S.isChargingMelee ? S.meleeCharge / MELEE_MAX_CHARGE
        : (S.meleeCd > 0 ? 1 - S.meleeCd / MELEE_CD : (S.meleeCount >= 2 ? 1 : 0))
    },
    {
      id: 'focus', label: '精准', color: '126,249,208',
      show: !!S.focusActive,
      active: !!S.focusActive,
      progress: S.focusActive ? 1 : 0
    },
    {
      id: 'vision', label: '视野', color: '192,132,252',
      show: S.visionTimer > 0,
      active: S.visionTimer > 0,
      progress: Math.min(1, S.visionTimer / VISION_DURATION)
    },
    {
      id: 'second', label: '免死', color: '0,255,204',
      show: false,
      active: !!S.secondChance,
      progress: S.secondChance ? 1 : 0
    },
  ];
}

function updateSkillFades(dt) {
  if (MOBILE) return;
  const states = getSkillHudStates();
  const k = Math.min(1, dt * 6);
  const decay = Math.pow(0.03, dt);
  let any = false;
  for (let i = 0; i < states.length; i++) {
    const st = states[i];
    if (st.show) any = true;
    const target = st.active ? 1 : 0.28;
    const f = S.skillFade[st.id] || 0;
    S.skillFade[st.id] = f + (target - f) * k;
    const was = !!S.skillActive[st.id];
    if (st.active && !was) S.skillPop[st.id] = 1;
    S.skillActive[st.id] = !!st.active;
    S.skillPop[st.id] = (S.skillPop[st.id] || 0) * decay;
  }
  // 状态栏只在有技能生效 / 冷却时弹出，其余时间收起
  S.skillHudAlpha += ((any ? 1 : 0) - S.skillHudAlpha) * Math.min(1, dt * 7);
  if (S.skillHudAlpha < 0.004) S.skillHudAlpha = 0;
}

function drawSkillHUD() {
  if (MOBILE || !S.map || !S.player || S.skillHudAlpha < 0.01) return;
  const states = getSkillHudStates();
  const n = states.length, gap = 58, r = 17;
  const startX = W / 2 - (n - 1) * gap / 2;
  const cy = H - 142;
  const rowA = S.skillHudAlpha;

  ctx.save();
  ctx.translate(0, (1 - rowA) * 9);

  for (let i = 0; i < n; i++) {
    const st = states[i];
    const a = S.skillFade[st.id] || 0;
    const pop = S.skillPop[st.id] || 0;
    const scale = 0.9 + 0.1 * a + 0.18 * pop;
    const x = startX + i * gap;

    ctx.save();
    ctx.translate(x, cy);
    ctx.scale(scale, scale);
    ctx.globalAlpha = a * rowA;

    ctx.fillStyle = 'rgba(8,12,20,.78)';
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.10)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke();

    const prog = Math.max(0, Math.min(1, st.progress));
    if (prog > 0.002) {
      if (pop > 0.05) { ctx.shadowColor = `rgba(${st.color},.9)`; ctx.shadowBlur = 14 * pop; }
      ctx.strokeStyle = `rgba(${st.color},${st.active ? 0.95 : 0.45})`;
      ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, r, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2); ctx.stroke();
      ctx.lineCap = 'butt';
      ctx.shadowBlur = 0;
    }

    drawSkillGlyph(st.id, 0, 0, r * 0.56, st.color, st.active ? 1 : 0.6);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = a * 0.55 * rowA;
    ctx.fillStyle = '#cfe0ff';
    ctx.font = '700 7px -apple-system, "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText(st.label, x, cy + r * scale + 3);
    ctx.restore();
  }
  ctx.restore();
}

function drawSkillGlyph(id, x, y, r, color, alpha) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = `rgba(${color},${0.95 * alpha})`;
  ctx.fillStyle = `rgba(${color},${0.95 * alpha})`;
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';

  if (id === 'echo') {
    ctx.beginPath(); ctx.arc(r * 0.18, 0, r * 0.58, 0, 7); ctx.stroke();
    ctx.globalAlpha *= 0.5;
    ctx.beginPath(); ctx.arc(-r * 0.4, r * 0.1, r * 0.42, 0, 7); ctx.stroke();
  } else if (id === 'detonate') {
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2, rr = i % 2 ? r * 0.55 : r;
      if (i === 0) { ctx.beginPath(); ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      else ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    }
    ctx.closePath(); ctx.fill();
  } else if (id === 'bomb') {
    ctx.beginPath(); ctx.arc(0, 0, r * 0.35, 0, 7); ctx.fill();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5);
      ctx.lineTo(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95);
      ctx.stroke();
    }
  } else if (id === 'sniper') {
    ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, 7); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-r, 0); ctx.lineTo(-r * 0.35, 0);
    ctx.moveTo(r * 0.35, 0); ctx.lineTo(r, 0);
    ctx.moveTo(0, -r); ctx.lineTo(0, -r * 0.35);
    ctx.moveTo(0, r * 0.35); ctx.lineTo(0, r);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 1.6, 0, 7); ctx.fill();
  } else if (id === 'melee') {
    for (let i = 0; i < 3; i++) {
      const a = i / 3 * Math.PI * 2 - Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, 7); ctx.fill();
  } else if (id === 'focus') {
    ctx.beginPath();
    ctx.moveTo(-r, 0);
    ctx.quadraticCurveTo(0, -r * 0.8, r, 0);
    ctx.quadraticCurveTo(0, r * 0.8, -r, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.3, 0, 7); ctx.fill();
  } else if (id === 'vision') {
    ctx.beginPath();
    ctx.moveTo(-r * 0.9, 0);
    ctx.quadraticCurveTo(0, -r * 0.7, r * 0.9, 0);
    ctx.quadraticCurveTo(0, r * 0.7, -r * 0.9, 0);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, r * 0.28, 0, 7); ctx.fill();
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.95, 0); ctx.lineTo(s * r * 1.35, 0);
      ctx.stroke();
    }
  } else if (id === 'second') {
    ctx.beginPath();
    ctx.moveTo(0, r * 0.45);
    ctx.bezierCurveTo(-r, -r * 0.3, -r * 0.5, -r, 0, -r * 0.45);
    ctx.bezierCurveTo(r * 0.5, -r, r, -r * 0.3, 0, r * 0.45);
    ctx.fill();
  }
  ctx.restore();
}

function roundRectPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// 蜡烛图标：失明状态与致盲怪都用它
function drawCandleIcon(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha *= (alpha === undefined ? 1 : alpha);
  const waxW = s * 0.5, waxH = s * 0.95;
  ctx.fillStyle = 'rgba(255,246,224,.96)';
  ctx.fillRect(x - waxW / 2, y - waxH * 0.15, waxW, waxH);
  ctx.strokeStyle = 'rgba(80,60,40,.8)'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y - waxH * 0.15); ctx.lineTo(x, y - waxH * 0.32); ctx.stroke();

  const fy = y - waxH * 0.48;
  const g = ctx.createRadialGradient(x, fy, 0, x, fy, s * 0.85);
  g.addColorStop(0, 'rgba(255,255,230,1)');
  g.addColorStop(0.4, 'rgba(255,209,102,.95)');
  g.addColorStop(1, 'rgba(255,140,60,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, fy, s * 0.85, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,200,1)';
  ctx.beginPath(); ctx.ellipse(x, fy, s * 0.14, s * 0.3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,170,70,.9)';
  ctx.beginPath(); ctx.ellipse(x, fy + s * 0.07, s * 0.08, s * 0.16, 0, 0, 7); ctx.fill();
  ctx.restore();
}

// 失明遮罩：只保留玩家周围 7 倍半径的可见区域
function drawBlindMask() {
