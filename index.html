function drawSniperAid() {
  if (S.sniperAidAlpha < 0.02 || !S.player) return;
  const p = S.player, R = SNIPER_RING_R, spread = S.currentSpread, angle = p.angle, aidA = S.sniperAidAlpha;
  ctx.save(); ctx.globalAlpha = aidA;

  const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
  grad.addColorStop(0, `rgba(${SNIPER_RED},0.03)`); grad.addColorStop(0.5, `rgba(${SNIPER_RED},0.10)`); grad.addColorStop(1, `rgba(${SNIPER_RED},0.20)`);

  ctx.beginPath(); ctx.arc(p.x, p.y, R, angle - spread / 2, angle + spread / 2); ctx.lineTo(p.x, p.y); ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  const warn = spread > SPREAD_WARN;
  ctx.strokeStyle = warn ? `rgba(${SNIPER_WARN},0.55)` : `rgba(${SNIPER_RED_LINE},0.50)`; ctx.lineWidth = 1;
  for (const s of [-1, 1]) {
    const a = angle + s * spread / 2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * R, p.y + Math.sin(a) * R); ctx.stroke();
  }

  const ringAlpha = (S.sniperCd > 0 ? 0.12 : 0.28) * aidA;
  ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.arc(p.x, p.y, R - 1.5, 0, Math.PI * 2, true);
  ctx.fillStyle = `rgba(${SNIPER_RED},${ringAlpha})`; ctx.fill();

  if (S.sniperCd > 0) {
    const prog = 1 - S.sniperCd / SNIPER_CD;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
    ctx.strokeStyle = 'rgba(232,244,255,0.55)'; ctx.lineWidth = 2; ctx.stroke();
    const headA = -Math.PI / 2 + prog * Math.PI * 2;
    ctx.fillStyle = '#eaffff'; ctx.beginPath(); ctx.arc(p.x + Math.cos(headA) * R, p.y + Math.sin(headA) * R, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawSniperBarrel() {
  if (!S.sniperMode || !S.player) return;
  const p = S.player, recoil = S.sniperRecoil;
  const reloadT = Math.max(0, Math.min(1, 1 - S.sniperCd / SNIPER_CD));
  const dip = Math.sin(Math.min(1, reloadT * 1.15) * Math.PI) * 0.38;
  const a = p.angle + dip;
  const len = p.r + 24 - recoil * 6, cdDim = S.sniperCd > 0;

  ctx.save(); ctx.globalAlpha = cdDim ? 0.55 : 1;
  ctx.strokeStyle = 'rgba(232,244,255,.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.stroke();

  const x1 = p.x + Math.cos(a) * (p.r - 2), y1 = p.y + Math.sin(a) * (p.r - 2);
  const x2 = p.x + Math.cos(a) * len, y2 = p.y + Math.sin(a) * len;

  ctx.strokeStyle = cdDim ? '#8fa8bd' : '#e8f4ff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  if (!cdDim) { ctx.shadowColor = '#9be7ff'; ctx.shadowBlur = 8; }
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineCap = 'butt';

  ctx.save(); ctx.translate(x2, y2); ctx.rotate(a); ctx.fillStyle = '#e8f4ff'; ctx.fillRect(-1, -2, 3, 4); ctx.restore();

  if (S.muzzleFlash > 0) {
    ctx.globalAlpha = Math.max(0, S.muzzleFlash / 0.08);
    ctx.save(); ctx.translate(x2, y2); ctx.rotate(a);
    const g = ctx.createLinearGradient(0, 0, 22, 0);
    g.addColorStop(0, 'rgba(234,255,255,1)'); g.addColorStop(1, 'rgba(234,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(22, 0); ctx.lineTo(0, 4); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  ctx.restore();

  // 装填：弹匣滑入 + 环形进度（每发单独冷却）
  if (cdDim) {
    const k = Math.min(1, reloadT * 1.7);
    ctx.save();
    ctx.globalAlpha = 0.5 * (1 - reloadT * 0.5);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.angle + Math.PI / 2);
    const my = 20 - 18 * k;
    ctx.fillStyle = '#e8f4ff';
    ctx.fillRect(-3.5, my, 7, 12);
    ctx.strokeStyle = 'rgba(10,11,16,.8)'; ctx.lineWidth = 1;
    ctx.strokeRect(-3.5, my, 7, 12);
    ctx.restore();

    const R = p.r + 13;
    ctx.save();
    ctx.strokeStyle = 'rgba(232,244,255,.16)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = 'rgba(155,231,255,.8)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(p.x, p.y, R, -Math.PI / 2, -Math.PI / 2 + reloadT * Math.PI * 2); ctx.stroke();
    ctx.lineCap = 'butt';
    const ba = -Math.PI / 2 + reloadT * Math.PI * 2;
    ctx.fillStyle = '#eaffff';
    ctx.beginPath(); ctx.arc(p.x + Math.cos(ba) * R, p.y + Math.sin(ba) * R, 2.5, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawSniperCrosshair() {
  if (!S.sniperMode) return;
  const mx = S.mouse.x, my = S.mouse.y, r = 10 + S.currentSpread * 120;
  const baseA = S.sniperCd > 0 ? 0.35 : 0.6;
  const failA = (S.sniperFailFlash > 0) ? S.sniperFailFlash / 0.08 : 0;

  ctx.save();
  ctx.strokeStyle = failA > 0 ? `rgba(255,59,92,${baseA + failA * 0.4})` : `rgba(232,244,255,${baseA})`;
  ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(mx, my, r, 0, 7); ctx.stroke();
  ctx.fillStyle = `rgba(232,244,255,${baseA})`; ctx.beginPath(); ctx.arc(mx, my, 1.5, 0, 7); ctx.fill();

  const tick = 5, gap = 3;
  ctx.beginPath();
  ctx.moveTo(mx - r - gap - tick, my); ctx.lineTo(mx - r - gap, my);
  ctx.moveTo(mx + r + gap, my); ctx.lineTo(mx + r + gap + tick, my);
  ctx.moveTo(mx, my - r - gap - tick); ctx.lineTo(mx, my - r - gap);
  ctx.moveTo(mx, my + r + gap); ctx.lineTo(mx, my + r + gap + tick);
  ctx.stroke();

  if (S.sniperCd > 0) {
    const prog = 1 - S.sniperCd / SNIPER_CD;
    ctx.beginPath(); ctx.arc(mx, my, Math.max(2, r - 4), -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
    ctx.strokeStyle = 'rgba(155,231,255,.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function drawBossBar() {
  const boss = S.bossRef;
  if (!boss || !S.enemies.includes(boss) || boss.delay > 0 || S.bossBarAlpha < 0.01) return;
  const bw = Math.min(W * (MOBILE ? 0.42 : 0.55), 480), bh = 10, bx = (W - bw) / 2, by = MOBILE ? 66 : 76;
  const alpha = S.bossBarAlpha;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(0, (1 - alpha) * -8);

  ctx.fillStyle = 'rgba(10,12,20,.85)'; ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8);
  ctx.fillStyle = 'rgba(255,59,92,.15)'; ctx.fillRect(bx, by, bw, bh);
  const ratio = Math.max(0, boss.hp / boss.maxHp);
  const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  grad.addColorStop(0, '#ff3b5c'); grad.addColorStop(1, '#ff8c5c');
  ctx.fillStyle = grad; ctx.fillRect(bx, by, bw * ratio, bh);
  ctx.strokeStyle = 'rgba(255,92,122,.5)'; ctx.lineWidth = 1; ctx.strokeRect(bx - 0.5, by - 0.5, bw + 1, bh + 1);
  ctx.fillStyle = '#ff3b5c'; ctx.font = '800 11px -apple-system, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText('BOSS', W / 2, by - 8);
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.font = '700 9px -apple-system, sans-serif'; ctx.textBaseline = 'middle';
  ctx.fillText(`${Math.ceil(boss.hp)} / ${boss.maxHp}`, W / 2, by + bh / 2 + 0.5);
  ctx.restore();
}

function drawBoss(en) {
  const flash = en.hitFlash > 0, t = en.age;
  const g = ctx.createRadialGradient(en.x, en.y, 0, en.x, en.y, en.r * 3);
  g.addColorStop(0, 'rgba(255,59,92,.28)'); g.addColorStop(1, 'rgba(255,59,92,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(en.x, en.y, en.r * 3, 0, 7); ctx.fill();

  ctx.save(); ctx.translate(en.x, en.y);
  ctx.rotate(t * 0.8);
  ctx.strokeStyle = 'rgba(255,92,122,.6)'; ctx.lineWidth = 3; ctx.setLineDash([12, 8]);
  ctx.beginPath(); ctx.arc(0, 0, en.r * 1.35, 0, 7); ctx.stroke(); ctx.setLineDash([]);

  ctx.rotate(-t * 0.8);
  ctx.fillStyle = flash ? '#fff' : '#ff3b5c'; ctx.shadowColor = '#ff3b5c'; ctx.shadowBlur = 24;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + t * 0.4, r = en.r * (i % 2 === 0 ? 1 : 0.72);
    const x = Math.cos(a) * r, y = Math.sin(a) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath(); ctx.fill(); ctx.shadowBlur = 0;

  ctx.fillStyle = flash ? '#fff' : '#ff8c5c'; ctx.beginPath(); ctx.arc(0, 0, en.r * 0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0b10'; ctx.beginPath();
  ctx.arc(-en.r * 0.16, -en.r * 0.06, en.r * 0.09, 0, 7); ctx.arc(en.r * 0.16, -en.r * 0.06, en.r * 0.09, 0, 7);
  ctx.fill(); ctx.restore();
}

function drawPowerups() {
  const t = performance.now() / 1000;
  for (const pu of S.powerups) {
    const def = POWERUP_TYPES[pu.type], bob = Math.sin(t * 3 + pu.bob) * 4, x = pu.x, y = pu.y + bob;
    if (pu.life < 3.5 && Math.floor(pu.life * 6) % 2 === 0) continue;
    const spawnK = Math.min(1, pu.spawnT / 0.3), scale = 0.5 + spawnK * 0.5;

    ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
    const glowR = 26 + Math.sin(t * 4 + pu.bob) * 3;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, glowR);
    g.addColorStop(0, `rgba(${def.rgb},.3)`); g.addColorStop(1, `rgba(${def.rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, glowR, 0, 7); ctx.fill();

    ctx.rotate(t * 1.4 + pu.bob); ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.stroke(); ctx.setLineDash([]); ctx.rotate(-(t * 1.4 + pu.bob));

    ctx.fillStyle = 'rgba(10,14,24,.9)'; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.fill();
    ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 13, 0, 7); ctx.stroke();

    if (pu.type === 'fireRate') {
      ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.moveTo(2, -9); ctx.lineTo(-5, 1); ctx.lineTo(-1, 1); ctx.lineTo(-3, 9); ctx.lineTo(5, -2); ctx.lineTo(1, -2); ctx.closePath(); ctx.fill();
      ctx.shadowBlur = 0;
    } else if (pu.type === 'spread') {
      ctx.strokeStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 10; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = -1; i <= 1; i++) {
        ctx.save(); ctx.rotate(i * 0.5);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -9); ctx.moveTo(-3, -6); ctx.lineTo(0, -9); ctx.lineTo(3, -6); ctx.stroke(); ctx.restore();
      }
      ctx.shadowBlur = 0;
    } else if (pu.type === 'sniper') {
      ctx.strokeStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 10; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(-7, 0); ctx.lineTo(-2, 0); ctx.moveTo(2, 0); ctx.lineTo(7, 0); ctx.moveTo(0, -7); ctx.lineTo(0, -2); ctx.moveTo(0, 2); ctx.lineTo(0, 7); ctx.stroke();
      ctx.fillStyle = def.color; ctx.beginPath(); ctx.arc(0, 0, 1.5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(232,244,255,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.stroke();
    } else if (pu.type === 'melee') {
      ctx.save(); ctx.scale(0.45, 0.45);
      ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 15;
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        ctx.save(); ctx.rotate(i * Math.PI * 2 / 3);
        ctx.arc(0, 0, 22, -Math.PI/6, Math.PI/6);
        ctx.lineTo(8 * Math.cos(Math.PI/6), 8 * Math.sin(Math.PI/6));
        ctx.arc(0, 0, 8, Math.PI/6, -Math.PI/6, true);
        ctx.closePath(); ctx.fill(); ctx.restore();
      }
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fillStyle = '#0a0b10'; ctx.fill();
      ctx.strokeStyle = def.color; ctx.lineWidth = 2; ctx.stroke();
      ctx.shadowBlur = 0; ctx.restore();
    } else if (pu.type === 'heal') {
      ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 10;
      ctx.fillRect(-3, -9, 6, 18);
      ctx.fillRect(-9, -3, 18, 6);
      ctx.shadowBlur = 0;
    } else if (pu.type === 'bomb') {
      // 爆破图标：银金色的冲击中心
      ctx.strokeStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 12;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, 4, 0, 7); ctx.stroke();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 6, Math.sin(a) * 6);
        ctx.lineTo(Math.cos(a) * 11, Math.sin(a) * 11);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    } else if (pu.type === 'secondChance') {
      // 爱心 + 循环箭头
      ctx.fillStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(0, 3);
      ctx.bezierCurveTo(-8, -4, -5, -11, 0, -6);
      ctx.bezierCurveTo(5, -11, 8, -4, 0, 3);
      ctx.fill();
      // 右上角循环标志
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(6, -6, 4, 0.3, Math.PI * 1.7);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.moveTo(8, -10); ctx.lineTo(10, -7); ctx.lineTo(6, -7); ctx.closePath(); ctx.fill();
    } else if (pu.type === 'vision') {
      // 广域视野：眼睛 + 向外扩张的双箭头
      ctx.strokeStyle = def.color; ctx.shadowColor = def.color; ctx.shadowBlur = 10;
      ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-9, 0);
      ctx.quadraticCurveTo(0, -7.5, 9, 0);
      ctx.quadraticCurveTo(0, 7.5, -9, 0);
      ctx.stroke();
      ctx.fillStyle = def.color;
      ctx.beginPath(); ctx.arc(0, 0, 3.2, 0, 7); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1.5;
      for (const s of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(s * 12, 0); ctx.lineTo(s * 17, 0);
        ctx.moveTo(s * 14.5, -2.6); ctx.lineTo(s * 17.5, 0); ctx.lineTo(s * 14.5, 2.6);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
    }
    ctx.restore();
  }
}

function drawPlayer() {
  const p = S.player; if (!p) return;
  
  // 第二次机会的无敌光环
  if (p.invuln > 1.4) {
    ctx.strokeStyle = `rgba(0,255,204,${0.3 + 0.2 * Math.sin(performance.now()/100)})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 8, 0, Math.PI * 2); ctx.stroke();
  }
  
  const blink = p.invuln > 0 && p.invuln < 1.4 && Math.floor(p.invuln * 14) % 2 === 0;
  if (blink) return;

  let near = false;
  for (const pu of S.powerups) if (Math.hypot(pu.x - p.x, pu.y - p.y) < 80) { near = true; break; }
  if (near) {
    ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 5]);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 16, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }

  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3.2);
  g.addColorStop(0, 'rgba(255,255,255,.12)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 3.2, 0, 7); ctx.fill();
  ctx.fillStyle = S.sniperMode ? '#eaf6ff' : (S.isChargingMelee ? '#5fb8ff' : '#e8ecf5');
  ctx.strokeStyle = '#0a0b10'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(p.x + Math.cos(p.angle) * (p.r - 2), p.y + Math.sin(p.angle) * (p.r - 2));
  ctx.lineTo(p.x + Math.cos(p.angle + 2.5) * p.r * .55, p.y + Math.sin(p.angle + 2.5) * p.r * .55);
  ctx.lineTo(p.x + Math.cos(p.angle - 2.5) * p.r * .55, p.y + Math.sin(p.angle - 2.5) * p.r * .55);
  ctx.closePath(); ctx.fillStyle = '#0a0b10'; ctx.fill();
}

function drawEnemy(en) {
  ctx.save(); ctx.translate(en.x, en.y);
  const flash = en.hitFlash > 0;
  const rgb = en.type === 'shooter' ? '192,132,252' :
    en.type === 'blinder' ? '255,209,102' :
    en.type === 'splitter' ? '126,249,208' :
    en.type === 'hunter' ? '255,157,92' :
    en.type === 'mini' ? '255,157,92' : '255,92,122';
  if (S.enemies.length <= 120) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, en.r * 2.4);
    g.addColorStop(0, `rgba(${rgb},.18)`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, en.r * 2.4, 0, 7); ctx.fill();
  } else {
    ctx.fillStyle = `rgba(${rgb},.07)`;
    ctx.beginPath(); ctx.arc(0, 0, en.r * 1.7, 0, 7); ctx.fill();
  }

  ctx.rotate(en.age * 1.2);
  if (en.type === 'hunter') {
    ctx.beginPath(); ctx.moveTo(0, -en.r * 1.2); ctx.lineTo(en.r, 0); ctx.lineTo(0, en.r * 1.2); ctx.lineTo(-en.r, 0); ctx.closePath();
    ctx.fillStyle = flash ? '#fff' : en.color; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.arc(0, 0, en.r * .25, 0, 7); ctx.fill();
  } else if (en.type === 'tracker' || en.type === 'mini') {
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3 - Math.PI / 2, x = Math.cos(a) * en.r, y = Math.sin(a) * en.r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fillStyle = flash ? '#fff' : en.color; ctx.fill();
  } else if (en.type === 'shooter' || en.type === 'blinder') {
    ctx.fillStyle = flash ? '#fff' : en.color; ctx.fillRect(-en.r * .8, -en.r * .8, en.r * 1.6, en.r * 1.6);
    ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.fillRect(-en.r * .3, -en.r * .3, en.r * .6, en.r * .6);
    if (en.type === 'blinder') {
      ctx.fillStyle = 'rgba(255,209,102,.95)';
      ctx.beginPath(); ctx.arc(0, 0, en.r * 0.22, 0, 7); ctx.fill();
    }
  } else if (en.type === 'splitter') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3, x = Math.cos(a) * en.r, y = Math.sin(a) * en.r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fillStyle = flash ? '#fff' : en.color; ctx.fill();
    ctx.fillStyle = 'rgba(10,11,16,.5)'; ctx.beginPath(); ctx.arc(0, 0, en.r * .35, 0, 7); ctx.fill();
  }
  if (en.type === 'blinder') {
    ctx.save();
    ctx.rotate(-en.age * 1.2);
    drawCandleIcon(0, -en.r - 20, 9, 0.95);
    ctx.restore();
  }
  if (en.maxHp > 1 && en.hp < en.maxHp) {
    ctx.rotate(-en.age * 1.2);
    const w = en.r * 1.6, h = 2.5;
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(-w / 2, -en.r - 7, w, h);
    ctx.fillStyle = '#7ef9d0'; ctx.fillRect(-w / 2, -en.r - 7, w * (en.hp / en.maxHp), h);
  }
  ctx.restore();
}

// ============================================================
//  主循环
// ============================================================
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (S.running && !S.over && !S.paused && S.player) update(dt);
  render();
}

// ============================================================
//  暂停 / 设置
// ============================================================
function togglePause() {
  if (!S.running || S.over) return;
  S.paused = !S.paused;
  S.sniperTriggered = false;
  S.focusActive = false;
  if (S.isChargingMelee) { S.isChargingMelee = false; S.meleeCharge = 0; }
  document.querySelectorAll('.mSkill.charging').forEach((b) => b.classList.remove('charging'));
  resetTouchControls();
  if (S.paused) showPause();
  else { overlay.classList.add('hidden'); currentUI = 'playing'; for (const k in keys) keys[k] = false; }
}

function showPause() {
  currentUI = 'pause';
  overlay.innerHTML = `
    <p class="dead" style="color:#5fb8ff">PAUSED</p>
    <h2>已暂停</h2>
    <div class="btnRow">
      <button data-action="resume">继 续</button>
      <button data-action="pauseSettings" class="secondary">键位设置</button>
      <button data-action="restart" class="secondary">重新开始</button>
    </div>
    <p class="sub" style="font-size:11px;color:rgba(180,200,230,.4);">
      ${MOBILE ? '点击「继续」返回战斗' : `按 ${keyLabel(KEYBINDS.pause)} 或 Esc 继续`}
    </p>
  `;
  overlay.classList.remove('hidden');
}

function showSettings(returnTo) {
  settingsReturn = returnTo; currentUI = 'settings'; bindingAction = null;
  let rows = '';
  for (const action in BIND_LABELS) {
    rows += `<div class="bindRow"><span>${BIND_LABELS[action]}</span><button class="bindKey" data-bind="${action}">${keyLabel(KEYBINDS[action])}</button></div>`;
  }
  overlay.innerHTML = `
    <h2>键位设置</h2>
    <div class="bindList">${rows}</div>
    <div class="btnRow">
      <button data-action="resetBinds" class="secondary">恢复默认</button>
      <button data-action="closeSettings">完 成</button>
    </div>
    <p class="sub" style="font-size:11px;color:rgba(180,200,230,.45);">
      点击按键后按新键绑定 · Esc 取消 · 方向键始终可用作移动
    </p>
  `;
  overlay.classList.remove('hidden');
}

function startBind(action) {
  bindingAction = action;
  const btn = overlay.querySelector(`[data-bind="${action}"]`);
  if (btn) { btn.textContent = '按任意键…'; btn.classList.add('binding'); }
}
function cancelBind() {
  if (!bindingAction) return;
  const action = bindingAction; bindingAction = null;
  const btn = overlay.querySelector(`[data-bind="${action}"]`);
  if (btn) { btn.textContent = keyLabel(KEYBINDS[action]); btn.classList.remove('binding'); }
}
function applyBind(action, k) {
  const oldKey = KEYBINDS[action];
  for (const a in KEYBINDS) if (a !== action && KEYBINDS[a] === k) KEYBINDS[a] = oldKey;
  KEYBINDS[action] = k; saveBinds(); bindingAction = null;
  updateMinimapLabel();
  sfx(1200, 0.05, 'sine', 0.03); showSettings(settingsReturn);
}
function resetBinds() {
  KEYBINDS = Object.assign({}, DEFAULT_BINDS); saveBinds(); bindingAction = null;
  updateMinimapLabel();
  sfx(600, 0.06, 'sine', 0.03); showSettings(settingsReturn);
}
function closeSettings() {
  if (bindingAction) cancelBind();
  if (settingsReturn === 'pause') showPause();
  else if (settingsReturn === 'gameover') showGameOver();
  else showStart();
}

// ============================================================
//  输入
// ============================================================
window.addEventListener('keydown', (e) => {
  const k = rawKey(e);
  if (bindingAction) {
    e.preventDefault();
    if (k === 'escape' || k === 'tab') { cancelBind(); return; }
    if (MODIFIER_KEYS.includes(k)) return;
    applyBind(bindingAction, k); return;
  }
  if (currentUI === 'settings') {
    if (k === 'escape') { e.preventDefault(); closeSettings(); }
    return;
  }
  if (k === ' ' || k.startsWith('arrow')) e.preventDefault();
  if (currentUI === 'pause') {
    if ((k === KEYBINDS.pause || k === 'escape') && !e.repeat) { e.preventDefault(); togglePause(); }
    return;
  }
  if (!S.running || S.over || S.paused) return;

  keys[k] = true;
  if (k === KEYBINDS.spawnEcho && !e.repeat) spawnEcho();
  if (k === KEYBINDS.toggleSniper && !e.repeat) toggleSniper();
  if (k === KEYBINDS.sniperShoot && !e.repeat) sniperShoot();
  if (k === KEYBINDS.blow && !e.repeat) triggerBomb();
  if (k === KEYBINDS.toggleMap && !e.repeat) { e.preventDefault(); S.mini.global = true; updateMinimapLabel(); }
  if ((k === KEYBINDS.pause || k === 'escape') && !e.repeat) togglePause();
}, { passive: false });

window.addEventListener('keyup', (e) => {
  const k = rawKey(e);
  keys[k] = false;
  if (k === KEYBINDS.toggleMap) { S.mini.global = false; updateMinimapLabel(); }
});

window.addEventListener('blur', () => {
  for (const k in keys) keys[k] = false;
  S.mini.global = false;
  S.mini.hot = false;
  S.sniperTriggered = false;
  S.focusActive = false;
  resetTouchControls();
  minimapWrap.classList.remove('hot');
  updateMinimapLabel();
});

window.addEventListener('mousemove', (e) => {
  S.mouse.x = e.clientX; S.mouse.y = e.clientY;
  const hot = minimapHit(e.clientX, e.clientY);
  if (hot !== S.mini.hot) {
    S.mini.hot = hot;
    minimapWrap.classList.toggle('hot', hot);
  }
});

canvas.addEventListener('mousedown', (e) => {
  initAudio();
  if (MOBILE) return;
  if (!S.running || S.over || S.paused) return;
  if (e.button === 0) {
    if (S.sniperMode) {
      S.focusActive = true;           // 狙击：左键放慢移速、提高精度
    } else if (S.meleeUnlocked && S.meleeCd <= 0 && S.meleeCount >= 2) {
      S.isChargingMelee = true;
      S.meleeCharge = 0;
    }
  } else if (e.button === 2) {
    if (S.sniperMode) sniperShoot();   // 狙击：右键单发（每发独立冷却）
  }
});

canvas.addEventListener('mouseup', (e) => {
  if (MOBILE) return;
  if (e.button === 0) {
    if (S.sniperMode) S.focusActive = false;
    if (S.isChargingMelee) {
      S.isChargingMelee = false;
      throwMelee();
    }
  }
});

window.addEventListener('mouseup', (e) => {
  if (e.button === 0 && S.sniperMode) S.focusActive = false;
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

detonateBtn.addEventListener('click', () => {
  if (S.running && !S.over && !S.paused) detonateEchoes();
});

let touchAnchor = null;
canvas.addEventListener('touchstart', (e) => {
  initAudio();
  if (MOBILE) { e.preventDefault(); return; }
  const t = e.touches[0];
  touchAnchor = { x: t.clientX, y: t.clientY };
  S.mouse.x = t.clientX; S.mouse.y = t.clientY;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (MOBILE) { e.preventDefault(); return; }
  const t = e.touches[0];
  if (touchAnchor) {
    const dx = t.clientX - touchAnchor.x, dy = t.clientY - touchAnchor.y;
    keys[KEYBINDS.moveLeft] = dx < -15; keys[KEYBINDS.moveRight] = dx > 15;
    keys[KEYBINDS.moveUp] = dy < -15; keys[KEYBINDS.moveDown] = dy > 15;
  }
  S.mouse.x = t.clientX; S.mouse.y = t.clientY;
  e.preventDefault();
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (MOBILE) { e.preventDefault(); return; }
  keys[KEYBINDS.moveLeft] = keys[KEYBINDS.moveRight] = keys[KEYBINDS.moveUp] = keys[KEYBINDS.moveDown] = false;
  touchAnchor = null;
  e.preventDefault();
}, { passive: false });

// ============================================================
//  手机：双摇杆 + 技能按钮
// ============================================================
const joyMoveEl = document.getElementById('joyMove');
const joyAimEl = document.getElementById('joyAim');
const mSkillEls = {};
document.querySelectorAll('.mSkill').forEach((b) => { mSkillEls[b.dataset.skill] = b; });
const mSub = (name) => (mSkillEls[name] ? mSkillEls[name].querySelector('.sub') : null);
let _mobileHudKey = '';

function bindJoystick(el, state) {
  const knob = el.querySelector('.joyKnob');
  let pid = null, cx = 0, cy = 0, radius = 48;
  function apply(x, y) {
    let dx = x - cx, dy = y - cy;
    const dist = Math.hypot(dx, dy);
    const mag = Math.min(1, dist / radius);
    if (dist > radius) { dx = dx / dist * radius; dy = dy / dist * radius; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    state.x = dist > 0.001 ? dx / radius : 0;
    state.y = dist > 0.001 ? dy / radius : 0;
    state.mag = mag < 0.12 ? 0 : mag;
  }
  el.addEventListener('pointerdown', (e) => {
    if (!MOBILE || pid !== null) return;
    e.preventDefault(); e.stopPropagation();
    pid = e.pointerId;
    try { el.setPointerCapture(pid); } catch (err) {}
    const r = el.getBoundingClientRect();
    cx = r.left + r.width / 2; cy = r.top + r.height / 2;
    radius = Math.min(r.width, r.height) * 0.34;
    state.active = true;
    el.classList.add('active');
    apply(e.clientX, e.clientY);
  });
  el.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid || !state.active) return;
    e.preventDefault();
    apply(e.clientX, e.clientY);
  });
  function end(e) {
    if (e.pointerId !== pid) return;
    pid = null;
    state.active = false; state.x = 0; state.y = 0; state.mag = 0;
    el.classList.remove('active');
    knob.style.transform = 'translate(0px,0px)';
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  el.addEventListener('lostpointercapture', end);
}
bindJoystick(joyMoveEl, touchMove);
bindJoystick(joyAimEl, touchAim);

function resetTouchControls() {
  touchMove.active = false; touchAim.active = false;
  touchMove.x = touchMove.y = touchMove.mag = 0;
  touchAim.x = touchAim.y = touchAim.mag = 0;
  [joyMoveEl, joyAimEl].forEach((el) => {
    if (!el) return;
    el.classList.remove('active');
    const k = el.querySelector('.joyKnob');
    if (k) k.style.transform = 'translate(0px,0px)';
  });
}

function mobileCanUse() {
  return MOBILE && S.running && !S.over && !S.paused;
}

Object.keys(mSkillEls).forEach((skill) => {
  const btn = mSkillEls[skill];
  if (skill === 'melee') {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!mobileCanUse() || S.sniperMode) return;
      if (S.meleeCd > 0 || !S.meleeUnlocked || S.meleeCount < 2) return;
      try { btn.setPointerCapture(e.pointerId); } catch (err) {}
      S.isChargingMelee = true;
      S.meleeCharge = 0;
      btn.classList.add('charging');
    });
    const release = (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!S.isChargingMelee) return;
      S.isChargingMelee = false;
      throwMelee();
      btn.classList.remove('charging');
    };
    btn.addEventListener('pointerup', release);
    btn.addEventListener('pointercancel', () => {
      S.isChargingMelee = false;
      btn.classList.remove('charging');
    });
  } else {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!mobileCanUse()) return;
      if (skill === 'echo') spawnEcho();
      else if (skill === 'detonate') detonateEchoes();
      else if (skill === 'bomb') triggerBomb();
      else if (skill === 'sniper') toggleSniper();
      else if (skill === 'focus') S.focusActive = !S.focusActive;
      else if (skill === 'map') { S.mini.global = !S.mini.global; updateMinimapLabel(); }
      else if (skill === 'pause') { togglePause(); return; }
      updateMobileHUD();
    });
  }
});

// 手机上点小地图也能切换全局 / 局部
minimapWrap.addEventListener('pointerdown', (e) => {
  if (!MOBILE) return;
  e.preventDefault(); e.stopPropagation();
  S.mini.global = !S.mini.global;
  updateMinimapLabel();
  updateMobileHUD();
});

window.addEventListener('pointerdown', initAudio, { passive: true });

function updateMobileHUD() {
  if (!MOBILE || !mSkillEls.bomb) return;
  const key = [
    S.sniperMag, S.sniperMode, S.bombUnlocked, S.bombStacks,
    S.meleeCount, S.meleeUnlocked, S.meleeCd > 0,
    S.focusActive, S.mini.global, S.energy, S.echoes.length,
    Math.ceil(S.detonateCd * 10), S.detonateCd > 0,
  ].join('|');
  if (key === _mobileHudKey) return;
  _mobileHudKey = key;
  mSkillEls.bomb.classList.toggle('off', !S.bombUnlocked);
  if (mSub('bomb')) mSub('bomb').textContent = S.bombUnlocked ? `x${S.bombStacks}` : '未解锁';
  mSkillEls.sniper.classList.toggle('on', !!S.sniperMode);
  mSkillEls.sniper.classList.toggle('off', S.sniperMag <= 0 && !S.sniperMode);
  if (mSub('sniper')) mSub('sniper').textContent = String(S.sniperMag);
  mSkillEls.melee.classList.toggle('off', !S.meleeUnlocked || S.meleeCount < 2);
  if (mSub('melee')) mSub('melee').textContent = String(S.meleeCount);
  mSkillEls.focus.classList.toggle('on', !!S.focusActive);
  mSkillEls.map.classList.toggle('on', !!S.mini.global);
  mSkillEls.echo.classList.toggle('off', S.energy < ECHO_COST || S.echoes.length >= MAX_ECHO);
  if (mSub('echo')) mSub('echo').textContent = `⚡${S.energy}`;
  mSkillEls.detonate.classList.toggle('off', S.echoes.length === 0 && S.detonateCd <= 0);
  if (mSub('detonate')) mSub('detonate').textContent = S.detonateCd > 0 ? `${S.detonateCd.toFixed(1)}s` : String(S.echoes.length);
}
updateMobileHUD();

// ============================================================
//  界面
// ============================================================
function showStart() {
  currentUI = 'start';
  const moveKeys = `${keyLabel(KEYBINDS.moveUp)}${keyLabel(KEYBINDS.moveLeft)}${keyLabel(KEYBINDS.moveDown)}${keyLabel(KEYBINDS.moveRight)}`;
  const keysHtml = MOBILE ? `
      <div><b>移动</b>左摇杆（模拟量，带加减速）</div>
      <div><b>瞄准 / 射击</b>右摇杆，推杆自动开火</div>
      <div><b>技能按钮</b>残影 · 引爆 · 爆破 · 狙击 · 飞刀 · 精准 · 地图 · 暂停</div>
      <div><b>狙击</b>点「狙击」切换，右摇杆推满单发</div>
      <div><b>飞刀</b>按住「飞刀」蓄力，松手投掷</div>
      <div><b>精准</b>点「精准」切换：减速、提高精度</div>
      <div><b>暂停</b>底部「暂停」按钮</div>` : `
      <div><b>移动</b>${moveKeys} / 方向键</div>
      <div><b>瞄准</b>鼠标（自动射击）</div>
      <div><b>全局地图</b>按住 ${keyLabel(KEYBINDS.toggleMap)}（悬停小地图可放大）</div>
      <div><b>召唤残影</b>${keyLabel(KEYBINDS.spawnEcho)}</div>
      <div><b>引爆残影</b>底部按钮</div>
      <div><b>狙击切换</b>${keyLabel(KEYBINDS.toggleSniper)}</div>
      <div><b>狙击发射</b>右键单发（每发装填）/ ${keyLabel(KEYBINDS.sniperShoot)}</div>
      <div><b>精准</b>狙击时按住左键：减速、提高精度</div>
      <div><b>飞刀投掷</b>长按左键蓄力</div>
      <div><b>爆破子弹</b>${keyLabel(KEYBINDS.blow)}</div>
      <div><b>暂停 / 设置</b>${keyLabel(KEYBINDS.pause)} / Esc</div>`;
  overlay.innerHTML = `
    <h1>时之残影</h1>
    <p class="sub">射速被削弱，道具变得稀有。<br>每 3 波 Boss 会和小怪一起出现在地图里——它会发射环形弹幕与瞄准三连。<br>地图更大、怪物分布在各个区域，清完一波需要走遍地图；远处怪物会在你靠近时苏醒。<br>每一波都会按地图文件重构战场，${MOBILE ? '点按小地图可切换全局视野' : `按 <b style="color:#fff">${keyLabel(KEYBINDS.toggleMap)}</b> 可查看全局地图`}。<br>拾取 <b style="color:#e8f4ff">狙击弹夹</b> 或 <b style="color:#5fb8ff">飞刀</b> 可解锁强力战术。</p>
    <div class="keys">${keysHtml}
    </div>
    <p class="sub" style="font-size:11px;color:rgba(180,200,230,.4);">
      ⚡ 射速提升 · 🔱 三向散射 · 🎯 狙击弹夹 · 🗡 飞刀 · 🟢 回血<br>
      🟡 爆破（推开子弹） · 💚 第二次机会（免死一次） · 🟣 广域视野（拉远镜头）<br>
      飞刀每次消耗 2 把，可以刮去子弹，耐久极低；底部圆环显示技能冷却与持续时间
    </p>
    <div class="btnRow">
      <button data-action="start">开 始</button>
      <button data-action="settings" class="secondary">⚙ 设置</button>
    </div>
  `;
  overlay.classList.remove('hidden');
}

function showGameOver() {
  currentUI = 'gameover';
  const rank = S.score >= 600 ? '时之主宰 👑' : S.score >= 400 ? '完美协奏 ✦' : S.score >= 250 ? '残影大师' : S.score >= 120 ? '初窥门径' : '被时间吞没';
  overlay.innerHTML = `
    <p class="dead">SIGNAL LOST</p>
    <div class="big">${S.score}</div>
    <p class="rank">${rank}</p>
    <p class="sub" style="font-size:12px;color:rgba(180,200,230,.5);">
      抵达第 ${S.wave} 波 · 最高连击 ${S.combo}
    </p>
    <div class="btnRow">
      <button data-action="start">再 来 一 次</button>
      <button data-action="settingsGameOver" class="secondary">⚙ 设置</button>
    </div>
  `;
  overlay.classList.remove('hidden');
}

overlay.addEventListener('click', (e) => {
  const bindBtn = e.target.closest('[data-bind]');
  if (bindBtn) { e.preventDefault(); startBind(bindBtn.dataset.bind); return; }
  const btn = e.target.closest('button[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;

  if (act === 'start' || act === 'restart') {
    initAudio(); overlay.classList.add('hidden'); resize(); initGame(); lastTs = 0; currentUI = 'playing';
  } else if (act === 'settings') showSettings('start');
  else if (act === 'settingsGameOver') showSettings('gameover');
  else if (act === 'pauseSettings') showSettings('pause');
  else if (act === 'resume') togglePause();
  else if (act === 'resetBinds') resetBinds();
  else if (act === 'closeSettings') closeSettings();
});

// ============================================================
//  启动
// ============================================================
resize();
S.player = { x: W / 2, y: H / 2, r: PLAYER_BASE_R, hp: 3, invuln: 0, angle: 0 };
S.mouse = { x: W / 2, y: H / 2 - 150 };
hpBar.innerHTML = '<span class="hpSeg"></span><span class="hpSeg"></span><span class="hpSeg"></span>';
updateMinimapLabel();
showStart();
requestAnimationFrame(loop);

})();
</script>
</body>
