<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>时之残影 · Echoes</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0b10;
    font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
    color:#e8ecf5;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #game{display:block;position:fixed;inset:0;cursor:crosshair}

  .hud{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;
    padding:16px 22px;pointer-events:none;font-variant-numeric:tabular-nums}
  .hud .lbl{font-size:9px;letter-spacing:3px;color:rgba(160,180,220,.45);font-weight:700;margin-bottom:3px}
  .hud .val{font-size:26px;font-weight:900;line-height:1}
  #hpBar{display:flex;gap:5px;margin-top:4px}
  .hpSeg{width:26px;height:5px;border-radius:3px;background:#ff3b5c;box-shadow:0 0 8px rgba(255,59,92,.5)}
  .hpSeg.off{background:rgba(255,59,92,.12);box-shadow:none}
  .right{text-align:right}
  #combo{color:#ffd166;font-size:14px;font-weight:800;min-height:18px}
  #secondChanceMark{color:#00ffcc;font-size:16px;font-weight:900;display:none;
    text-shadow:0 0 10px rgba(0,255,204,.8);margin-top:2px}
  #secondChanceMark.on{display:block}

  #energyWrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;
    width:min(340px,78vw);pointer-events:none}
  #energyBar{height:6px;border-radius:3px;background:rgba(120,180,255,.12);overflow:hidden;
    box-shadow:0 0 0 1px rgba(120,180,255,.15)}
  #energyFill{height:100%;width:0%;background:linear-gradient(90deg,#5fb8ff,#7ef9d0);
    border-radius:3px;transition:width .1s;box-shadow:0 0 12px rgba(95,184,255,.6)}
  #energyRow{display:flex;justify-content:space-between;align-items:center;
    margin-top:6px;font-size:9px;letter-spacing:2px;color:rgba(160,190,240,.5);font-weight:700}
  #echoCount{color:rgba(95,184,255,.8)}
  #detonateBtn{
    pointer-events:auto;margin:8px auto 0;display:block;
    padding:8px 26px;border-radius:999px;border:1px solid rgba(255,157,92,.4);
    background:rgba(255,157,92,.1);color:#ff9d5c;font-size:12px;font-weight:800;
    letter-spacing:2px;font-family:inherit;cursor:pointer;
    transition:all .12s;white-space:nowrap}
  #detonateBtn:hover:not(:disabled){background:rgba(255,157,92,.22);border-color:rgba(255,157,92,.8)}
  #detonateBtn:disabled{opacity:.25;cursor:not-allowed}

  #buffs{position:fixed;bottom:180px;left:50%;transform:translateX(-50%);z-index:11;
    display:flex;gap:8px;pointer-events:none;flex-wrap:wrap;justify-content:center;
    max-width:90vw}
  .buff{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;
    font-size:11px;font-weight:800;letter-spacing:1px;
    background:rgba(14,20,34,.85);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);border:1px solid;white-space:nowrap;
    animation:buffIn .2s ease-out}
  @keyframes buffIn{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  .buff .bar{width:38px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
  .buff .fill{height:100%;border-radius:2px;transition:width .1s linear}
  .buff.fireRate{border-color:rgba(255,209,102,.5);color:#ffd166}
  .buff.fireRate .fill{background:#ffd166;box-shadow:0 0 8px rgba(255,209,102,.8)}
  .buff.spread{border-color:rgba(126,249,208,.5);color:#7ef9d0}
  .buff.spread .fill{background:#7ef9d0;box-shadow:0 0 8px rgba(126,249,208,.8)}

  #sniperHud{position:fixed;bottom:96px;right:22px;z-index:11;text-align:right;
    pointer-events:none;opacity:.45;transition:opacity .2s}
  #sniperHud.active{opacity:1}
  #sniperHud.hidden{opacity:0}
  #sniperLabel{font-size:9px;letter-spacing:2px;color:rgba(155,231,255,.7);font-weight:800}
  #sniperCount{font-size:22px;font-weight:900;color:#e8f4ff;line-height:1;
    font-variant-numeric:tabular-nums}
  #sniperHud.active #sniperLabel{color:#7ef9d0}
  #sniperHud.active #sniperCount{color:#7ef9d0;text-shadow:0 0 12px rgba(126,249,208,.6)}
  #sniperHint{font-size:9px;letter-spacing:1px;color:rgba(155,231,255,.45);
    font-weight:700;margin-top:2px}

  #meleeHud{position:fixed;bottom:96px;left:22px;z-index:11;text-align:left;
    pointer-events:none;opacity:.45;transition:opacity .2s}
  #meleeHud.active{opacity:1}
  #meleeHud.hidden{opacity:0}
  #meleeLabel{font-size:9px;letter-spacing:2px;color:rgba(232,244,255,.7);font-weight:800}
  #meleeState{font-size:11px;font-weight:900;color:#e8f4ff;margin-top:2px;
    font-variant-numeric:tabular-nums}
  #meleeHud.active #meleeLabel{color:#5fb8ff}
  #meleeHud.active #meleeState{color:#5fb8ff;text-shadow:0 0 12px rgba(95,184,255,.6)}

  #bombHud{position:fixed;bottom:140px;left:22px;z-index:11;text-align:left;
    pointer-events:none;opacity:.45;transition:opacity .2s}
  #bombHud.active{opacity:1}
  #bombHud.hidden{opacity:0}
  #bombLabel{font-size:9px;letter-spacing:2px;color:rgba(220,210,160,.7);font-weight:800}
  #bombState{font-size:11px;font-weight:900;color:#e8e4c8;margin-top:2px;
    font-variant-numeric:tabular-nums}
  #bombHud.active #bombLabel{color:#d4c48a}
  #bombHud.active #bombState{color:#d4c48a;text-shadow:0 0 12px rgba(220,210,160,.6)}

  .overlay{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;
    background:rgba(8,10,18,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    transition:opacity .3s;overflow-y:auto}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay h1{font-size:clamp(32px,6vw,52px);font-weight:900;letter-spacing:3px;
    background:linear-gradient(135deg,#7ef9d0,#5fb8ff 55%,#c084fc);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 24px rgba(95,184,255,.3))}
  .overlay h2{font-size:clamp(20px,4vw,28px);font-weight:900;letter-spacing:2px;
    color:#7ef9d0;text-shadow:0 0 20px rgba(126,249,208,.35)}
  .overlay .sub{font-size:13px;color:rgba(180,200,230,.6);line-height:2;max-width:400px}
  .overlay .keys{display:flex;flex-direction:column;gap:6px;font-size:12px;
    color:rgba(180,200,230,.7);background:rgba(120,160,255,.06);
    padding:14px 26px;border-radius:12px;line-height:1.8;text-align:left}
  .overlay .keys b{display:inline-block;min-width:100px;text-align:right;margin-right:12px;
    color:#7ef9d0;font-weight:800}
  .overlay .big{font-size:72px;font-weight:900;line-height:1;letter-spacing:-2px;
    color:#7ef9d0;text-shadow:0 0 30px rgba(80,240,190,.4)}
  .overlay .rank{font-size:14px;font-weight:800;color:#5fb8ff;letter-spacing:2px}
  .overlay .dead{font-size:10px;letter-spacing:6px;color:#ff3b5c;font-weight:800}
  .overlay button{margin-top:6px;padding:15px 52px;border:none;border-radius:999px;
    font-size:15px;font-weight:800;letter-spacing:3px;cursor:pointer;color:#04121a;
    font-family:inherit;background:linear-gradient(135deg,#7ef9d0,#5fb8ff);
    box-shadow:0 0 30px rgba(95,200,255,.4);transition:transform .12s,box-shadow .12s}
  .overlay button:hover{transform:translateY(-2px);box-shadow:0 0 44px rgba(95,200,255,.7)}
  .overlay button:active{transform:scale(.97)}

  .overlay .btnRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
  .overlay button.secondary{padding:12px 36px;font-size:13px;letter-spacing:2px;
    background:transparent;border:1px solid rgba(120,160,255,.35);
    color:rgba(200,220,255,.85);box-shadow:none}
  .overlay button.secondary:hover{background:rgba(120,160,255,.08);
    border-color:rgba(120,160,255,.7);box-shadow:none;transform:none}

  .bindList{display:flex;flex-direction:column;gap:8px;width:min(420px,88vw);
    background:rgba(120,160,255,.06);border-radius:12px;padding:16px 20px;
    max-height:60vh;overflow-y:auto}
  .bindRow{display:flex;align-items:center;justify-content:space-between;gap:16px;
    font-size:13px;color:rgba(200,220,255,.8);font-weight:700}
  .bindKey{min-width:96px;padding:7px 14px;border-radius:8px;
    border:1px solid rgba(120,160,255,.35);background:rgba(14,20,34,.85);
    color:#e8f4ff;font-family:inherit;font-size:12px;font-weight:800;letter-spacing:1px;
    cursor:pointer;transition:all .12s;margin-top:0}
  .bindKey:hover{border-color:rgba(120,160,255,.7);background:rgba(120,160,255,.15);
    transform:none;box-shadow:none}
  .bindKey.binding{border-color:#7ef9d0;color:#7ef9d0;
    animation:bindPulse .6s infinite alternate}
  @keyframes bindPulse{from{box-shadow:0 0 0 rgba(126,249,208,0)}to{box-shadow:0 0 16px rgba(126,249,208,.5)}}

  /* —— 小地图（右上角） —— */
  #minimapWrap{position:fixed;top:104px;right:18px;z-index:12;pointer-events:none;
    opacity:0;transform-origin:top right;
    transition:transform .34s cubic-bezier(.22,.9,.3,1),opacity .3s;will-change:transform}
  #minimapWrap.on{opacity:1}
  #minimapWrap.hot{transform:scale(1.2)}
  #minimap{display:block;width:232px;height:158px;background:#000;border-radius:5px;
    border:1px solid rgba(255,255,255,.30);box-shadow:0 0 22px rgba(0,0,0,.7);
    transition:width .3s cubic-bezier(.22,.9,.3,1),height .3s cubic-bezier(.22,.9,.3,1),border-color .25s,box-shadow .25s}
  #minimapWrap.local #minimap{width:170px;height:116px}
  body.mobile #minimap{width:156px;height:106px}
  body.mobile #minimapWrap.local #minimap{width:126px;height:86px}
  #minimapWrap.hot #minimap{border-color:rgba(255,255,255,.8);
    box-shadow:0 0 28px rgba(255,255,255,.16)}
  #minimapBar{display:flex;justify-content:space-between;align-items:center;
    margin-top:4px;font-size:8px;letter-spacing:2px;font-weight:800;
    color:rgba(255,255,255,.38);font-variant-numeric:tabular-nums}
  #minimapMode{color:rgba(255,255,255,.72);transition:color .2s,text-shadow .2s}
  #minimapMode.global{color:#fff;text-shadow:0 0 10px rgba(255,255,255,.7)}
  .buff.vision{border-color:rgba(192,132,252,.55);color:#d8b4fe}
  .buff.vision .fill{background:#c084fc;box-shadow:0 0 8px rgba(192,132,252,.9)}

  /* —— 手机触屏 UI —— */
  #touchUI{display:none}
  body.mobile #touchUI{display:block}
  .joy{position:fixed;width:150px;height:150px;z-index:14;border-radius:50%;
    touch-action:none;border:1px solid rgba(140,180,255,.22);
    background:radial-gradient(circle at 50% 50%,rgba(120,170,255,.10),rgba(10,14,24,.32));
    box-shadow:inset 0 0 30px rgba(90,140,255,.08)}
  #joyMove{left:12px;bottom:14px}
  #joyAim{right:12px;bottom:14px}
  .joyRing{position:absolute;inset:18px;border-radius:50%;
    border:1px dashed rgba(160,200,255,.16);pointer-events:none}
  .joyKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,rgba(205,235,255,.92),rgba(95,184,255,.42));
    border:1px solid rgba(220,240,255,.75);box-shadow:0 0 18px rgba(95,184,255,.4)}
  .joy.active{border-color:rgba(126,249,208,.55);
    box-shadow:0 0 22px rgba(95,184,255,.22),inset 0 0 30px rgba(90,140,255,.12)}
  .joy.active .joyKnob{box-shadow:0 0 26px rgba(126,249,208,.65)}
  .joyLabel{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:9px;
    letter-spacing:3px;color:rgba(170,200,240,.42);font-weight:800;pointer-events:none}

  #mobileSkills{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:14;
    display:grid;grid-template-columns:repeat(4,46px);gap:8px}
  .mSkill{height:46px;border-radius:12px;border:1px solid rgba(130,170,240,.35);
    background:rgba(12,18,30,.82);color:rgba(225,238,255,.85);font-family:inherit;
    font-size:11px;font-weight:800;letter-spacing:1px;touch-action:none;position:relative;
    display:flex;align-items:center;justify-content:center;padding-top:4px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .mSkill:active,.mSkill.on{border-color:#7ef9d0;color:#7ef9d0;
    background:rgba(126,249,208,.13);box-shadow:0 0 14px rgba(126,249,208,.35)}
  .mSkill.off{opacity:.34}
  .mSkill .sub{position:absolute;left:0;right:0;bottom:3px;font-size:8px;letter-spacing:0;
    color:rgba(200,225,255,.55);font-weight:700;text-align:center}
  .mSkill.on .sub{color:#7ef9d0}
  .mSkill.charging{border-color:#ffd166;color:#ffd166;box-shadow:0 0 16px rgba(255,209,102,.5)}
  body.mobile #sniperHud, body.mobile #meleeHud, body.mobile #bombHud{display:none}
  body.mobile .hud{padding-right:178px}
  body.mobile #energyWrap{display:none}
  body.mobile #buffs{top:92px;bottom:auto;max-width:56vw}
  body.mobile #minimapWrap{pointer-events:auto;cursor:pointer}
  body.mobile #minimapBar{font-size:7px}
  @media (max-width: 620px) {
    #joyMove, #joyAim{width:130px;height:130px}
    #mobileSkills{grid-template-columns:repeat(4,40px);gap:6px}
    .mSkill{height:40px;font-size:10px}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div>
    <div class="lbl">HULL</div>
    <div id="hpBar"></div>
  </div>
  <div class="right">
    <div class="lbl">SCORE</div>
    <div class="val" id="score">0</div>
    <div id="combo"></div>
    <div id="secondChanceMark">♥∞ 第二次机会</div>
  </div>
</div>

<div id="sniperHud" class="hidden">
  <div id="sniperLabel">SNIPER</div>
  <div id="sniperCount">0</div>
  <div id="sniperHint">按 R 切换</div>
</div>

<div id="bombHud" class="hidden">
  <div id="bombLabel">BOMB</div>
  <div id="bombState">就绪</div>
</div>

<div id="meleeHud" class="hidden">
  <div id="meleeLabel">MELEE</div>
  <div id="meleeState">就绪</div>
</div>

<div id="buffs"></div>

<div id="minimapWrap">
  <canvas id="minimap"></canvas>
  <div id="minimapBar">
    <span id="minimapMode">LOCAL</span>
    <span id="minimapHint">按住 M 全局</span>
  </div>
</div>

<div id="touchUI">
  <div id="joyMove" class="joy">
    <div class="joyRing"></div><div class="joyKnob"></div>
    <span class="joyLabel">移动</span>
  </div>
  <div id="joyAim" class="joy">
    <div class="joyRing"></div><div class="joyKnob"></div>
    <span class="joyLabel">瞄准 / 发射</span>
  </div>
  <div id="mobileSkills">
    <button class="mSkill" data-skill="echo">残影<span class="sub">⚡2</span></button>
    <button class="mSkill" data-skill="detonate">引爆<span class="sub">0</span></button>
    <button class="mSkill" data-skill="bomb">爆破<span class="sub">未解锁</span></button>
    <button class="mSkill" data-skill="sniper">狙击<span class="sub">0</span></button>
    <button class="mSkill" data-skill="melee">飞刀<span class="sub">4</span></button>
    <button class="mSkill" data-skill="focus">精准<span class="sub">切换</span></button>
    <button class="mSkill" data-skill="map">地图<span class="sub">切换</span></button>
    <button class="mSkill" data-skill="pause">暂停<span class="sub"> </span></button>
  </div>
</div>

<div id="energyWrap">
  <div id="energyBar"><div id="energyFill"></div></div>
  <div id="energyRow">
    <span>ECHO ENERGY</span>
    <span id="echoCount">残影 0/3</span>
  </div>
  <button id="detonateBtn">💥 引爆</button>
</div>

<div class="overlay" id="overlay"></div>

<script>
(() => {
'use strict';

// ============================================================
//  常量
// ============================================================
const ECHO_COST = 2;
const MAX_ECHO = 3;
const DETONATE_CD = 6;
const ECHO_HP = 3;
const ECHO_LIFE = 3.5;
const SLOW_RADIUS = 70;

const PLAYER_SHOT_CD = 0.24;

function loadBinds() {
  try {
    const raw = localStorage.getItem('echoes_keybinds_v2');
    if (raw) return Object.assign({}, DEFAULT_BINDS, JSON.parse(raw));
    // 从旧版本迁移：保留自定义键位，但爆破统一改为 G
    const old = localStorage.getItem('echoes_keybinds');
    if (old) {
      const b = Object.assign({}, DEFAULT_BINDS, JSON.parse(old));
      b.blow = 'g';
      return b;
    }
  } catch(e) {}
  return Object.assign({}, DEFAULT_BINDS);
}
function saveBinds() {
  try { localStorage.setItem('echoes_keybinds_v2', JSON.stringify(KEYBINDS)); } catch(e) {}
}
function rawKey(e) { return (e.key || '').toLowerCase(); }
function keyLabel(k) {
  if (k === ' ') return '空格'; if (k === 'escape') return 'Esc';
  if (k === 'arrowup') return '↑'; if (k === 'arrowdown') return '↓';
  if (k === 'arrowleft') return '←'; if (k === 'arrowright') return '→';
  if (k === 'enter') return 'Enter'; if (k === 'tab') return 'Tab';
  if (k.length === 1) return k.toUpperCase();
  return k.charAt(0).toUpperCase() + k.slice(1);
}

  minimapCanvas.width = Math.round(MINIMAP_W * miniDpr);

function minimapHit(x, y) {
  // LOCAL 模式的显示尺寸更小，命中区域也要跟着缩小
  const scale = S.mini.global ? 1 : (MOBILE ? 126 / 156 : 170 / 232);
  const mw = MINIMAP_W * scale, mh = MINIMAP_H * scale;
  const left = W - MINIMAP_RIGHT - mw, top = MINIMAP_TOP;
  return x >= left - 6 && x <= left + mw + 6 &&
         y >= top - 6 && y <= top + mh + (MOBILE ? 16 : 22);
}

let actx = null;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function sfx(freq, dur = 0.06, type = 'sine', vol = 0.03) {
  if (!actx) return;
  try {
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch(e) {}
}

// ============================================================
//  地图系统（读取 <script id="mapFile"> 里的地图文件）
// ============================================================
let MAP_FILE = null;
try {
  MAP_FILE = JSON.parse(document.getElementById('mapFile').textContent);
} catch (e) { MAP_FILE = null; }

function seededRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function rectsOverlap(a, b, pad) {
  pad = pad || 0;
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x &&
         a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}

function buildWaveMap(wave) {
  if (!MAP_FILE || !MAP_FILE.layouts || !MAP_FILE.layouts.length) return null;
  const layouts = MAP_FILE.layouts;
  const def = layouts[(wave - 1) % layouts.length];
  const cycle = Math.floor((wave - 1) / layouts.length);
  // 大地图：至少比当前视口大 2.4 倍，迫使玩家探索整张地图
  const fit = Math.max(1, (W * 2.4) / def.w, (H * 2.4) / def.h);
  const w = Math.round(def.w * fit), h = Math.round(def.h * fit);
  const walls = [];

  const pushWall = (x, y, ww, hh) => {
    if (ww < 10 || hh < 10) return;
    const r = { x: Math.round(x), y: Math.round(y), w: Math.round(ww), h: Math.round(hh) };
    if (!walls.some(o => rectsOverlap(o, r))) walls.push(r);
  };

  for (const r of (def.walls || [])) {
    const x = r.x * w, y = r.y * h, ww = r.w * w, hh = r.h * h;
    pushWall(x, y, ww, hh);
    if (r.mirror === 'x' || r.mirror === 'both') pushWall(w - x - ww, y, ww, hh);
    if (r.mirror === 'y' || r.mirror === 'both') pushWall(x, h - y - hh, ww, hh);
    if (r.mirror === 'both') pushWall(w - x - ww, h - y - hh, ww, hh);
  }

  const spawn = {
    x: (def.spawn ? def.spawn.x : 0.5) * w,
    y: (def.spawn ? def.spawn.y : 0.5) * h,
  };

  // 出生点周围保持空阔，避免开局卡墙
  for (let i = walls.length - 1; i >= 0; i--) {
    const wl = walls[i];
    const nx = Math.max(wl.x, Math.min(spawn.x, wl.x + wl.w));
    const ny = Math.max(wl.y, Math.min(spawn.y, wl.y + wl.h));
    if (Math.hypot(spawn.x - nx, spawn.y - ny) < 210 * fit) walls.splice(i, 1);
  }

  // 波次碎石柱：同一布局在不同 wave 也有差异
  const extra = (def.extraPillars || 0) + Math.min(8, cycle * 2);
  const rng = seededRng(wave * 7919 + 17);
  for (let i = 0; i < extra; i++) {
    for (let tries = 0; tries < 40; tries++) {
      const size = Math.round((70 + rng() * 90) * fit);
      const spanX = Math.max(0, w - 480 * fit - size), spanY = Math.max(0, h - 480 * fit - size);
      const x = Math.round(240 * fit + rng() * spanX), y = Math.round(240 * fit + rng() * spanY);
      const rect = { x, y, w: size, h: size };
      if (Math.hypot(x + size / 2 - spawn.x, y + size / 2 - spawn.y) < 300 * fit) continue;
      if (walls.some(wl => rectsOverlap(wl, rect, 90 * fit))) continue;
      walls.push(rect); break;
    }
  }

  const map = {
    id: def.id + '-' + cycle,
    name: def.name,
    index: (wave - 1) % layouts.length,
    cycle, wave, scale: fit,
    w, h, walls, spawn,
    theme: def.theme || {},
    mm: null,
  };
  buildMapMinimap(map);
  return map;
}

function buildMapMinimap(map) {
  const s = Math.max(0.22, Math.min(MINIMAP_MM_SCALE, 1600 / map.w));
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(map.w * s));
  c.height = Math.max(2, Math.round(map.h * s));
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  g.save(); g.scale(s, s); g.fillStyle = '#fff';
  for (const wl of map.walls) g.fillRect(wl.x, wl.y, wl.w, wl.h);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2;
  g.strokeRect(1, 1, c.width - 2, c.height - 2);
  map.mm = c;
}

function pointInWalls(x, y, pad) {
  const map = S.map; if (!map) return false;
  pad = pad || 0;
  for (const wl of map.walls) {
    if (x >= wl.x - pad && x <= wl.x + wl.w + pad &&
        y >= wl.y - pad && y <= wl.y + wl.h + pad) return true;
  }
  return false;
}

function hitsWall(x, y, r) {
  const map = S.map; if (!map) return false;
  for (const wl of map.walls) {
    const nx = Math.max(wl.x, Math.min(x, wl.x + wl.w));
    const ny = Math.max(wl.y, Math.min(y, wl.y + wl.h));
    const dx = x - nx, dy = y - ny;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

// 线段与矩形（按 r 外扩）的最早交点参数 t（0~1），未相交返回 -1
function segRectT(x0, y0, x1, y1, rect, r) {
  const dx = x1 - x0, dy = y1 - y0;
  let t0 = 0, t1 = 1;
  const minX = rect.x - r, maxX = rect.x + rect.w + r;
  const minY = rect.y - r, maxY = rect.y + rect.h + r;
  if (Math.abs(dx) < 1e-9) {
    if (x0 < minX || x0 > maxX) return -1;
  } else {
    let a = (minX - x0) / dx, b = (maxX - x0) / dx;
    if (a > b) { const tmp = a; a = b; b = tmp; }
    if (a > t0) t0 = a;
    if (b < t1) t1 = b;
    if (t0 > t1) return -1;
  }
  if (Math.abs(dy) < 1e-9) {
    if (y0 < minY || y0 > maxY) return -1;
  } else {
    let a = (minY - y0) / dy, b = (maxY - y0) / dy;
    if (a > b) { const tmp = a; a = b; b = tmp; }
    if (a > t0) t0 = a;
    if (b < t1) t1 = b;
    if (t0 > t1) return -1;
  }
  if (t1 < 0 || t0 > 1) return -1;
  return t0;
}

// 线段与圆的最早交点参数 t，未相交返回 -1
function segCircleT(x0, y0, x1, y1, cx, cy, r) {
  const dx = x1 - x0, dy = y1 - y0;
  const fx = x0 - cx, fy = y0 - cy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  const a = dx * dx + dy * dy;
  if (a < 1e-9) return -1;
  const b = 2 * (fx * dx + fy * dy);
  let disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2 * a), t2 = (-b + disc) / (2 * a);
  if (t1 >= 0 && t1 <= 1) return t1;
  if (t2 >= 0 && t2 <= 1) return t2;
  return -1;
}

function resolveCircleWalls(ent) {
  const map = S.map; if (!map) return;
  for (let pass = 0; pass < 2; pass++) {
    for (const wl of map.walls) {
      const nx = Math.max(wl.x, Math.min(ent.x, wl.x + wl.w));
      const ny = Math.max(wl.y, Math.min(ent.y, wl.y + wl.h));
      let dx = ent.x - nx, dy = ent.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 > ent.r * ent.r) continue;
      if (d2 < 0.0001) {
        const left = ent.x - wl.x, right = wl.x + wl.w - ent.x;
        const top = ent.y - wl.y, bottom = wl.y + wl.h - ent.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) ent.x = wl.x - ent.r;
        else if (m === right) ent.x = wl.x + wl.w + ent.r;
        else if (m === top) ent.y = wl.y - ent.r;
        else ent.y = wl.y + wl.h + ent.r;
      } else {
        const d = Math.sqrt(d2), push = ent.r - d;
        ent.x += dx / d * push; ent.y += dy / d * push;
      }
    }
  }
}

// 碰到墙时沿墙滑行，避免敌人永远卡在障碍物后面导致波次无法结束
function slideAlongWalls(ent, nx, ny, dt) {
  const map = S.map; if (!map) return;
  const probeX = ent.x + nx * (ent.r + 10), probeY = ent.y + ny * (ent.r + 10);
  if (!hitsWall(probeX, probeY, ent.r * 0.8)) return;
  if (!ent.slideSign) ent.slideSign = Math.random() < 0.5 ? -1 : 1;
  const sp = (ent.speed || 60) * 0.8;
  ent.x += -ny * ent.slideSign * sp * dt;
  ent.y += nx * ent.slideSign * sp * dt;
  ent.x = Math.max(ent.r, Math.min(map.w - ent.r, ent.x));
  ent.y = Math.max(ent.r, Math.min(map.h - ent.r, ent.y));
  resolveCircleWalls(ent);
}

function viewRect() {
  const z = S.cam.zoom || 1;
  const vw = W / z, vh = H / z;
  return { l: S.cam.x - vw / 2, r: S.cam.x + vw / 2, t: S.cam.y - vh / 2, b: S.cam.y + vh / 2, w: vw, h: vh };
}

function mouseWorld() {
  const z = S.cam.zoom || 1;
  return { x: S.cam.x + (S.mouse.x - W / 2) / z, y: S.cam.y + (S.mouse.y - H / 2) / z };
}

function updateCamera(dt, snap) {
  if (!S.map || !S.player) return;
  const targetZoom = S.visionTimer > 0 ? VISION_ZOOM : 1;
  if (snap) S.cam.zoom = targetZoom;
  else S.cam.zoom += (targetZoom - S.cam.zoom) * Math.min(1, dt * 3.0);

  const vw = W / S.cam.zoom, vh = H / S.cam.zoom;
  const tx = S.map.w <= vw ? S.map.w / 2 : Math.max(vw / 2, Math.min(S.map.w - vw / 2, S.player.x));
  const ty = S.map.h <= vh ? S.map.h / 2 : Math.max(vh / 2, Math.min(S.map.h - vh / 2, S.player.y));

  // 玩家始终锁定屏幕中心；只有镜头撞到地图边界时才产生相对位移
  S.cam.x = tx;
  S.cam.y = ty;
}

function loadWaveMap(wave) {
  const map = buildWaveMap(wave);
  if (!map) return null;
  const p = S.player;

  // 换图时平移场上残留物，避免它们突然出现在墙里
  const dx = map.spawn.x - p.x, dy = map.spawn.y - p.y;
  for (const e of S.echoes) {
    e.x += dx; e.y += dy;
    for (const q of e.path) { q.x += dx; q.y += dy; }
  }
  for (const k of S.knives) {
    k.x += dx; k.y += dy; k.startX += dx; k.startY += dy;
    for (const q of k.trail) { q.x += dx; q.y += dy; }
  }
  for (const pu of S.powerups) { pu.x += dx; pu.y += dy; }
  for (const q of S.particles) { q.x += dx; q.y += dy; }
  for (const sw of S.shockwaves) { sw.x += dx; sw.y += dy; }

  S.map = map;
  p.x = map.spawn.x; p.y = map.spawn.y;
  S.pvx = 0; S.pvy = 0;
  S.prevX = p.x; S.prevY = p.y;
  S.pBullets = []; S.eBullets = [];
  S.history = [];
  S.powerups = S.powerups.filter(pu => !pointInWalls(pu.x, pu.y, 10));
  S.echoes = S.echoes.filter(e => !pointInWalls(e.x, e.y, 0));
  updateCamera(0, true);
  return map;
}

function updateMinimapLabel() {
  minimapModeEl.textContent = S.mini.global ? 'GLOBAL' : 'LOCAL';
  minimapModeEl.classList.toggle('global', !!S.mini.global);
  minimapWrap.classList.toggle('local', !S.mini.global);
  minimapHintEl.textContent = MOBILE ? '点按切换' : `按住 ${keyLabel(KEYBINDS.toggleMap)} 全局`;
}

// ============================================================
//  波次
// ============================================================
function nextWave() {
  S.wave++; S.waveTimer = 0; S.spawnCell = 0;
  const map = loadWaveMap(S.wave);
  const hasBoss = S.wave % BOSS_INTERVAL === 0;

  S.banner = {
    text: 'WAVE ' + S.wave + (map ? ' · ' + map.name : '') + (hasBoss ? ' · BOSS' : ''),
    life: hasBoss ? 2.0 : 1.5
  };
  sfx(520, 0.12, 'triangle', 0.04);

  const n = S.wave;
  const total = Math.min(MAX_ENEMIES - (hasBoss ? 1 : 0), Math.round(14 + n * 6 + Math.max(0, n - 3) * 10));
  const shooters = Math.round(total * 0.20);
  const splitters = Math.round(total * 0.15);
  const hunters = n >= 2 ? Math.max(0, total - Math.round(total * 0.45) - shooters - splitters) : 0;
  const trackers = total - shooters - splitters - hunters;

  const blindChance = n >= 4 ? Math.min(0.7, 0.35 + (n - 4) * 0.06) : 0;
  const types = [];
  for (let i = 0; i < trackers; i++) types.push('tracker');
  for (let i = 0; i < shooters; i++) types.push(Math.random() < blindChance ? 'blinder' : 'shooter');
  for (let i = 0; i < splitters; i++) types.push('splitter');
  for (let i = 0; i < hunters; i++) types.push('hunter');
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = types[i]; types[i] = types[j]; types[j] = tmp;
  }

  // wave 4 起八成怪直接围在玩家四周（内圈 + 外圈），其余散布地图
  const surroundRatio = n >= 4 ? 0.8 : 0.55;
  const surroundTotal = Math.round(types.length * surroundRatio);
  const v = viewRect();
  const innerCount = Math.round(surroundTotal * (n >= 4 ? 0.55 : 0.35));
  const innerMin = Math.max(340, Math.min(v.w, v.h) * 0.4);
  const innerMax = Math.max(innerMin + 160, Math.min(v.w, v.h) * 0.78);
  const outerMin = innerMax + 60;
  const outerMax = Math.max(outerMin + 200, Math.max(v.w, v.h) * 0.78);
  for (let i = 0; i < surroundTotal; i++) {
    const type = types.pop();
    if (!type) break;
    const ang = (i / Math.max(1, surroundTotal)) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
    const inner = i < innerCount;
    const pt = ringSpawnPoint(ang, inner ? innerMin : outerMin, inner ? innerMax : outerMax);
    if (!pt) continue;
    spawnEnemy(type, (i % 14) * 55 + Math.random() * 60, false, pt);
  }
  for (const type of types) {
    spawnEnemy(type, Math.random() * 900, true);
  }

  // 不再有单独的 Boss 波：Boss 与普通小怪同时出现在同一张地图
  if (hasBoss) {
    sfx(220, 0.3, 'sawtooth', 0.06);
    setTimeout(() => sfx(160, 0.35, 'sawtooth', 0.05), 150);
    spawnBoss();
  }
}

// 在 3x3 的地图分区里轮流选点，保证怪物铺满整张地图
function farSpawnPoint(minDist) {
  const map = S.map, p = S.player;
  if (!map || !p) return null;
  const cols = 3, rows = 3, total = cols * rows;
  const cw = map.w / cols, ch = map.h / rows;
  for (let attempt = 0; attempt < total; attempt++) {
    const cell = (S.spawnCell++) % total;
    const cx = (cell % cols) * cw, cy = Math.floor(cell / cols) * ch;
    for (let i = 0; i < 24; i++) {
      const x = cx + 90 + Math.random() * Math.max(1, cw - 180);
      const y = cy + 90 + Math.random() * Math.max(1, ch - 180);
      if (Math.hypot(x - p.x, y - p.y) < minDist) continue;
      if (hitsWall(x, y, 34)) continue;
      return { x, y };
    }
  }
  for (let i = 0; i < 60; i++) {
    const x = 100 + Math.random() * (map.w - 200);
    const y = 100 + Math.random() * (map.h - 200);
    if (Math.hypot(x - p.x, y - p.y) < minDist * 0.8) continue;
    if (!hitsWall(x, y, 34)) return { x, y };
  }
  return null;
}

// 围绕玩家一圈取点，用来制造包围感
function ringSpawnPoint(angle, minR, maxR) {
  const map = S.map, p = S.player;
  if (!map || !p) return null;
  for (let i = 0; i < 26; i++) {
    const ang = angle + (Math.random() - 0.5) * 0.16;
    const r = minR + Math.random() * (maxR - minR);
    const x = p.x + Math.cos(ang) * r;
    const y = p.y + Math.sin(ang) * r;
    if (x < 90 || x > map.w - 90 || y < 90 || y > map.h - 90) continue;
    if (hitsWall(x, y, 34)) continue;
    return { x, y };
  }
  return null;
}

function spawnBoss() {
  const bossNum = Math.floor(S.wave / BOSS_INTERVAL);
  const hp = 30 + bossNum * 20;
  const map = S.map;
  const pt = farSpawnPoint(560) || (map ? { x: map.w / 2, y: map.h / 2 } : { x: W / 2, y: -90 });
  const boss = {
    x: pt.x, y: pt.y, type: 'boss', r: 42, hp, maxHp: hp,
    speed: 32 + bossNum * 4, age: 0, hitFlash: 0,
    fireCd: 2.0, ringCd: 3.0, delay: 0.8, color: '#ff3b5c', isBoss: true
  };
  S.enemies.push(boss);
  S.bossRef = boss;
  S.bossBarAlpha = 0;
}

function spawnEnemy(type, delay = 0, far = false, at = null) {
  if (S.enemies.length >= MAX_ENEMIES) return;
  const map = S.map;
  const v = viewRect();
  const margin = 70;
  let x, y;
  const pt = at || (far ? farSpawnPoint(420) : null);
  if (pt) {
    x = pt.x; y = pt.y;
  } else {
    for (let tries = 0; tries < 30; tries++) {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = v.l + Math.random() * v.w; y = v.t - margin; }
      else if (side === 1) { x = v.r + margin; y = v.t + Math.random() * v.h; }
      else if (side === 2) { x = v.l + Math.random() * v.w; y = v.b + margin; }
      else { x = v.l - margin; y = v.t + Math.random() * v.h; }
      if (map) {
        x = Math.max(40, Math.min(map.w - 40, x));
        y = Math.max(40, Math.min(map.h - 40, y));
      }
      if (!hitsWall(x, y, 26)) break;
      if (tries === 29) { x = v.l + Math.random() * v.w; y = v.t - 120; }
    }
  }
  const waveScale = 1 + S.wave * 0.06;
  const base = { x, y, type, delay: delay / 1000, age: 0, fireCd: 1.5 + Math.random() * 1.5, hitFlash: 0 };
  if (far && pt) { base.dormant = true; base.aggroRange = 600 + Math.random() * 120; }
  if (type === 'tracker') Object.assign(base, { r: 14, hp: 1, maxHp: 1, speed: 62 * waveScale, color: '#ff5c7a' });
  else if (type === 'shooter') Object.assign(base, { r: 16, hp: 2, maxHp: 2, speed: 42 * waveScale, color: '#c084fc' });
  else if (type === 'blinder') Object.assign(base, { r: 16, hp: 2, maxHp: 2, speed: 44 * waveScale, color: '#ffd166' });
  else if (type === 'splitter') Object.assign(base, { r: 18, hp: 2, maxHp: 2, speed: 44 * waveScale, color: '#7ef9d0' });
  else if (type === 'mini') Object.assign(base, { r: 9, hp: 1, maxHp: 1, speed: 95 * waveScale, color: '#ff9d5c', delay: 0 });
  else if (type === 'hunter') Object.assign(base, { r: 13, hp: 1, maxHp: 1, speed: 85 * waveScale, color: '#ff9d5c' });
  S.enemies.push(base);
}

// ============================================================
//  爆破技能
// ============================================================
function triggerBomb() {
  if (!S.bombUnlocked || S.bombCd > 0) return;
  
  const stacks = S.bombStacks;
  const radius = BOMB_RADIUS_BASE + 30 * (stacks - 1);
  const baseForce = BOMB_FORCE_BASE + 100 * (stacks - 1);
  S.bombCd = Math.max(0.8, BOMB_CD_BASE - 0.3 * (stacks - 1));
  
  const p = S.player;
  
  // 物理排斥
  for (const b of S.eBullets) {
    const dx = b.x - p.x, dy = b.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < radius && dist > 0.1) {
      const power = Math.max(0.25, 1 - dist / radius);
      const force = baseForce * power;
      const nx = dx / dist, ny = dy / dist;
      b.pushVx = (b.pushVx || 0) + nx * force;
      b.pushVy = (b.pushVy || 0) + ny * force;
    }
  }
  
  // 冲击波与视觉
  S.shockwaves.push({ x: p.x, y: p.y, r: p.r, maxR: radius, life: 0.45, maxLife: 0.45, color: '212,196,138' });
  
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 150 + Math.random() * 250;
    S.particles.push({
      x: p.x + Math.cos(a) * p.r, y: p.y + Math.sin(a) * p.r,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5, maxLife: 0.5,
      color: Math.random() < 0.5 ? '212,196,138' : '255,240,200',
      size: 2 + Math.random() * 3
    });
  }
  
  S.shake = Math.max(S.shake, 14);
  sfx(90, 0.25, 'sawtooth', 0.06);
  setTimeout(() => sfx(160, 0.15, 'square', 0.04), 60);
  updateBombHUD();
}

// ============================================================
//  玩家普通射击
// ============================================================
function playerShoot(now) {
  const cd = S.buffs.fireRate > 0 ? PLAYER_SHOT_CD_FAST : PLAYER_SHOT_CD;
  if (now - S.lastShot < cd * 1000) return;
  S.lastShot = now;

  const p = S.player;
  const mw = mouseWorld();
  const dx = mw.x - p.x, dy = mw.y - p.y;
  const d = Math.hypot(dx, dy) || 1;
  const baseAngle = Math.atan2(dy, dx);
  p.angle = baseAngle;

  const count = S.buffs.spread > 0 ? 3 : 1;
  const spreadStep = 0.14;

  for (let i = 0; i < count; i++) {
    const off = count === 1 ? 0 : (i - (count - 1) / 2) * spreadStep;
    const a = baseAngle + off;
    const nx = Math.cos(a), ny = Math.sin(a);
    S.pBullets.push({
      x: p.x + nx * (p.r + 4), y: p.y + ny * (p.r + 4),
      vx: nx * 760, vy: ny * 760, r: 3.5, life: 999,
      damage: BULLET_DAMAGE, color: '#ffd166', echo: false
    });
  }

  const nx = Math.cos(baseAngle), ny = Math.sin(baseAngle);
  for (let i = 0; i < 2; i++) {
    S.particles.push({
      x: p.x + nx * (p.r + 2), y: p.y + ny * (p.r + 2),
      vx: nx * 80 + (Math.random() - .5) * 80, vy: ny * 80 + (Math.random() - .5) * 80,
      life: .15, maxLife: .15, color: '255,209,102', size: 2 + Math.random() * 2
    });
  }
  sfx(count > 1 ? 540 : 620, 0.04, 'square', 0.012);
}

// ============================================================
//  狙击
// ============================================================
function toggleSniper() {
  if (S.sniperMode) {
    S.sniperMode = false;
    S.sniperRecoil = 0;
    S.sniperTriggered = false;
    S.focusActive = false;
    sfx(400, 0.1, 'sine', 0.03);
    updateSniperHUD();
    return;
  }
  if (S.sniperMag <= 0) {
    S.banner = { text: '无狙击弹药', life: 0.9 };
    sfx(220, 0.06, 'square', 0.02);
    return;
  }
  
  if (S.isChargingMelee) {
    S.isChargingMelee = false;
    S.meleeCharge = 0;
  }
  S.sniperMode = true;
  S.sniperCd = 0;
  S.sniperTriggered = false;
  if (MOBILE) S.banner = { text: '推满右摇杆发射', life: 1.4 };
  sfx(600, 0.1, 'sine', 0.03);
  setTimeout(() => sfx(1200, 0.1, 'sine', 0.025), 70);
  updateSniperHUD();
  updateMeleeHUD();
}

function sniperShoot() {
  if (!S.sniperMode || S.sniperMag <= 0 || S.sniperCd > 0) {
    if (S.sniperCd > 0) { S.sniperFailFlash = 0.08; sfx(220, 0.04, 'square', 0.02); }
    return;
  }

  S.sniperMag--;
  S.sniperCd = SNIPER_CD;
  const p = S.player;
  const mw = mouseWorld();
  const baseAngle = Math.atan2(mw.y - p.y, mw.x - p.x);
  p.angle = baseAngle;

  const spread = S.currentSpread;
  const offset = (Math.random() - 0.5) * spread;
  const a = baseAngle + offset;
  const nx = Math.cos(a), ny = Math.sin(a);

  S.pBullets.push({
    x: p.x + nx * (p.r + 22), y: p.y + ny * (p.r + 22),
    vx: nx * SNIPER_BULLET_SPEED, vy: ny * SNIPER_BULLET_SPEED,
    r: 4, life: 999, damage: SNIPER_DAMAGE, color: '#ffffff',
    isSniper: true, trail: []
  });

  // 抛壳
  for (let i = 0; i < 2; i++) {
    const ca = baseAngle + Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    S.particles.push({
      x: p.x + nx * (p.r + 6), y: p.y + ny * (p.r + 6),
      vx: Math.cos(ca) * (60 + Math.random() * 50), vy: Math.sin(ca) * (60 + Math.random() * 50),
      life: 0.4, maxLife: 0.4, color: '212,196,138', size: 2.2
    });
  }

  S.sniperRecoil = 1; S.muzzleFlash = 0.08; S.shake = Math.max(S.shake, 6);
  sfx(1400, 0.03, 'square', 0.022);

  if (S.sniperMag <= 0) {
    setTimeout(() => {
      if (S.sniperMag <= 0 && S.sniperMode) {
        S.sniperMode = false; S.sniperTriggered = false; S.focusActive = false;
        S.banner = { text: '弹夹耗尽', life: 0.9 };
        updateSniperHUD();
      }
    }, 120);
  }
  updateSniperHUD();
}

// ============================================================
//  飞刀逻辑
// ============================================================
function throwMelee() {
  if (S.meleeCd > 0 || !S.meleeUnlocked || S.meleeCount < 2) return;
  
  S.meleeCount -= 2;
  const power = S.meleeCharge / MELEE_MAX_CHARGE; // 0 ~ 1
  S.meleeCd = MELEE_CD;
  S.meleeCharge = 0;
  
  const p = S.player;
  const baseAngle = p.angle;
  const speed = MELEE_BASE_SPEED + power * (MELEE_MAX_SPEED - MELEE_BASE_SPEED);
  const amplitude = 15 + power * 45; 
  const frequency = 3 + power * 4; 
  const spinSpeed = 10 + power * 15;

  for (const side of [-1, 1]) {
    const a = baseAngle + side * MELEE_ANGLE;
    S.knives.push({
      x: p.x, y: p.y,
      startX: p.x, startY: p.y,
      baseAngle: a,
      time: 0, speed, amplitude, frequency, spinSpeed,
      angle: Math.random() * Math.PI * 2,
      r: 12, durability: MELEE_MAX_DURABILITY, trail: []
    });
  }
  
  S.shake = Math.max(S.shake, 8);
  sfx(800, 0.1, 'sine', 0.04);
  updateMeleeHUD();
}

function updateKnives(dt) {
  for (let i = S.knives.length - 1; i >= 0; i--) {
    const k = S.knives[i];
    k.time += dt;
    k.angle += k.spinSpeed * dt;

    k.trail.push({ x: k.x, y: k.y });
    if (k.trail.length > 15) k.trail.shift();

    const forward = k.speed * k.time;
    const currentAmp = k.amplitude * Math.max(0, 1 - k.time / MELEE_MAX_LIFE); 
    const offset = currentAmp * Math.sin(k.time * k.frequency * Math.PI * 2);
    
    const dirX = Math.cos(k.baseAngle);
    const dirY = Math.sin(k.baseAngle);
    const perpX = -Math.sin(k.baseAngle);
    const perpY = Math.cos(k.baseAngle);

    k.x = k.startX + dirX * forward + perpX * offset;
    k.y = k.startY + dirY * forward + perpY * offset;

    // 刮去敌方子弹
    for (let bIdx = S.eBullets.length - 1; bIdx >= 0; bIdx--) {
      const b = S.eBullets[bIdx];
      const dx = k.x - b.x, dy = k.y - b.y;
      if (dx * dx + dy * dy < (k.r + b.r) * (k.r + b.r)) {
        S.eBullets.splice(bIdx, 1);
        k.durability -= 2;
        
        for (let c = 0; c < 3; c++) {
          const ca = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 80;
          S.particles.push({
            x: b.x, y: b.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
            life: 0.2, maxLife: 0.2, color: '255,92,122', size: 1.5 + Math.random()
          });
        }
      }
    }

    // 碰撞怪物（一帧一判）
    for (let j = S.enemies.length - 1; j >= 0; j--) {
      const en = S.enemies[j];
      if (en.delay > 0) continue;
      
      const dx = k.x - en.x, dy = k.y - en.y;
      const rr = k.r + en.r;
      
      if (dx * dx + dy * dy < rr * rr) {
        en.hp -= 1;
        en.hitFlash = 0.1;
        
        let durabilityCost = 2;
        if (en.type === 'shooter') durabilityCost = 3;
        else if (en.type === 'splitter') durabilityCost = 4;
        else if (en.type === 'hunter') durabilityCost = 3;
        else if (en.type === 'boss') durabilityCost = 10;
        
        k.durability -= durabilityCost;
        
        if (Math.random() < 0.5) {
          for (let c = 0; c < 2; c++) {
            const ca = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 100;
            S.particles.push({
              x: k.x, y: k.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
              life: 0.2, maxLife: 0.2, color: '232,244,255', size: 1.5 + Math.random()
            });
          }
        }
        
        if (en.hp <= 0) killEnemy(j, 0.5);
      }
    }

    const mapW = S.map ? S.map.w : W, mapH = S.map ? S.map.h : H;
    if (k.durability <= 0 || k.time > MELEE_MAX_LIFE ||
        k.x < -50 || k.x > mapW + 50 || k.y < -50 || k.y > mapH + 50) {
      S.knives.splice(i, 1);
      
      for (let c = 0; c < 8; c++) {
        const ca = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
        S.particles.push({
          x: k.x, y: k.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
          life: 0.3, maxLife: 0.3, color: '95,184,255', size: 1.5 + Math.random() * 2
        });
      }
    }
  }
}

//  道具
// ============================================================
function spawnPowerupAt(x, y, force = false) {
  if (!force) {
    for (const pu of S.powerups) if (Math.hypot(pu.x - x, pu.y - y) < 60) return false;
    if (S.powerups.length >= POWERUP_MAX_GROUND) return false;
  }
  
  const r = Math.random();
  let type = 'fireRate';
  if (r < 0.20) type = 'fireRate';
  else if (r < 0.38) type = 'spread';
  else if (r < 0.54) type = 'sniper';
  else if (r < 0.66) type = 'melee';
  else if (r < 0.76) type = 'heal';
  else if (r < 0.86) type = 'vision';
  else if (r < 0.94) type = 'bomb';
  else type = 'secondChance';

  S.powerups.push({
    x, y, type, life: POWERUP_LIFE, maxLife: POWERUP_LIFE,
    bob: Math.random() * Math.PI * 2, spawnT: 0
  });
  return true;
}

function spawnRandomPowerup() {
  const map = S.map;
  const v = viewRect();
  for (let tries = 0; tries < 40; tries++) {
    const x = v.l + 100 + Math.random() * Math.max(1, v.w - 200);
    const y = v.t + 100 + Math.random() * Math.max(1, v.h - 200);
    if (map && (x < 60 || x > map.w - 60 || y < 60 || y > map.h - 60)) continue;
    if (S.player && Math.hypot(x - S.player.x, y - S.player.y) < 120) continue;
    if (hitsWall(x, y, 26)) continue;
    if (spawnPowerupAt(x, y)) return;
  }
}

function pickupPowerup(pu) {
  const def = POWERUP_TYPES[pu.type];

  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
    S.particles.push({
      x: pu.x, y: pu.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.45, maxLife: 0.45, color: def.rgb, size: 2 + Math.random() * 3
    });
  }
  S.particles.push({
    x: pu.x, y: pu.y, vx: 0, vy: 0,
    life: 0.4, maxLife: 0.4, color: def.rgb, size: 34, ring: true
  });

  if (pu.type === 'sniper') {
    S.sniperMag = Math.min(SNIPER_MAX_MAG, S.sniperMag + SNIPER_MAG_SIZE);
    sfx(500, 0.07, 'square', 0.03);
    setTimeout(() => sfx(1000, 0.07, 'square', 0.03), 60);
    S.banner = { text: '+狙击弹夹', life: 0.9 };
    updateSniperHUD();
    return;
  }

  if (pu.type === 'melee') {
    S.meleeUnlocked = true;
    S.meleeCount += 4;
    sfx(700, 0.1, 'sawtooth', 0.03);
    setTimeout(() => sfx(1400, 0.1, 'sawtooth', 0.03), 80);
    S.banner = { text: '+飞刀 x4', life: 1.2 };
    updateMeleeHUD();
    return;
  }
  
  if (pu.type === 'heal') {
    if (S.player.hp < 3) {
      S.player.hp++;
      S.banner = { text: '恢复 1 HP', life: 1.0 };
      sfx(600, 0.1, 'sine', 0.04);
      setTimeout(() => sfx(900, 0.15, 'sine', 0.04), 80);
      updateHUD();
    } else {
      S.energy = Math.min(S.maxEnergy, S.energy + 1);
      S.banner = { text: '生命已满 (+1 能量)', life: 1.0 };
      sfx(800, 0.1, 'sine', 0.03);
      updateHUD();
    }
    return;
  }
  
  if (pu.type === 'bomb') {
    if (!S.bombUnlocked) {
      S.bombUnlocked = true;
      S.bombStacks = 1;
      S.bombCd = 0;
      S.banner = { text: '解锁技能：爆破', life: 1.2 };
    } else if (S.bombStacks < BOMB_MAX_STACKS) {
      S.bombStacks++;
      S.banner = { text: `爆破强化 x${S.bombStacks}`, life: 1.2 };
    } else {
      S.score += 50;
      S.banner = { text: '爆破已满级 (+50分)', life: 1.0 };
    }
    sfx(400, 0.15, 'square', 0.04);
    setTimeout(() => sfx(800, 0.1, 'square', 0.03), 60);
    updateBombHUD();
    return;
  }
  
  if (pu.type === 'secondChance') {
    if (!S.secondChance) {
      S.secondChance = true;
      S.banner = { text: '获得：第二次机会', life: 1.2 };
      sfx(660, 0.15, 'sine', 0.04);
      setTimeout(() => sfx(990, 0.15, 'sine', 0.03), 80);
      setTimeout(() => sfx(1320, 0.2, 'sine', 0.03), 160);
    } else {
      S.score += 50;
      S.banner = { text: '已有该技能 (+50分)', life: 1.0 };
      sfx(400, 0.1, 'sine', 0.03);
    }
    updateSecondChanceHUD();
    return;
  }

  if (pu.type === 'vision') {
    S.visionTimer = Math.min(VISION_DURATION * 2.2, S.visionTimer + VISION_DURATION);
    S.banner = { text: '获得：广域视野', life: 1.2 };
    sfx(520, 0.12, 'sine', 0.03);
    setTimeout(() => sfx(780, 0.12, 'sine', 0.03), 80);
    setTimeout(() => sfx(1040, 0.16, 'sine', 0.025), 160);
    updateBuffsUI(true);
    return;
  }

  S.buffs[pu.type] = BUFF_DURATION[pu.type];

  if (pu.type === 'fireRate') {
    sfx(880, 0.08, 'sine', 0.04);
    setTimeout(() => sfx(1180, 0.08, 'sine', 0.03), 70);
  } else {
    sfx(660, 0.08, 'triangle', 0.04);
    setTimeout(() => sfx(990, 0.08, 'triangle', 0.03), 70);
  }
  updateBuffsUI(true);
}

// ============================================================
function spawnEcho() {
  if (S.energy < ECHO_COST || S.echoCd > 0 || S.echoes.length >= MAX_ECHO) return;
  const now = performance.now();
  const windowMs = 2000;
  const recent = S.history.filter(h => now - h.t < windowMs);
  if (recent.length < 2) return;
  S.energy -= ECHO_COST; S.echoCd = 0.5;
  const t0 = now - windowMs;
  const path = recent.map(h => ({ dt: (h.t - t0) / 1000, x: h.x, y: h.y }));
  S.echoes.push({
    path, elapsed: 0, life: ECHO_LIFE, maxLife: ECHO_LIFE,
    shootCd: 0.1, r: 9, color: '#5fb8ff', x: path[0].x, y: path[0].y,
    hp: ECHO_HP, maxHp: ECHO_HP, hitFlash: 0
  });
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 100;
    S.particles.push({
      x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: .4, maxLife: .4, color: '95,184,255', size: 2 + Math.random() * 2
    });
  }
  sfx(880, 0.1, 'sine', 0.04);
  updateHUD();
}

function detonateEchoes() {
  if (S.detonateCd > 0 || S.echoes.length === 0) return;
  S.detonateCd = DETONATE_CD;
  const echoes = [...S.echoes];
  S.echoes = [];
  for (const e of echoes) {
    const power = 2 + Math.floor(e.hp);
    for (let i = S.enemies.length - 1; i >= 0; i--) {
      const en = S.enemies[i];
      const d = Math.hypot(en.x - e.x, en.y - e.y);
      if (d < 100) {
        en.hp -= power; en.hitFlash = 0.15;
        if (en.hp <= 0) killEnemy(i, 0.3);
      }
    }
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 200;
      S.particles.push({
        x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.6, maxLife: 0.6, color: '95,184,255', size: 2 + Math.random() * 4
      });
    }
    S.particles.push({
      x: e.x, y: e.y, vx: 0, vy: 0,
      life: 0.4, maxLife: 0.4, color: '95,184,255', size: 45, ring: true
    });
  }
  S.shake = Math.max(S.shake, 12);
  sfx(120, 0.3, 'sawtooth', 0.06);
  updateHUD();
}

function destroyEcho(echo) {
  const idx = S.echoes.indexOf(echo);
  if (idx < 0) return;
  S.echoes.splice(idx, 1);
  const power = 1 + Math.floor(echo.hp);
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const en = S.enemies[i];
    const d = Math.hypot(en.x - echo.x, en.y - echo.y);
    if (d < 70) {
      en.hp -= power; en.hitFlash = 0.15;
      if (en.hp <= 0) killEnemy(i, 0.2);
    }
  }
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 150;
    S.particles.push({
      x: echo.x, y: echo.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.4, maxLife: 0.4, color: '95,184,255', size: 2 + Math.random() * 3
    });
  }
  S.shake = Math.max(S.shake, 6);
  sfx(240, 0.12, 'sawtooth', 0.03);
  updateHUD();
}
