function makeCardSlots() {
  const out = [];
  for (let i = 0; i < CARD_SLOT_COUNT; i++) {
    out.push({ id: null, targetId: null, phase: 'empty', t: 0, dur: 0, oldStartY: 0, flash: 0, bubblePop: 0, prevBubble: '', retry: 0, group: 0, maxGroup: 0 });
  }
  return out;
}

function hasCardSkill(id) {
  return S.cards.some(c => c.id === id || c.targetId === id);
}

function cardCooldown(id) {
  switch (id) {
    case 'echo': return 0.8;
    case 'detonate': return DETONATE_CD;
    case 'bomb': return BOMB_CD_BASE;
    case 'sniper': return 1.0;
    case 'melee': return MELEE_CD;
    case 'pet': return PET_CD;
    case 'burrow': return BURROW_CD;
    case 'focus': return 1.0;
    case 'vision': return 1.0;
    case 'second': return 1.0;
    default: return 1.0;
  }
}

function cardSkillLoadable(id) {
  if (!S.running || S.over || S.paused) return false;
  switch (id) {
    case 'echo': return S.energy >= ECHO_COST && S.echoes.length < MAX_ECHO;
    case 'detonate': return S.echoes.length > 0;
    case 'bomb': return !!S.bombUnlocked;
    case 'sniper': return S.sniperMag > 0;
    case 'melee': return S.meleeUnlocked && S.meleeCount >= 2;
    case 'pet': return S.eggStacks > 0;
    case 'burrow': return true;
    case 'focus': return true;
    case 'vision': return S.visionBank > 0 || S.visionTimer > 0;
    case 'second': return !!S.secondChance;
    case 'life': return true;
    default: return false;
  }
}

function cardSkillUsable(id) {
  switch (id) {
    case 'echo': return S.energy >= ECHO_COST && S.echoCd <= 0 && S.echoes.length < MAX_ECHO;
    case 'detonate': return S.echoes.length > 0 && S.detonateCd <= 0;
    case 'bomb': return !!S.bombUnlocked && S.bombCd <= 0;
    case 'sniper': return S.sniperMag > 0;
    case 'melee': return S.meleeUnlocked && S.meleeCount >= 2 && S.meleeCd <= 0;
    case 'pet': return S.eggStacks > 0 && S.petCd <= 0 && S.pets.length < PET_MAX_ALIVE;
    case 'burrow': return S.burrowCd <= 0 && S.burrowTimer <= 0;
    case 'focus': return true;
    case 'vision': return S.visionBank > 0;
    case 'second': return false;
    case 'life': return true;
    default: return false;
  }
}

function cardGroupText(id, g) {
  g = Math.max(0, Math.round(g || 0));
  switch (id) {
    case 'sniper': return `${g}发`;
    case 'melee': return `${g}把`;
    case 'pet': return `${g}蛋`;
    case 'vision': return `${g}s`;
    case 'life': return `+${g}`;
    case 'echo': return `${g}次`;
    case 'detonate': return `${g}`;
    case 'bomb': return `${g}`;
    case 'burrow': return `${g}`;
    case 'focus': return `${g}`;
    case 'second': return `${g}`;
    default: return String(g);
  }
}

function cardDurability(id, slot) {
  const g = (slot && slot.group) || CARD_GROUPS[id] || 1;
  const max = (slot && slot.maxGroup) || g;
  return { p: Math.max(0, Math.min(1, g / Math.max(1, max))), text: cardGroupText(id, g) };
}

function skillBadgeText(id) {
  switch (id) {
    case 'echo': return `${Math.floor(S.energy / ECHO_COST)}次`;
    case 'detonate': return String(S.echoes.length);
    case 'bomb': return `x${S.bombStacks}`;
    case 'sniper': return `${S.sniperMag}发`;
    case 'melee': return `${S.meleeCount}把`;
    case 'pet': return `${S.eggStacks}蛋`;
    case 'burrow': return S.burrowCd > 0 ? `${Math.ceil(S.burrowCd)}s` : '';
    case 'focus': return '';
    case 'vision': {
      const t = S.visionTimer > 0 ? S.visionTimer : S.visionBank;
      return t > 0 ? `${Math.ceil(t)}s` : '';
    }
    case 'second': return S.secondChance ? '1' : '';
    case 'life': return '+1';
    default: return '';
  }
}

function cardBubbleText(id, slot) {
  const g = (slot && slot.group) || CARD_GROUPS[id] || 1;
  return cardGroupText(id, g);
}

function startCardSwitch(slot, newId) {
  let oldStart = 0;
  if (slot.phase === 'switch') {
    const p = Math.min(1, slot.t / CARD_SLIDE_TIME);
    const e = p * p * (3 - 2 * p);
    oldStart = -CARD_H + CARD_H * e;
    slot.id = slot.targetId;
  } else if (slot.phase === 'delete') {
    const p = Math.min(1, slot.t / CARD_SLIDE_TIME);
    const e = p * p * (3 - 2 * p);
    oldStart = slot.oldStartY + (CARD_H - slot.oldStartY) * e;
  } else if (slot.phase === 'empty' || slot.phase === 'return') {
    oldStart = CARD_H;
    slot.id = null;
  } else {
    oldStart = 0;
  }
  slot.targetId = newId;
  slot.phase = 'switch';
  slot.t = 0;
  slot.oldStartY = oldStart;
  slot.flash = 0;
  slot.retry = 0;
}

function startCardDelete(slot) {
  const loaded = slot.phase === 'ready' || slot.phase === 'cooldown';
  let oldStart = 0;
  if (slot.phase === 'switch') {
    const p = Math.min(1, slot.t / CARD_SLIDE_TIME);
    const e = p * p * (3 - 2 * p);
    oldStart = -CARD_H + CARD_H * e;
    slot.id = slot.targetId;
  } else if (slot.phase === 'delete') {
    return;
  } else if (slot.phase === 'empty' || slot.phase === 'return') {
    return;
  }
  const id = slot.id;
  slot.targetId = null;
  slot.phase = 'delete';
  slot.t = 0;
  slot.oldStartY = oldStart;
  if (id === 'sniper') { S.sniperMode = false; S.focusActive = false; }
  if (id === 'focus') S.focusActive = false;
  showSkillToast(loaded ? `删除 ${CARD_NAMES[id] || ''}` : `退回背包 ${CARD_NAMES[id] || ''}`);
}

let dDownAt = 0;
function cardKeyIndex(k) {
  if (k >= '1' && k <= '9') return Number(k) - 1;
  if (k === '0') return 9;
  if (k === '-') return 10;
  if (k === '=') return 11;
  return -1;
}
function deleteCardSlot(i) {
  const slot = S.cards[i];
  if (!slot || slot.phase === 'empty') { showSkillToast('槽位为空'); return; }
  startCardDelete(slot);
}

function quickUseSkill(id) {
  if (!S.cardMode || !CARD_NAMES[id]) return;
  let slot = S.cards.find(c => c.id === id || c.targetId === id);
  if (!slot) {
    slot = S.cards.find(c => c.phase === 'empty');
    if (!slot) slot = S.cards[0];
    if (!cardSkillLoadable(id)) {
      showSkillToast(`无法装载：${CARD_NAMES[id]}`);
      return;
    }
    const replacing = slot.phase !== 'empty';
    const grp = CARD_GROUPS[id] || 1;
    startCardSwitch(slot, id);
    showSkillToast(`${replacing ? '替换' : '装载'} ${CARD_NAMES[id]}（一组 ${cardGroupText(id, grp)}）→ 槽位${S.cards.indexOf(slot) + 1}`);
    return;
  }
  if (slot.phase === 'switch' || slot.phase === 'load') showSkillToast(`装载中：${CARD_NAMES[id]}`);
  else if (slot.phase === 'return') showSkillToast(`正在收回背包：${CARD_NAMES[id]}`);
  else if (slot.phase === 'cooldown') showSkillToast(`自动冷却中：${CARD_NAMES[id]}`);
  else if (slot.phase === 'ready') showSkillToast(`已装载：${CARD_NAMES[id]}（自动生效后收回）`);
  else showSkillToast(`${CARD_NAMES[id]} 正在删除`);
}

function cardDepleted(id) {
  switch (id) {
    case 'sniper': return S.sniperMag <= 0;
    case 'melee': return !S.meleeUnlocked || S.meleeCount < 2;
    case 'pet': return S.eggStacks <= 0;
    case 'vision': return S.visionTimer <= 0 && S.visionBank <= 0;
    default: return false;
  }
}

function cardSkillRemaining(id) {
  switch (id) {
    case 'echo': return Math.max(0, S.echoCd);
    case 'detonate': return Math.max(0, S.detonateCd);
    case 'bomb': return Math.max(0, S.bombCd);
    case 'melee': return Math.max(0, S.meleeCd);
    case 'pet': return Math.max(0, S.petCd);
    case 'burrow': return Math.max(0, S.burrowCd);
    default: return 0;
  }
}

function returnCardToBag(slot, text) {
  if (!slot.id) return;
  slot.flash = 0.55;
  slot.bubblePop = 1;
  if (S.skillBadgePop) S.skillBadgePop[slot.id] = 1;
  slot.phase = 'return';
  slot.t = 0;
  const idx = CARD_SKILLS.indexOf(slot.id);
  if (idx >= 0) {
    const L = getCardLayout();
    const p = L.icons.find(q => q.i === idx);
    if (p) {
      slot.returnX = p.x;
      slot.returnY = p.y - CARD_H / 2;
    }
  }
  S.banner = { text: '', life: 0 };
  showSkillToast(text || `已收回背包：${CARD_NAMES[slot.id] || ''}`);
}

function autoCastSlot(slot) {
  if (!S.running || S.over || S.paused || !slot.id) return;
  const id = slot.id;
  const kind = CARD_AUTO[id] || 'repeat';

  if (kind === 'passive') {
    returnCardToBag(slot, `被动保持 · 已收回背包：${CARD_NAMES[id]}`);
    return;
  }

  if (kind === 'toggle') {
    if (id === 'sniper') {
      if (S.sniperMag <= 0) { returnCardToBag(slot, '狙击弹夹已空 · 已收回背包'); return; }
      toggleSniper();
      returnCardToBag(slot, `自动${S.sniperMode ? '开启' : '关闭'}：狙击 · 已收回背包`);
      return;
    }
    if (id === 'focus') {
      S.focusActive = !S.focusActive;
      returnCardToBag(slot, `自动${S.focusActive ? '开启' : '关闭'}：精准 · 已收回背包`);
      return;
    }
    returnCardToBag(slot);
    return;
  }

  if (kind === 'duration') {
    let text = '视野生效中 · 已收回背包';
    if (S.visionTimer <= 0 && S.visionBank > 0 && applyCardSkill('vision')) {
      text = '自动生效：视野 · 已收回背包';
    }
    returnCardToBag(slot, text);
    return;
  }

  if (cardDepleted(id)) { returnCardToBag(slot, `耐久耗尽 · 已收回背包：${CARD_NAMES[id]}`); return; }
  if (!cardSkillUsable(id)) {
    slot.phase = 'ready';
    slot.retry = 0.45;
    return;
  }
  if (applyCardSkill(id)) {
    returnCardToBag(slot, `自动生效：${CARD_NAMES[id]} · 已收回背包`);
  } else {
    slot.phase = 'ready';
    slot.retry = 0.45;
  }
}

function applyCardSkill(id) {
  switch (id) {
    case 'echo': spawnEcho(); return true;
    case 'detonate': detonateEchoes(); return true;
    case 'bomb': triggerBomb(); return true;
    case 'sniper': if (!S.sniperMode) toggleSniper(); return true;
    case 'melee':
      S.meleeCharge = MELEE_MAX_CHARGE;
      throwMelee();
      return true;
    case 'pet': summonPets(); return true;
    case 'burrow': activateBurrow(); return true;
    case 'focus': S.focusActive = true; return true;
    case 'vision': {
      const take = Math.min(VISION_DURATION, S.visionBank);
      if (take <= 0) return false;
      S.visionBank -= take;
      S.visionTimer = Math.min(VISION_MAX_ACTIVE, S.visionTimer + take);
      saveVisionState(S.visionBank + S.visionTimer);
      return true;
    }
    case 'second': return false;
    case 'life': S.player.hp += 1; updateHUD(); return true;
    default: return false;
  }
}

function updateSkillBadgePops(dt) {
  for (const id of CARD_SKILLS) {
    const text = skillBadgeText(id);
    if (S.skillBadgePrev[id] !== undefined && S.skillBadgePrev[id] !== text && text) {
      S.skillBadgePop[id] = 1;
    }
    S.skillBadgePrev[id] = text;
    S.skillBadgePop[id] = (S.skillBadgePop[id] || 0) * Math.pow(0.02, dt);
  }
}

function updateCards(dt) {
  if (!S.cardMode) return;
  if (S.deleteArmed > 0) S.deleteArmed = Math.max(0, S.deleteArmed - dt);
  updateSkillBadgePops(dt);

  for (const slot of S.cards) {
    if (slot.flash > 0) slot.flash = Math.max(0, slot.flash - dt);
    if (slot.bubblePop > 0) slot.bubblePop = Math.max(0, slot.bubblePop - dt * 3.5);

    const bt = slot.id ? cardBubbleText(slot.id, slot) : '';
    if (slot.id && slot.prevBubble !== undefined && slot.prevBubble !== bt) slot.bubblePop = 1;
    slot.prevBubble = bt;

    if (slot.phase === 'return') {
      slot.t += dt;
      if (slot.t >= CARD_RETURN_TIME) {
        slot.id = null;
        slot.phase = 'empty';
        slot.t = 0;
        slot.prevBubble = '';
      }
      continue;
    }

    if (slot.phase === 'switch' || slot.phase === 'delete') {
      slot.t += dt;
      if (slot.t >= CARD_SLIDE_TIME) {
        if (slot.targetId) {
          slot.id = slot.targetId;
          slot.targetId = null;
          slot.phase = 'load';
          slot.t = 0;
          slot.group = CARD_GROUPS[slot.id] || 1;
          slot.maxGroup = slot.group;
          slot.dur = Math.max(CARD_LOAD_TIME, cardSkillRemaining(slot.id));
        } else {
          slot.id = null;
          slot.phase = 'empty';
          slot.t = 0;
          slot.prevBubble = '';
        }
      }
    } else if (slot.phase === 'load' || slot.phase === 'cooldown') {
      slot.t += dt;
      if (slot.t >= slot.dur) {
        slot.t = slot.dur;
        slot.phase = 'ready';
        autoCastSlot(slot);
      }
    } else if (slot.phase === 'ready') {
      slot.retry -= dt;
      if (slot.retry <= 0) autoCastSlot(slot);
    }
  }
}

function drawSkillBubble(x, y, text, color, alpha, center, scale, small) {
  if (!text) return;
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha *= alpha;
  ctx.translate(x, y);
  if (scale !== undefined && scale !== 1) ctx.scale(scale, scale);
  ctx.font = `800 ${small ? 6 : 7}px -apple-system, "PingFang SC", sans-serif`;
  const w = Math.max(small ? 9 : 15, ctx.measureText(text).width + (small ? 5 : 8)), h = small ? 8 : 11;
  const bx = center ? -w / 2 : -w, by = 0;
  ctx.fillStyle = 'rgba(7,12,20,.9)';
  ctx.strokeStyle = color || 'rgba(126,249,208,.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, w, h, small ? 4 : 5); else ctx.rect(bx, by, w, h);
  ctx.fill(); ctx.stroke();
  // tail
  const tx = center ? bx + w / 2 - (small ? 2 : 4) : bx + 4;
  ctx.beginPath(); ctx.moveTo(tx, by + h); ctx.lineTo(tx + (small ? 2 : 4), by + h + (small ? 2 : 3)); ctx.lineTo(tx + (small ? 4 : 8), by + h); ctx.fillStyle = 'rgba(7,12,20,.9)'; ctx.fill();
  ctx.fillStyle = '#d8fff4';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, bx + w / 2, by + h / 2 + 0.5);
  ctx.restore();
}

function drawCardSkillIcon(id, cx, cy, s, color) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  switch (id) {
    case 'echo':
      ctx.arc(-s * 0.22, 0, s * 0.55, -Math.PI * 0.7, Math.PI * 0.7);
      ctx.moveTo(-s * 0.15, -s * 0.32); ctx.lineTo(-s * 0.15, s * 0.32);
      break;
    case 'detonate':
      ctx.moveTo(0, -s * 0.6); ctx.lineTo(0, -s * 0.18);
      ctx.moveTo(0, s * 0.18); ctx.lineTo(0, s * 0.6);
      ctx.moveTo(-s * 0.6, 0); ctx.lineTo(-s * 0.18, 0);
      ctx.moveTo(s * 0.18, 0); ctx.lineTo(s * 0.6, 0);
      ctx.moveTo(-s * 0.35, -s * 0.35); ctx.lineTo(-s * 0.12, -s * 0.12);
      ctx.moveTo(s * 0.35, -s * 0.35); ctx.lineTo(s * 0.12, -s * 0.12);
      ctx.moveTo(-s * 0.35, s * 0.35); ctx.lineTo(-s * 0.12, s * 0.12);
      ctx.moveTo(s * 0.35, s * 0.35); ctx.lineTo(s * 0.12, s * 0.12);
      break;
    case 'bomb':
      ctx.arc(0, s * 0.12, s * 0.48, 0, Math.PI * 2);
      ctx.moveTo(s * 0.18, -s * 0.3); ctx.quadraticCurveTo(s * 0.5, -s * 0.55, s * 0.22, -s * 0.7);
      break;
    case 'sniper':
      ctx.arc(0, 0, s * 0.42, 0, Math.PI * 2);
      ctx.moveTo(-s * 0.7, 0); ctx.lineTo(-s * 0.2, 0);
      ctx.moveTo(s * 0.2, 0); ctx.lineTo(s * 0.7, 0);
      ctx.moveTo(0, -s * 0.7); ctx.lineTo(0, -s * 0.2);
      ctx.moveTo(0, s * 0.2); ctx.lineTo(0, s * 0.7);
      break;
    case 'melee':
      ctx.moveTo(-s * 0.55, s * 0.45);
      ctx.quadraticCurveTo(s * 0.1, s * 0.2, s * 0.55, -s * 0.5);
      ctx.quadraticCurveTo(s * 0.1, -s * 0.18, -s * 0.35, s * 0.25);
      ctx.closePath();
      ctx.moveTo(-s * 0.55, s * 0.45); ctx.lineTo(-s * 0.7, s * 0.6);
      break;
    case 'pet':
      ctx.arc(0, s * 0.2, s * 0.42, Math.PI, 0);
      for (const px of [-0.34, 0, 0.34]) {
        ctx.moveTo(s * px, -s * 0.05); ctx.arc(s * px, -s * 0.18, s * 0.14, 0, Math.PI * 2);
      }
      break;
    case 'burrow':
      ctx.moveTo(-s * 0.6, s * 0.05); ctx.quadraticCurveTo(0, -s * 0.55, s * 0.6, s * 0.05);
      ctx.moveTo(0, -s * 0.55); ctx.lineTo(0, -s * 0.85);
      ctx.moveTo(-s * 0.18, -s * 0.68); ctx.lineTo(0, -s * 0.85); ctx.lineTo(s * 0.18, -s * 0.68);
      break;
    case 'focus':
      ctx.ellipse(0, 0, s * 0.62, s * 0.38, 0, 0, Math.PI * 2);
      ctx.moveTo(0, -s * 0.22); ctx.lineTo(0, s * 0.22);
      break;
    case 'vision':
      ctx.moveTo(-s * 0.6, -s * 0.25); ctx.lineTo(-s * 0.15, s * 0.15); ctx.lineTo(-s * 0.6, s * 0.3);
      ctx.moveTo(-s * 0.45, s * 0.25); ctx.lineTo(s * 0.55, s * 0.25);
      ctx.moveTo(s * 0.2, s * 0.25); ctx.lineTo(s * 0.35, -s * 0.1);
      break;
    case 'second':
      ctx.moveTo(0, -s * 0.65); ctx.lineTo(s * 0.55, -s * 0.35);
      ctx.lineTo(s * 0.45, s * 0.3); ctx.quadraticCurveTo(0, s * 0.65, -s * 0.45, s * 0.3);
      ctx.lineTo(-s * 0.55, -s * 0.35); ctx.closePath();
      break;
    case 'life':
      ctx.moveTo(0, s * 0.55);
      ctx.bezierCurveTo(-s * 1.0, -s * 0.2, -s * 0.5, -s * 0.9, 0, -s * 0.3);
      ctx.bezierCurveTo(s * 0.5, -s * 0.9, s * 1.0, -s * 0.2, 0, s * 0.55);
      ctx.moveTo(-s * 0.22, s * 0.02); ctx.lineTo(s * 0.22, s * 0.02);
      ctx.moveTo(0, -s * 0.2); ctx.lineTo(0, s * 0.24);
      break;
  }
  ctx.stroke();
  ctx.restore();
}

function drawCardFace(id, x, y, w, h, alpha, showState, slot, scale) {
  ctx.save();
  ctx.globalAlpha *= alpha;
  if (scale !== undefined && scale !== 1) {
    const cx = x + w / 2, cy = y + h / 2;
    ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
  }
  const bright = 'rgba(126,249,208,.30)';
  ctx.fillStyle = 'rgba(9,15,24,.94)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 7); else ctx.rect(x, y, w, h);
  ctx.fill();
  ctx.strokeStyle = 'rgba(126,249,208,.42)'; ctx.lineWidth = 1.5; ctx.stroke();

  // clip for animations
  ctx.save();
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x + 2, y + 2, w - 4, h - 4, 6); else ctx.rect(x + 2, y + 2, w - 4, h - 4);
  ctx.clip();

  let p = 0, phase = 'ready';
  if (showState && slot) {
    if (slot.phase === 'load') p = Math.min(1, slot.t / Math.max(0.01, slot.dur));
    else if (slot.phase === 'cooldown') p = Math.min(1, slot.t / Math.max(0.01, slot.dur));
    phase = slot.phase;
  }

  if (showState && slot && (phase === 'load' || phase === 'cooldown')) {
    // 角形加载：以卡片中心为顶点；亮色扇面只增不减，另外叠加 2.5 圈旋转光痕
    const cx = x + w / 2, cy = y + h / 2;
    const radius = Math.hypot(w, h) * 0.72;
    const start = -Math.PI / 2;
    const sweep = p * Math.PI * 2;
    const shine = -Math.PI / 2 + p * Math.PI * 5 + S.gameTime * 0.35;
    ctx.fillStyle = bright;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, start + sweep);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(190,255,238,.65)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(start) * radius, cy + Math.sin(start) * radius);
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(start + sweep) * radius, cy + Math.sin(start + sweep) * radius);
    ctx.stroke();
    // 2.5 圈旋转光痕（只作为速度感，不改变亮色面积）
    ctx.globalAlpha *= 0.45;
    ctx.strokeStyle = 'rgba(235,255,250,.9)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(shine) * radius, cy + Math.sin(shine) * radius);
    ctx.stroke();
    ctx.fillStyle = 'rgba(235,255,250,.9)';
    ctx.beginPath(); ctx.arc(cx + Math.cos(shine) * radius, cy + Math.sin(shine) * radius, 1.8, 0, 7); ctx.fill();
    // 不耐烦：接近完成轻微抖动 + 脉冲
    if (p > 0.82) ctx.translate(Math.sin(S.gameTime * 38) * 1.3 * (p - 0.82), 0);
  } else if (showState && slot && phase === 'ready') {
    ctx.fillStyle = bright;
    ctx.fillRect(x, y, w, h);
  }

  // 耐久线：线下亮、线上暗；p=剩余/总
  if (showState && slot && (phase === 'ready' || phase === 'cooldown')) {
    const d = cardDurability(id, slot);
    const lineY = y + h * (1 - Math.max(0, Math.min(1, d.p)));
    ctx.fillStyle = 'rgba(6,10,16,.82)';
    ctx.fillRect(x, y, w, Math.max(0, lineY - y));
    ctx.strokeStyle = 'rgba(200,255,240,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 4, lineY); ctx.lineTo(x + w - 4, lineY); ctx.stroke();
  }
  ctx.restore();

  // 44px 方卡：图标 + 英文简写
  drawCardSkillIcon(id, x + w / 2, y + h * 0.38, Math.min(w, h) * 0.30, 'rgba(220,255,245,.85)');
  ctx.fillStyle = 'rgba(200,240,255,.78)';
  ctx.font = '800 6px Consolas, "Courier New", monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(CARD_ABBR[id] || String(id).toUpperCase(), x + w / 2, y + h - 3);

  if (showState && slot && phase === 'ready') {
    ctx.strokeStyle = 'rgba(126,249,208,.9)'; ctx.lineWidth = 2;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x + 1, y + 1, w - 2, h - 2, 5); else ctx.rect(x + 1, y + 1, w - 2, h - 2);
    ctx.stroke();
  }
  ctx.restore();
}

const CARD_W = 44, CARD_H = 44, CARD_GAP = 16;
const HUD_ICON_GAP = 52;
function getCardLayout() {
  const n = CARD_SKILLS.length;
  if (!MOBILE || !S.cardMode) {
    const r = 17, gap = HUD_ICON_GAP, cy = H - 186;
    const icons = [];
    for (let i = 0; i < n; i++) icons.push({ i, x: W / 2 - (n - 1) * gap / 2 + i * gap, y: cy });
    const cardsW = CARD_SLOT_COUNT * CARD_W + (CARD_SLOT_COUNT - 1) * CARD_GAP;
    const cardsX = W / 2 - cardsW / 2, cardY = H - 156;
    const cards = [];
    for (let i = 0; i < CARD_SLOT_COUNT; i++) cards.push({ i, x: cardsX + i * (CARD_W + CARD_GAP), y: cardY });
    return {
      mobile: false, r, icons, cards,
      cardBlock: { left: cardsX, right: cardsX + cardsW, centerY: cardY + CARD_H / 2 },
      leftJoyRight: 0, rightJoyLeft: W
    };
  }

  // 手机：夹在左右手柄之间，整体下移到手柄中心
  const iconCell = 44, iconRowH = 46;
  const cardGap = 8, cardRowH = 62;
  const leftJoyRight = 12 + 150 + 10;
  const rightJoyLeft = W - leftJoyRight;
  const availW = Math.max(160, rightJoyLeft - leftJoyRight);
  const maxIcons = Math.max(1, Math.floor(availW / iconCell));
  const iconRows = Math.ceil(n / maxIcons);
  const perIcon = Math.ceil(n / iconRows);
  const maxCards = Math.max(1, Math.floor(availW / (CARD_W + cardGap)));
  const cardRows = Math.ceil(CARD_SLOT_COUNT / maxCards);
  const perCard = Math.ceil(CARD_SLOT_COUNT / cardRows);
  const groupGap = 6;
  const groupH = iconRows * iconRowH + groupGap + cardRows * cardRowH;
  const joyCenterY = H - 14 - 75;
  let top = Math.min(joyCenterY - groupH / 2, H - 8 - groupH);
  top = Math.max(0, top);

  const icons = [];
  for (let row = 0; row < iconRows; row++) {
    const start = row * perIcon;
    const count = Math.min(perIcon, n - start);
    if (count <= 0) continue;
    const rowW = (count - 1) * iconCell;
    for (let j = 0; j < count; j++) {
      icons.push({ i: start + j, x: W / 2 - rowW / 2 + j * iconCell, y: top + row * iconRowH + 17 });
    }
  }

  const cardsTop = top + iconRows * iconRowH + groupGap;
  const cards = [];
  for (let row = 0; row < cardRows; row++) {
    const start = row * perCard;
    const count = Math.min(perCard, CARD_SLOT_COUNT - start);
    if (count <= 0) continue;
    const rowW = count * CARD_W + (count - 1) * cardGap;
    for (let j = 0; j < count; j++) {
      cards.push({ i: start + j, x: W / 2 - rowW / 2 + j * (CARD_W + cardGap), y: cardsTop + row * cardRowH });
    }
  }

  const blockLeft = Math.min(...cards.map(c => c.x));
  const blockRight = Math.max(...cards.map(c => c.x + CARD_W));
  return {
    mobile: true, r: 17, icons, cards, iconRows, cardRows, groupH, top,
    leftJoyRight, rightJoyLeft, availW,
    cardBlock: { left: blockLeft, right: blockRight, centerY: cardsTop + (cardRows - 1) * cardRowH / 2 + CARD_H / 2 }
  };
}

function tryCardSkillTap(x, y) {
  if (!MOBILE || !S.cardMode || !S.running || S.over || S.paused) return false;
  const L = getCardLayout();
  for (const p of L.icons) {
    if (Math.hypot(x - p.x, y - p.y) <= 24) {
      quickUseSkill(CARD_SKILLS[p.i]);
      return true;
    }
  }
  return false;
}
function drawCardSlots() {
  if (!S.cardMode || !S.cards.length || S.skillHudAlpha < 0.01) return;
  const L = getCardLayout();
  ctx.save();
  ctx.globalAlpha = S.skillHudAlpha;

  for (const cp of L.cards) {
    const i = cp.i;
    const slot = S.cards[i];
    const x = cp.x;
    const bob = (slot.phase === 'switch' || slot.phase === 'delete' || slot.phase === 'return') ? 0 : Math.sin(S.gameTime * 2.4 + i * 0.9) * 1;
    const y = cp.y + bob;

    if (slot.phase === 'empty') {
      ctx.strokeStyle = 'rgba(130,170,220,.20)'; ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, CARD_W, CARD_H, 5); else ctx.rect(x, y, CARD_W, CARD_H);
      ctx.stroke(); ctx.setLineDash([]);
      continue;
    }

    if (slot.phase === 'return') {
      const p = Math.min(1, slot.t / CARD_RETURN_TIME);
      const e = 1 - Math.pow(1 - p, 2);
      const targetX = slot.returnX !== undefined ? slot.returnX : x;
      const targetY = slot.returnY !== undefined ? slot.returnY : y;
      const tx = x + (targetX - x) * e;
      const ty = y + (targetY - y) * e;
      ctx.save();
      ctx.globalAlpha = 1 - e;
      drawCardFace(slot.id, tx, ty, CARD_W, CARD_H, 1, false, null, 1 - e * 0.45);
      ctx.restore();
      continue;
    }

    if (slot.phase === 'switch' || slot.phase === 'delete') {
      const p = Math.min(1, slot.t / CARD_SLIDE_TIME);
      const e = 1 - Math.pow(1 - p, 3);
      ctx.save();
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, CARD_W, CARD_H, 5); else ctx.rect(x, y, CARD_W, CARD_H);
      ctx.clip();
      if (slot.id) {
        const oy = slot.oldStartY + (CARD_H - slot.oldStartY) * e;
        drawCardFace(slot.id, x, y + oy, CARD_W, CARD_H, 1 - e * 0.45, false, null, 1 - e * 0.12);
      }
      if (slot.phase === 'switch' && slot.targetId) {
        const ny = -CARD_H + CARD_H * e;
        drawCardFace(slot.targetId, x, y + ny, CARD_W, CARD_H, 0.45 + e * 0.55, false, null, 0.88 + e * 0.12);
      }
      ctx.restore();
    } else {
      const f = slot.flash || 0;
      const pulse = slot.phase === 'load' ? 1 + 0.018 * Math.sin(S.gameTime * 12) : 1;
      drawCardFace(slot.id, x, y, CARD_W, CARD_H, 1, true, slot, (1 + f * 0.07) * pulse);
      const bt = cardBubbleText(slot.id, slot);
      if (bt) drawSkillBubble(x + CARD_W / 2, y + CARD_H + 2, bt, 'rgba(126,249,208,.5)', 1, true, 1 + (slot.bubblePop || 0) * 0.25);
    }
  }
  if (MOBILE) drawCardSideStatus(L);
  ctx.restore();
}

function drawCardSideStatus(L) {
  const left = [], right = [];
  if (S.sniperMode) left.push({ text: `SNIPE ${S.sniperMag}`, color: '232,244,255' });
  if (S.focusActive) left.push({ text: 'FOCUS', color: '126,249,208' });
  if (S.secondChance) left.push({ text: 'SECOND', color: '0,255,204' });
  if (S.visionTimer > 0) right.push({ text: `VISION ${Math.ceil(S.visionTimer)}`, color: '192,132,252' });
  if (S.burrowTimer > 0) right.push({ text: `BURROW ${S.burrowTimer.toFixed(1)}`, color: '126,249,208' });
  if (S.pets.length > 0) right.push({ text: `PET ${S.pets.length}`, color: '255,209,92' });
  const cy = L.cardBlock.centerY;
  const leftSpace = L.cardBlock.left - 10 - L.leftJoyRight;
  const rightSpace = L.rightJoyLeft - (L.cardBlock.right + 10);
  if (leftSpace >= 56) drawCardStatusChips(left, L.cardBlock.left - 10, cy, true);
  if (rightSpace >= 56) drawCardStatusChips(right, L.cardBlock.right + 10, cy, false);
}

function drawCardStatusChips(list, edgeX, cy, alignRight) {
  if (!list.length) return;
  const h = 12, gap = 3;
  const total = list.length * h + (list.length - 1) * gap;
  let y = cy - total / 2;
  ctx.save();
  ctx.font = '800 6px Consolas, "Courier New", monospace';
  ctx.textBaseline = 'middle';
  for (const c of list) {
    const w = Math.max(30, ctx.measureText(c.text).width + 12);
    const x = alignRight ? edgeX - w : edgeX;
    ctx.fillStyle = 'rgba(7,12,20,.82)';
    ctx.strokeStyle = `rgba(${c.color},.5)`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, 4); else ctx.rect(x, y, w, h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(${c.color},.95)`;
    ctx.beginPath(); ctx.arc(x + 6, y + h / 2, 2, 0, 7); ctx.fill();
    ctx.fillStyle = `rgba(${c.color},.9)`;
    ctx.textAlign = 'left';
    ctx.fillText(c.text, x + 11, y + h / 2 + 0.5);
    y += h + gap;
  }
  ctx.restore();
}

function updateBuffsUI(force) {
  const f = S.buffs.fireRate, s = S.buffs.spread, v = S.visionTimer;
  const key = `${f > 0 ? '1' : '0'}|${s > 0 ? '1' : '0'}|${v > 0 ? '1' : '0'}`;
  if (!force && key === S._buffUIKey) {
    const fireFill = buffsEl.querySelector('.buff.fireRate .fill');
    const spreadFill = buffsEl.querySelector('.buff.spread .fill');
    const visionFill = buffsEl.querySelector('.buff.vision .fill');
    if (fireFill) fireFill.style.width = (f / BUFF_DURATION.fireRate * 100) + '%';
    if (spreadFill) spreadFill.style.width = (s / BUFF_DURATION.spread * 100) + '%';
    if (visionFill) visionFill.style.width = Math.min(100, v / VISION_DURATION * 100) + '%';
    const visionSec = buffsEl.querySelector('.buff.vision .sec');
    if (visionSec) visionSec.textContent = v.toFixed(1);
    return;
  }
  S._buffUIKey = key;
  let html = '';
  if (f > 0) html += `<div class="buff fireRate">⚡ 射速提升 <div class="bar"><div class="fill" style="width:${f / BUFF_DURATION.fireRate * 100}%"></div></div>${f.toFixed(1)}s</div>`;
  if (s > 0) html += `<div class="buff spread">🔱 三向散射 <div class="bar"><div class="fill" style="width:${s / BUFF_DURATION.spread * 100}%"></div></div>${s.toFixed(1)}s</div>`;
  if (v > 0) html += `<div class="buff vision">👁 广域视野 <div class="bar"><div class="fill" style="width:${Math.min(100, v / VISION_DURATION * 100)}%"></div></div><span class="sec">${v.toFixed(1)}</span>s</div>`;
  buffsEl.innerHTML = html;
}

// ============================================================
//  地图系统（读取 <script id="mapFile"> 里的地图文件）
// ============================================================
let MAP_FILE = null;
try {
  MAP_FILE = JSON.parse(document.getElementById('mapFile').textContent);
} catch (e) { MAP_FILE = null; }

function seededRng(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s ^= s << 13; s >>>= 0;
    s ^= s >> 17;
    s ^= s << 5; s >>>= 0;
    return s / 4294967296;
  };
}

function rectsOverlap(a, b, pad) {
  pad = pad || 0;
  return a.x - pad < b.x + b.w && a.x + a.w + pad > b.x &&
         a.y - pad < b.y + b.h && a.y + a.h + pad > b.y;
}

function buildWaveMap(wave) {
  if (!MAP_FILE || !MAP_FILE.layouts || !MAP_FILE.layouts.length) return null;
  if (wave > PRESET_WAVES) return buildProceduralMap(wave);
  const layouts = MAP_FILE.layouts.slice(0, PRESET_WAVES);
  const def = layouts[(wave - 1) % layouts.length];
  const cycle = Math.floor((wave - 1) / layouts.length);
  // 大地图：至少比当前视口大 2.4 倍，迫使玩家探索整张地图
  const fit = Math.max(1, (W * 2.4) / def.w, (H * 2.4) / def.h);
  const w = Math.round(def.w * fit), h = Math.round(def.h * fit);
  const walls = [];

  const pushWall = (x, y, ww, hh) => {
    if (ww < 10 || hh < 10) return;
    const r = { x: Math.round(x), y: Math.round(y), w: Math.round(ww), h: Math.round(hh) };
    if (!walls.some(o => rectsOverlap(o, r))) walls.push(r);
  };

  for (const r of (def.walls || [])) {
    const x = r.x * w, y = r.y * h, ww = r.w * w, hh = r.h * h;
    pushWall(x, y, ww, hh);
    if (r.mirror === 'x' || r.mirror === 'both') pushWall(w - x - ww, y, ww, hh);
    if (r.mirror === 'y' || r.mirror === 'both') pushWall(x, h - y - hh, ww, hh);
    if (r.mirror === 'both') pushWall(w - x - ww, h - y - hh, ww, hh);
  }

  const spawn = {
    x: (def.spawn ? def.spawn.x : 0.5) * w,
    y: (def.spawn ? def.spawn.y : 0.5) * h,
  };

  // 出生点周围保持空阔，避免开局卡墙
  for (let i = walls.length - 1; i >= 0; i--) {
    const wl = walls[i];
    const nx = Math.max(wl.x, Math.min(spawn.x, wl.x + wl.w));
    const ny = Math.max(wl.y, Math.min(spawn.y, wl.y + wl.h));
    if (Math.hypot(spawn.x - nx, spawn.y - ny) < 210 * fit) walls.splice(i, 1);
  }

  // 波次碎石柱：同一布局在不同 wave 也有差异
  const extra = (def.extraPillars || 0) + Math.min(8, cycle * 2);
  const rng = seededRng(wave * 7919 + 17);
  for (let i = 0; i < extra; i++) {
    for (let tries = 0; tries < 40; tries++) {
      const size = Math.round((70 + rng() * 90) * fit);
      const spanX = Math.max(0, w - 480 * fit - size), spanY = Math.max(0, h - 480 * fit - size);
      const x = Math.round(240 * fit + rng() * spanX), y = Math.round(240 * fit + rng() * spanY);
      const rect = { x, y, w: size, h: size };
      if (Math.hypot(x + size / 2 - spawn.x, y + size / 2 - spawn.y) < 300 * fit) continue;
      if (walls.some(wl => rectsOverlap(wl, rect, 90 * fit))) continue;
      walls.push(rect); break;
    }
  }

  const map = {
    id: def.id + '-' + cycle,
    name: def.name,
    index: (wave - 1) % layouts.length,
    cycle, wave, scale: fit,
    w, h, walls, spawn,
    theme: def.theme || {},
    mm: null,
  };
  buildMapMinimap(map);
  return map;
}

function buildProceduralMap(wave) {
  // 第 6 关起：地图宽高每关 +320；墙体面积/最小尺寸/连通块按 5 关循环
  const baseW = Math.round(Math.max(W * 2.4, 3200));
  const baseH = Math.round(Math.max(H * 2.4, 2200));
  const bonus = (wave - 6) * MAP_GROWTH;
  const w = baseW + bonus, h = baseH + bonus;
  const idx = ((wave - 6) % 5 + 5) % 5;
  const areaPct = PROC_AREA_PCT[idx];
  const minSize = PROC_MIN_SIZE[idx];
  const clusterCount = PROC_CLUSTERS[idx];
  const rng = seededRng(wave * 104729 + 911);
  const spawn = { x: w / 2, y: h / 2 };
  const walls = [];
  const targetArea = w * h * areaPct;
  const per = targetArea / clusterCount;
  const maxSize = Math.min(w - PROC_MARGIN * 2, h - PROC_MARGIN * 2);

  const clearOfSpawn = (r) => {
    const nx = Math.max(r.x, Math.min(spawn.x, r.x + r.w));
    const ny = Math.max(r.y, Math.min(spawn.y, r.y + r.h));
    return Math.hypot(spawn.x - nx, spawn.y - ny) >= PROC_SPAWN_CLEAR;
  };
  const free = (r) => walls.every(o => !rectsOverlap(o, r, PROC_WALL_GAP));
  const tryPlace = (r) => {
    if (r.w < minSize || r.h < minSize) return false;
    if (!clearOfSpawn(r)) return false;
    if (!free(r)) return false;
    walls.push(r);
    return true;
  };

  for (let i = 0; i < clusterCount; i++) {
    let placed = false;
    for (let attempt = 0; attempt < 500 && !placed; attempt++) {
      const shrink = Math.pow(0.94, Math.floor(attempt / 40));
      const area = per * shrink;
      const aspect = 0.55 + rng() * 1.0;
      let ww = Math.sqrt(area * aspect);
      let hh = area / Math.max(1, ww);
      ww = Math.max(minSize, Math.min(maxSize, ww));
      hh = Math.max(minSize, Math.min(maxSize, hh));
      const x = PROC_MARGIN + rng() * Math.max(1, w - PROC_MARGIN * 2 - ww);
      const y = PROC_MARGIN + rng() * Math.max(1, h - PROC_MARGIN * 2 - hh);
      placed = tryPlace({ x: Math.round(x), y: Math.round(y), w: Math.round(ww), h: Math.round(hh) });
    }
    // 随机失败时，用最小尺寸在整个地图网格上兜底
    if (!placed) {
      const step = minSize + PROC_WALL_GAP;
      for (let gy = PROC_MARGIN; gy <= h - PROC_MARGIN - minSize && !placed; gy += step) {
        for (let gx = PROC_MARGIN; gx <= w - PROC_MARGIN - minSize && !placed; gx += step) {
          placed = tryPlace({ x: gx, y: gy, w: minSize, h: minSize });
        }
      }
    }
  }

  const map = {
    id: 'proc-' + wave,
    name: '裂隙回廊 ' + wave + ' · ' + Math.round(areaPct * 100) + '%',
    index: idx,
    cycle: Math.floor((wave - 6) / 5),
    wave, scale: 1,
    w, h, walls, spawn,
    theme: { floor: '#0a0c12', grid: 'rgba(95,184,255,.045)', wall: '#202737', edge: 'rgba(232,244,255,.16)' },
    mm: null,
  };
  buildMapMinimap(map);
  return map;
}

function buildMapMinimap(map) {
  const s = Math.max(0.22, Math.min(MINIMAP_MM_SCALE, 1600 / map.w));
  const c = document.createElement('canvas');
  c.width = Math.max(2, Math.round(map.w * s));
  c.height = Math.max(2, Math.round(map.h * s));
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  g.save(); g.scale(s, s); g.fillStyle = '#fff';
  for (const wl of map.walls) g.fillRect(wl.x, wl.y, wl.w, wl.h);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 2;
  g.strokeRect(1, 1, c.width - 2, c.height - 2);
  map.mm = c;
}

function pointInWalls(x, y, pad) {
  const map = S.map; if (!map) return false;
  pad = pad || 0;
  for (const wl of map.walls) {
    if (x >= wl.x - pad && x <= wl.x + wl.w + pad &&
        y >= wl.y - pad && y <= wl.y + wl.h + pad) return true;
  }
  return false;
}

function hitsWall(x, y, r) {
  const map = S.map; if (!map) return false;
  for (const wl of map.walls) {
    const nx = Math.max(wl.x, Math.min(x, wl.x + wl.w));
    const ny = Math.max(wl.y, Math.min(y, wl.y + wl.h));
    const dx = x - nx, dy = y - ny;
    if (dx * dx + dy * dy < r * r) return true;
  }
  return false;
}

// 线段与矩形（按 r 外扩）的最早交点参数 t（0~1），未相交返回 -1
function segRectT(x0, y0, x1, y1, rect, r) {
  const dx = x1 - x0, dy = y1 - y0;
  let t0 = 0, t1 = 1;
  const minX = rect.x - r, maxX = rect.x + rect.w + r;
  const minY = rect.y - r, maxY = rect.y + rect.h + r;
  if (Math.abs(dx) < 1e-9) {
    if (x0 < minX || x0 > maxX) return -1;
  } else {
    let a = (minX - x0) / dx, b = (maxX - x0) / dx;
    if (a > b) { const tmp = a; a = b; b = tmp; }
    if (a > t0) t0 = a;
    if (b < t1) t1 = b;
    if (t0 > t1) return -1;
  }
  if (Math.abs(dy) < 1e-9) {
    if (y0 < minY || y0 > maxY) return -1;
  } else {
    let a = (minY - y0) / dy, b = (maxY - y0) / dy;
    if (a > b) { const tmp = a; a = b; b = tmp; }
    if (a > t0) t0 = a;
    if (b < t1) t1 = b;
    if (t0 > t1) return -1;
  }
  if (t1 < 0 || t0 > 1) return -1;
  return t0;
}

// 线段与圆的最早交点参数 t，未相交返回 -1
function segCircleT(x0, y0, x1, y1, cx, cy, r) {
  const dx = x1 - x0, dy = y1 - y0;
  const fx = x0 - cx, fy = y0 - cy;
  const c = fx * fx + fy * fy - r * r;
  if (c <= 0) return 0;
  const a = dx * dx + dy * dy;
  if (a < 1e-9) return -1;
  const b = 2 * (fx * dx + fy * dy);
  let disc = b * b - 4 * a * c;
  if (disc < 0) return -1;
  disc = Math.sqrt(disc);
  const t1 = (-b - disc) / (2 * a), t2 = (-b + disc) / (2 * a);
  if (t1 >= 0 && t1 <= 1) return t1;
  if (t2 >= 0 && t2 <= 1) return t2;
  return -1;
}

function resolveCircleWalls(ent) {
  const map = S.map; if (!map) return;
  for (let pass = 0; pass < 2; pass++) {
    for (const wl of map.walls) {
      const nx = Math.max(wl.x, Math.min(ent.x, wl.x + wl.w));
      const ny = Math.max(wl.y, Math.min(ent.y, wl.y + wl.h));
      let dx = ent.x - nx, dy = ent.y - ny;
      const d2 = dx * dx + dy * dy;
      if (d2 > ent.r * ent.r) continue;
      if (d2 < 0.0001) {
        const left = ent.x - wl.x, right = wl.x + wl.w - ent.x;
        const top = ent.y - wl.y, bottom = wl.y + wl.h - ent.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) ent.x = wl.x - ent.r;
        else if (m === right) ent.x = wl.x + wl.w + ent.r;
        else if (m === top) ent.y = wl.y - ent.r;
        else ent.y = wl.y + wl.h + ent.r;
      } else {
        const d = Math.sqrt(d2), push = ent.r - d;
        ent.x += dx / d * push; ent.y += dy / d * push;
      }
    }
  }
}

// 碰到墙时沿墙滑行，避免敌人永远卡在障碍物后面导致波次无法结束
function slideAlongWalls(ent, nx, ny, dt) {
  const map = S.map; if (!map) return;
  const probeX = ent.x + nx * (ent.r + 10), probeY = ent.y + ny * (ent.r + 10);
  if (!hitsWall(probeX, probeY, ent.r * 0.8)) return;
  if (!ent.slideSign) ent.slideSign = Math.random() < 0.5 ? -1 : 1;
  const sp = (ent.speed || 60) * 0.8;
  ent.x += -ny * ent.slideSign * sp * dt;
  ent.y += nx * ent.slideSign * sp * dt;
  ent.x = Math.max(ent.r, Math.min(map.w - ent.r, ent.x));
  ent.y = Math.max(ent.r, Math.min(map.h - ent.r, ent.y));
  resolveCircleWalls(ent);
}

function viewRect() {
  const z = S.cam.zoom || 1;
  const vw = W / z, vh = H / z;
  return { l: S.cam.x - vw / 2, r: S.cam.x + vw / 2, t: S.cam.y - vh / 2, b: S.cam.y + vh / 2, w: vw, h: vh };
}

// —— 方块：放置 / 质量碰撞 / 血量 ——
function rectsOverlapXY(ax, ay, aw, ah, bx, by, bw, bh) {
  return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
}

function circleRectOverlap(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(rx + rw, cx));
  const ny = Math.max(ry, Math.min(ry + rh, cy));
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < cr * cr;
}

function blockCanMove(block, bx, by) {
  const map = S.map; if (!map) return false;
  if (bx < 16 || by < 16 || bx + block.w > map.w - 16 || by + block.h > map.h - 16) return false;
  const pts = [[bx + 4, by + 4], [bx + block.w - 4, by + 4], [bx + 4, by + block.h - 4],
               [bx + block.w - 4, by + block.h - 4], [bx + block.w / 2, by + block.h / 2]];
  for (const q of pts) if (hitsWall(q[0], q[1], 2)) return false;
  for (const b of S.blocks) {
    if (b !== block && rectsOverlapXY(bx, by, block.w, block.h, b.x, b.y, b.w, b.h)) return false;
  }
  return true;
}

// 质量分数：方块重 10，玩家 2，堡垒 3，Boss 6；普通怪推不动
function resolveCircleBlocks(ent, canPush) {
  if (!S.blocks.length || !ent) return;
  const entMass = ent === S.player ? 2 : (ent.mass || 1);
  for (let pass = 0; pass < 2; pass++) {
    for (const bl of S.blocks) {
      const nx = Math.max(bl.x, Math.min(ent.x, bl.x + bl.w));
      const ny = Math.max(bl.y, Math.min(ent.y, bl.y + bl.h));
      let dx = ent.x - nx, dy = ent.y - ny;
      let d2 = dx * dx + dy * dy;
      if (d2 >= ent.r * ent.r) continue;
      let ox, oy, depth;
      if (d2 < 0.0001) {
        const left = ent.x - bl.x, right = bl.x + bl.w - ent.x;
        const top = ent.y - bl.y, bottom = bl.y + bl.h - ent.y;
        const m = Math.min(left, right, top, bottom);
        if (m === left) { ox = -1; oy = 0; depth = left + ent.r; }
        else if (m === right) { ox = 1; oy = 0; depth = right + ent.r; }
        else if (m === top) { ox = 0; oy = -1; depth = top + ent.r; }
        else { ox = 0; oy = 1; depth = bottom + ent.r; }
      } else {
        const d = Math.sqrt(d2);
        ox = dx / d; oy = dy / d; depth = ent.r - d;
      }
      if (depth <= 0) continue;

      let blockMove = 0;
      if (canPush) {
        const frac = entMass / (entMass + bl.mass);
        blockMove = depth * frac;
        const bx = bl.x - ox * blockMove;
        const by = bl.y - oy * blockMove;
        if (blockMove > 0.001 && blockCanMove(bl, bx, by)) {
          bl.x = bx; bl.y = by;
          if (ent !== S.player) {
            const tx = S.player.x - ent.x, ty = S.player.y - ent.y;
            const tl = Math.hypot(tx, ty) || 1;
            const head = Math.max(0, -(tx / tl * ox + ty / tl * oy));
            ent.pushSlow = 0.22;
            ent.pushSlowFactor = head > 0.55 ? 0.42 : 0.72;
          }
        } else {
          blockMove = 0;
        }
      }
      const rem = depth - blockMove;
      ent.x += ox * rem;
      ent.y += oy * rem;
    }
  }
}

function blockPlacementValid(x, y, size) {
  const map = S.map; if (!map) return false;
  if (x < 20 || y < 20 || x + size > map.w - 20 || y + size > map.h - 20) return false;
  const pts = [[x + 4, y + 4], [x + size - 4, y + 4], [x + 4, y + size - 4],
               [x + size - 4, y + size - 4], [x + size / 2, y + size / 2]];
  for (const q of pts) if (hitsWall(q[0], q[1], 2)) return false;
  const p = S.player;
  if (circleRectOverlap(p.x, p.y, p.r + 3, x, y, size, size)) return false;
  for (const b of S.blocks) if (rectsOverlapXY(x, y, size, size, b.x, b.y, b.w, b.h)) return false;
  return true;
}

function placeBlock() {
  if (!S.running || S.over || S.paused || !S.map) return;
  if (S.blockItems <= 0) return;
  const p = S.player;
  const size = BLOCK_SIZE;
  const dirx = Math.cos(p.angle), diry = Math.sin(p.angle);
  const dists = [p.r + 38, p.r + 54, p.r + 70, p.r + 86];
  for (const dist of dists) {
    const bx = p.x + dirx * dist - size / 2;
    const by = p.y + diry * dist - size / 2;
    if (!blockPlacementValid(bx, by, size)) continue;
    S.blocks.push({
      x: bx, y: by, w: size, h: size,
      hp: BLOCK_HP, maxHp: BLOCK_HP, mass: BLOCK_MASS, hitFlash: 0
    });
    S.blockItems--;
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 110;
      S.particles.push({ x: bx + size / 2, y: by + size / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .4, maxLife: .4, color: '155,231,255', size: 2 });
    }
    sfx(360, 0.12, 'square', 0.035);
    S.banner = { text: '方块已放置', life: 0.7 };
    updateBlockHUD();
    updateMobileHUD();
    return;
  }
  S.banner = { text: '前方空间不足', life: 0.7 };
  sfx(160, 0.08, 'square', 0.025);
}

function damageBlock(bl, dmg) {
  bl.hp -= dmg;
  bl.hitFlash = 0.14;
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2, sp = 20 + Math.random() * 70;
    S.particles.push({ x: bl.x + bl.w / 2, y: bl.y + bl.h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .25, maxLife: .25, color: '155,231,255', size: 1.5 });
  }
  if (bl.hp <= 0) {
    const idx = S.blocks.indexOf(bl);
    if (idx >= 0) {
      S.blocks.splice(idx, 1);
      for (let i = 0; i < 18; i++) {
        const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 180;
        S.particles.push({ x: bl.x + bl.w / 2, y: bl.y + bl.h / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: .5, maxLife: .5, color: '155,231,255', size: 2 + Math.random() * 3 });
      }
      S.shake = Math.max(S.shake, 5);
      sfx(180, 0.2, 'sawtooth', 0.04);
    }
  }
}

function updateBlocks(dt) {
  for (let i = S.blocks.length - 1; i >= 0; i--) {
    const b = S.blocks[i];
    if (b.hitFlash > 0) b.hitFlash -= dt;
  }
}

function drawBlocks() {
  if (!S.blocks.length) return;
  for (const b of S.blocks) {
    ctx.save();
    const flash = b.hitFlash > 0;
    ctx.fillStyle = flash ? 'rgba(200,245,255,.38)' : 'rgba(30,52,76,.88)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = flash ? '#ffffff' : 'rgba(155,231,255,.78)';
    ctx.lineWidth = 2;
    ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    ctx.strokeStyle = 'rgba(155,231,255,.22)'; ctx.lineWidth = 1;
    ctx.strokeRect(b.x + 7, b.y + 7, b.w - 14, b.h - 14);
    ctx.beginPath();
    ctx.moveTo(b.x + b.w / 2, b.y + 7); ctx.lineTo(b.x + b.w / 2, b.y + b.h - 7);
    ctx.moveTo(b.x + 7, b.y + b.h / 2); ctx.lineTo(b.x + b.w - 7, b.y + b.h / 2);
    ctx.stroke();
    const hpw = b.w - 8, hpr = Math.max(0, b.hp / b.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(b.x + 4, b.y - 8, hpw, 5);
    ctx.fillStyle = hpr > .45 ? '#9be7ff' : '#ff9d5c';
    ctx.fillRect(b.x + 4, b.y - 8, hpw * hpr, 5);
    ctx.restore();
  }
}
function mouseWorld() {
  const z = S.cam.zoom || 1;
  return { x: S.cam.x + (S.mouse.x - W / 2) / z, y: S.cam.y + (S.mouse.y - H / 2) / z };
}

function updateCamera(dt, snap) {
  if (!S.map || !S.player) return;
  const targetZoom = S.visionTimer > 0 ? VISION_ZOOM : 1;
  if (snap) S.cam.zoom = targetZoom;
  else S.cam.zoom += (targetZoom - S.cam.zoom) * Math.min(1, dt * 3.0);

  const vw = W / S.cam.zoom, vh = H / S.cam.zoom;
  const tx = S.map.w <= vw ? S.map.w / 2 : Math.max(vw / 2, Math.min(S.map.w - vw / 2, S.player.x));
  const ty = S.map.h <= vh ? S.map.h / 2 : Math.max(vh / 2, Math.min(S.map.h - vh / 2, S.player.y));

  // 玩家始终锁定屏幕中心；只有镜头撞到地图边界时才产生相对位移
  S.cam.x = tx;
  S.cam.y = ty;
}

function loadWaveMap(wave) {
  const map = buildWaveMap(wave);
  if (!map) return null;
  const p = S.player;

  // 换图时平移场上残留物，避免它们突然出现在墙里
  const dx = map.spawn.x - p.x, dy = map.spawn.y - p.y;
  for (const e of S.echoes) {
    e.x += dx; e.y += dy;
    for (const q of e.path) { q.x += dx; q.y += dy; }
  }
  for (const k of S.knives) {
    k.x += dx; k.y += dy; k.startX += dx; k.startY += dy;
    for (const q of k.trail) { q.x += dx; q.y += dy; }
  }
  for (const pu of S.powerups) { pu.x += dx; pu.y += dy; }
  for (const q of S.particles) { q.x += dx; q.y += dy; }
  for (const sw of S.shockwaves) { sw.x += dx; sw.y += dy; }
  for (const pet of S.pets) { pet.x += dx; pet.y += dy; }

  S.map = map;
  p.x = map.spawn.x; p.y = map.spawn.y;
  S.pvx = 0; S.pvy = 0;
  S.prevX = p.x; S.prevY = p.y;
  S.pBullets = []; S.eBullets = [];
  S.blocks = [];
  S.history = [];
  S.powerups = S.powerups.filter(pu => !pointInWalls(pu.x, pu.y, 10));
  S.echoes = S.echoes.filter(e => !pointInWalls(e.x, e.y, 0));
  S.pets = S.pets.filter(pet => !pointInWalls(pet.x, pet.y, 0));
  updateCamera(0, true);
  return map;
}

function updateMinimapLabel() {
  minimapModeEl.textContent = S.mini.global ? 'GLOBAL' : 'LOCAL';
  minimapModeEl.classList.toggle('global', !!S.mini.global);
  minimapWrap.classList.toggle('local', !S.mini.global);
  minimapHintEl.textContent = MOBILE ? '点按切换' : `按住 ${keyLabel(KEYBINDS.toggleMap)} 全局`;
}

// ============================================================
//  波次
// ============================================================
function nextWave() {
  S.wave++; S.waveTimer = 0; S.spawnCell = 0;
  const map = loadWaveMap(S.wave);
  const hasBoss = S.wave % BOSS_INTERVAL === 0;

  S.banner = {
    text: 'WAVE ' + S.wave + (map ? ' · ' + map.name : '') + (hasBoss ? ' · BOSS' : ''),
    life: hasBoss ? 2.0 : 1.5
  };
  S.goldenTimer = GOLDEN_DURATION;
  S.banner.text += ' · 金身 3s';
  sfx(520, 0.12, 'triangle', 0.04);

  if (S.wave > PRESET_WAVES && !S.cardMode) {
    S.cardMode = true;
    S.cards = makeCardSlots();
    S.skillHudHidden = false;
    S.skillHudAlpha = 1;
    S.deleteArmed = 0;
    if (MOBILE) {
      const ms = document.getElementById('mobileSkills');
      if (ms) ms.style.display = 'none';
      showSkillToast('残响卡槽已启用：点击技能图标装载');
    } else {
      showSkillToast('残响卡槽已启用：数字装载 / D+槽位删除 / H 隐藏');
    }
  } else if (S.wave <= PRESET_WAVES) {
    S.cardMode = false; S.cards = []; S.deleteArmed = 0;
    if (MOBILE) {
      const ms = document.getElementById('mobileSkills');
      if (ms) ms.style.display = '';
    }
  }

  const n = S.wave;
  const baseTotal = n <= PRESET_WAVES
    ? Math.round(14 + n * 6 + Math.max(0, n - 3) * 10)
    : 84 + (n - 6) * 20;
  const total = Math.min(MAX_ENEMIES - (hasBoss ? 1 : 0), baseTotal);
  const shooters = Math.round(total * 0.20);
  const splitters = Math.round(total * 0.15);
  const fortresses = n >= 5 ? Math.min(4, 1 + Math.floor((n - 5) / 3)) : 0;
  const hunters = n >= 2 ? Math.max(0, total - Math.round(total * 0.45) - shooters - splitters - fortresses) : 0;
  const trackers = Math.max(0, total - shooters - splitters - hunters - fortresses);

  const blindChance = n >= 4 ? Math.min(0.7, 0.35 + (n - 4) * 0.06) : 0;
  const types = [];
  for (let i = 0; i < trackers; i++) types.push('tracker');
  for (let i = 0; i < shooters; i++) types.push(Math.random() < blindChance ? 'blinder' : 'shooter');
  for (let i = 0; i < splitters; i++) types.push('splitter');
  for (let i = 0; i < hunters; i++) types.push('hunter');
  for (let i = 0; i < fortresses; i++) types.push('fortress');
  for (let i = types.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = types[i]; types[i] = types[j]; types[j] = tmp;
  }

  // wave 4 起八成怪直接围在玩家四周（内圈 + 外圈），其余散布地图
  const surroundRatio = n >= 4 ? 0.8 : 0.55;
  const surroundTotal = Math.round(types.length * surroundRatio);
  const v = viewRect();
  const innerCount = Math.round(surroundTotal * (n >= 4 ? 0.55 : 0.35));
  const innerMin = Math.max(340, Math.min(v.w, v.h) * 0.4);
  const innerMax = Math.max(innerMin + 160, Math.min(v.w, v.h) * 0.78);
  const outerMin = innerMax + 60;
  const outerMax = Math.max(outerMin + 200, Math.max(v.w, v.h) * 0.78);
  for (let i = 0; i < surroundTotal; i++) {
    const type = types.pop();
    if (!type) break;
    const ang = (i / Math.max(1, surroundTotal)) * Math.PI * 2 + (Math.random() - 0.5) * 0.2;
    const inner = i < innerCount;
    const pt = ringSpawnPoint(ang, inner ? innerMin : outerMin, inner ? innerMax : outerMax);
    if (!pt) { types.push(type); continue; }
    spawnEnemy(type, (i % 14) * 55 + Math.random() * 60, false, pt);
  }
  for (const type of types) {
    spawnEnemy(type, Math.random() * 900, true);
  }

  // 不再有单独的 Boss 波：Boss 与普通小怪同时出现在同一张地图
  if (hasBoss) {
    sfx(220, 0.3, 'sawtooth', 0.06);
    setTimeout(() => sfx(160, 0.35, 'sawtooth', 0.05), 150);
    spawnBoss();
  }
}

// 在 3x3 的地图分区里轮流选点，保证怪物铺满整张地图
function farSpawnPoint(minDist) {
  const map = S.map, p = S.player;
  if (!map || !p) return null;
  const cols = 3, rows = 3, total = cols * rows;
  const cw = map.w / cols, ch = map.h / rows;
  for (let attempt = 0; attempt < total; attempt++) {
    const cell = (S.spawnCell++) % total;
    const cx = (cell % cols) * cw, cy = Math.floor(cell / cols) * ch;
    for (let i = 0; i < 24; i++) {
      const x = cx + 90 + Math.random() * Math.max(1, cw - 180);
      const y = cy + 90 + Math.random() * Math.max(1, ch - 180);
      if (Math.hypot(x - p.x, y - p.y) < minDist) continue;
      if (hitsWall(x, y, 34)) continue;
      return { x, y };
    }
  }
  for (let i = 0; i < 60; i++) {
    const x = 100 + Math.random() * (map.w - 200);
    const y = 100 + Math.random() * (map.h - 200);
    if (Math.hypot(x - p.x, y - p.y) < minDist * 0.8) continue;
    if (!hitsWall(x, y, 34)) return { x, y };
  }
  return null;
}

// 围绕玩家一圈取点，用来制造包围感
function ringSpawnPoint(angle, minR, maxR) {
  const map = S.map, p = S.player;
  if (!map || !p) return null;
  for (let i = 0; i < 26; i++) {
    const ang = angle + (Math.random() - 0.5) * 0.16;
    const r = minR + Math.random() * (maxR - minR);
    const x = p.x + Math.cos(ang) * r;
    const y = p.y + Math.sin(ang) * r;
    if (x < 90 || x > map.w - 90 || y < 90 || y > map.h - 90) continue;
    if (hitsWall(x, y, 34)) continue;
    return { x, y };
  }
  return null;
}

function spawnBoss() {
  const bossNum = Math.floor(S.wave / BOSS_INTERVAL);
  const hp = 30 + bossNum * 20;
  const map = S.map;
  const pt = farSpawnPoint(560) || (map ? { x: map.w / 2, y: map.h / 2 } : { x: W / 2, y: -90 });
  const boss = {
    x: pt.x, y: pt.y, type: 'boss', r: 42, hp, maxHp: hp,
    speed: 32 + bossNum * 4, age: 0, hitFlash: 0,
    fireCd: 2.0, ringCd: 3.0, delay: 0.8, color: '#ff3b5c', isBoss: true, mass: 6
  };
  S.enemies.push(boss);
  S.bossRef = boss;
  S.bossBarAlpha = 0;
}

function spawnEnemy(type, delay = 0, far = false, at = null) {
  if (S.enemies.length >= MAX_ENEMIES) return;
  const map = S.map;
  const v = viewRect();
  const margin = 70;
  let x, y;
  const pt = at || (far ? farSpawnPoint(420) : null);
  if (pt) {
    x = pt.x; y = pt.y;
  } else {
    for (let tries = 0; tries < 30; tries++) {
      const side = Math.floor(Math.random() * 4);
      if (side === 0) { x = v.l + Math.random() * v.w; y = v.t - margin; }
      else if (side === 1) { x = v.r + margin; y = v.t + Math.random() * v.h; }
      else if (side === 2) { x = v.l + Math.random() * v.w; y = v.b + margin; }
      else { x = v.l - margin; y = v.t + Math.random() * v.h; }
      if (map) {
        x = Math.max(40, Math.min(map.w - 40, x));
        y = Math.max(40, Math.min(map.h - 40, y));
      }
      if (!hitsWall(x, y, 26)) break;
      if (tries === 29) { x = v.l + Math.random() * v.w; y = v.t - 120; }
    }
  }
  const waveScale = 1 + S.wave * 0.06;
  const base = { x, y, type, delay: delay / 1000, age: 0, fireCd: 1.5 + Math.random() * 1.5, hitFlash: 0 };
  if (far && pt) { base.dormant = true; base.aggroRange = 600 + Math.random() * 120; }
  if (type === 'tracker') Object.assign(base, { r: 14, hp: 1, maxHp: 1, speed: 62 * waveScale, color: '#ff5c7a' });
  else if (type === 'shooter') Object.assign(base, { r: 16, hp: 2, maxHp: 2, speed: 42 * waveScale, color: '#c084fc' });
  else if (type === 'blinder') Object.assign(base, { r: 16, hp: 2, maxHp: 2, speed: 44 * waveScale, color: '#ffd166' });
  else if (type === 'splitter') Object.assign(base, { r: 18, hp: 2, maxHp: 2, speed: 44 * waveScale, color: '#7ef9d0' });
  else if (type === 'mini') Object.assign(base, { r: 9, hp: 1, maxHp: 1, speed: 95 * waveScale, color: '#ff9d5c', delay: 0 });
  else if (type === 'hunter') Object.assign(base, { r: 13, hp: 1, maxHp: 1, speed: 85 * waveScale, color: '#ff9d5c' });
  else if (type === 'fortress') Object.assign(base, { r: 26, hp: 18, maxHp: 18, speed: 26 * waveScale, color: '#9be7ff', isFortress: true, fireCd: 2.2, mass: 3 });

  // 每个 wave 怪物血量 +10%
  if (type !== 'boss') {
    const hpScale = 1 + 0.1 * Math.max(0, S.wave - 1);
    base.maxHp = Math.round(base.maxHp * hpScale * 10) / 10;
    base.hp = base.maxHp;
  }
  S.enemies.push(base);
}

// ============================================================
//  爆破技能
// ============================================================
function triggerBomb() {
  if (!S.bombUnlocked || S.bombCd > 0) return;
  
  const stacks = S.bombStacks;
  const radius = BOMB_RADIUS_BASE + 40 * (stacks - 1);
  const baseForce = BOMB_FORCE_BASE + 120 * (stacks - 1);
  S.bombCd = BOMB_CD_BASE;
  
  const p = S.player;

  // 震伤并推开附近怪物
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const en = S.enemies[i];
    const dx = en.x - p.x, dy = en.y - p.y, dist = Math.hypot(dx, dy);
    if (dist < radius) {
      en.hp -= 2 + stacks; en.hitFlash = 0.15; en.dormant = false;
      const push = 260 * (1 - dist / radius) * (en.type === 'boss' ? 0.3 : 1);
      if (dist > 0.1) { en.x += dx / dist * push; en.y += dy / dist * push; }
      if (en.hp <= 0) killEnemy(i, 0.25);
    }
  }
  
  // 物理排斥
  for (const b of S.eBullets) {
    const dx = b.x - p.x, dy = b.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist < radius && dist > 0.1) {
      const power = Math.max(0.25, 1 - dist / radius);
      const force = baseForce * power;
      const nx = dx / dist, ny = dy / dist;
      b.pushVx = (b.pushVx || 0) + nx * force;
      b.pushVy = (b.pushVy || 0) + ny * force;
    }
  }
  
  // 冲击波与视觉
  S.shockwaves.push({ x: p.x, y: p.y, r: p.r, maxR: radius, life: 0.45, maxLife: 0.45, color: '212,196,138' });
  
  for (let i = 0; i < 30; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 150 + Math.random() * 250;
    S.particles.push({
      x: p.x + Math.cos(a) * p.r, y: p.y + Math.sin(a) * p.r,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 0.5, maxLife: 0.5,
      color: Math.random() < 0.5 ? '212,196,138' : '255,240,200',
      size: 2 + Math.random() * 3
    });
  }
  
  S.shake = Math.max(S.shake, 14);
  sfx(90, 0.25, 'sawtooth', 0.06);
  setTimeout(() => sfx(160, 0.15, 'square', 0.04), 60);
  updateBombHUD();
}

// ============================================================
//  玩家普通射击
// ============================================================
function playerShoot(now) {
  if (S.burrowTimer > 0) return;
  const cd = S.buffs.fireRate > 0 ? PLAYER_SHOT_CD_FAST : PLAYER_SHOT_CD;
  if (now - S.lastShot < cd * 1000) return;
  S.lastShot = now;

  const p = S.player;
  const mw = mouseWorld();
  const dx = mw.x - p.x, dy = mw.y - p.y;
  const d = Math.hypot(dx, dy) || 1;
  const baseAngle = Math.atan2(dy, dx);
  p.angle = baseAngle;

  const count = S.buffs.spread > 0 ? 3 : 1;
  const spreadStep = 0.14;

  for (let i = 0; i < count; i++) {
    const off = count === 1 ? 0 : (i - (count - 1) / 2) * spreadStep;
    const a = baseAngle + off;
    const nx = Math.cos(a), ny = Math.sin(a);
    S.pBullets.push({
      x: p.x + nx * (p.r + 4), y: p.y + ny * (p.r + 4),
      vx: nx * 760, vy: ny * 760, r: 3.5, life: 999,
      damage: BULLET_DAMAGE, color: '#ffd166', echo: false
    });
  }

  const nx = Math.cos(baseAngle), ny = Math.sin(baseAngle);
  for (let i = 0; i < 2; i++) {
    S.particles.push({
      x: p.x + nx * (p.r + 2), y: p.y + ny * (p.r + 2),
      vx: nx * 80 + (Math.random() - .5) * 80, vy: ny * 80 + (Math.random() - .5) * 80,
      life: .15, maxLife: .15, color: '255,209,102', size: 2 + Math.random() * 2
    });
  }
  sfx(count > 1 ? 540 : 620, 0.04, 'square', 0.012);
}

function toggleSniper() {
  if (S.sniperMode) {
    S.sniperMode = false;
    S.sniperRecoil = 0;
    S.sniperTriggered = false;
    S.focusActive = false;
    sfx(400, 0.1, 'sine', 0.03);
    updateSniperHUD();
    return;
  }
  if (S.sniperMag <= 0) {
    S.banner = { text: '无狙击弹药', life: 0.9 };

    return;
  }
  
  if (S.isChargingMelee) {
    S.isChargingMelee = false;
    S.meleeCharge = 0;
  }
  S.sniperMode = true;
  S.sniperCd = 0;
  S.sniperTriggered = false;
  if (MOBILE) S.banner = { text: '推满右摇杆发射', life: 1.4 };
  sfx(600, 0.1, 'sine', 0.03);
  setTimeout(() => sfx(1200, 0.1, 'sine', 0.025), 70);
  updateSniperHUD();
  updateMeleeHUD();
}

function sniperShoot() {
  if (S.burrowTimer > 0) return;
  if (!S.sniperMode || S.sniperMag <= 0 || S.sniperCd > 0) {
    if (S.sniperCd > 0) { S.sniperFailFlash = 0.08; sfx(220, 0.04, 'square', 0.02); }
    return;
  }

  S.sniperMag--;
  S.sniperCd = SNIPER_CD;
  const p = S.player;
  const mw = mouseWorld();
  const baseAngle = Math.atan2(mw.y - p.y, mw.x - p.x);
  p.angle = baseAngle;

  const spread = S.currentSpread;
  const offset = (Math.random() - 0.5) * spread;
  const a = baseAngle + offset;
  const nx = Math.cos(a), ny = Math.sin(a);

  S.pBullets.push({
    x: p.x + nx * (p.r + 22), y: p.y + ny * (p.r + 22),
    vx: nx * SNIPER_BULLET_SPEED, vy: ny * SNIPER_BULLET_SPEED,
    r: 4, life: 999, damage: SNIPER_DAMAGE, color: '#ffffff',
    isSniper: true, trail: []
  });

  // 抛壳
  for (let i = 0; i < 2; i++) {
    const ca = baseAngle + Math.PI / 2 + (Math.random() - 0.5) * 0.5;
    S.particles.push({
      x: p.x + nx * (p.r + 6), y: p.y + ny * (p.r + 6),
      vx: Math.cos(ca) * (60 + Math.random() * 50), vy: Math.sin(ca) * (60 + Math.random() * 50),
      life: 0.4, maxLife: 0.4, color: '212,196,138', size: 2.2
    });
  }

  S.sniperRecoil = 1; S.muzzleFlash = 0.08; S.shake = Math.max(S.shake, 6);
  sfx(1400, 0.03, 'square', 0.022);

  if (S.sniperMag <= 0) {
    setTimeout(() => {
      if (S.sniperMag <= 0 && S.sniperMode) {
        S.sniperMode = false; S.sniperTriggered = false; S.focusActive = false;
        S.banner = { text: '弹夹耗尽', life: 0.9 };
        updateSniperHUD();
      }
    }, 120);
  }
  updateSniperHUD();
}

// ============================================================
//  飞刀逻辑
// ============================================================
function throwMelee() {
  if (S.burrowTimer > 0) return;
  if (S.meleeCd > 0 || !S.meleeUnlocked || S.meleeCount < 2) return;
  
  S.meleeCount -= 2;
  const power = S.meleeCharge / MELEE_MAX_CHARGE; // 0 ~ 1
  S.meleeCd = MELEE_CD;
  S.meleeCharge = 0;
  
  const p = S.player;
  const baseAngle = p.angle;
  const speed = MELEE_BASE_SPEED + power * (MELEE_MAX_SPEED - MELEE_BASE_SPEED);
  const amplitude = 15 + power * 45; 
  const frequency = 3 + power * 4; 
  const spinSpeed = 10 + power * 15;

  for (const side of [-1, 1]) {
    const a = baseAngle + side * MELEE_ANGLE;
    S.knives.push({
      x: p.x, y: p.y,
      startX: p.x, startY: p.y,
      baseAngle: a,
      time: 0, speed, amplitude, frequency, spinSpeed,
      angle: Math.random() * Math.PI * 2,
      r: 12, durability: MELEE_MAX_DURABILITY, trail: []
    });
  }
  
  S.shake = Math.max(S.shake, 8);
  sfx(800, 0.1, 'sine', 0.04);
  updateMeleeHUD();
}

function activateBurrow() {
  if (!S.running || S.over || S.paused) return;
  if (S.burrowTimer > 0 || S.burrowCd > 0) return;
  S.burrowTimer = BURROW_DURATION;
  S.burrowCd = BURROW_CD;
  S.isChargingMelee = false;
  S.meleeCharge = 0;
  S.sniperTriggered = false;
  document.querySelectorAll('.mSkill.charging').forEach((b) => b.classList.remove('charging'));
  S.banner = { text: `遁地 ${BURROW_DURATION}s`, life: 0.9 };
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 100;
    S.particles.push({
      x: S.player.x, y: S.player.y + 8,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5,
      life: 0.5, maxLife: 0.5, color: '140,100,60', size: 2 + Math.random() * 3
    });

}

function updateKnives(dt) {
  for (let i = S.knives.length - 1; i >= 0; i--) {
    const k = S.knives[i];
    k.time += dt;
    k.angle += k.spinSpeed * dt;

    k.trail.push({ x: k.x, y: k.y });
    if (k.trail.length > 15) k.trail.shift();

    const forward = k.speed * k.time;
    const currentAmp = k.amplitude * Math.max(0, 1 - k.time / MELEE_MAX_LIFE); 
    const offset = currentAmp * Math.sin(k.time * k.frequency * Math.PI * 2);
    
    const dirX = Math.cos(k.baseAngle);
    const dirY = Math.sin(k.baseAngle);
    const perpX = -Math.sin(k.baseAngle);
    const perpY = Math.cos(k.baseAngle);

    k.x = k.startX + dirX * forward + perpX * offset;
    k.y = k.startY + dirY * forward + perpY * offset;

    // 刮去敌方子弹
    for (let bIdx = S.eBullets.length - 1; bIdx >= 0; bIdx--) {
      const b = S.eBullets[bIdx];
      const dx = k.x - b.x, dy = k.y - b.y;
      if (dx * dx + dy * dy < (k.r + b.r) * (k.r + b.r)) {
        S.eBullets.splice(bIdx, 1);
        k.durability -= 2;
        
        for (let c = 0; c < 3; c++) {
          const ca = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 80;
          S.particles.push({
            x: b.x, y: b.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
            life: 0.2, maxLife: 0.2, color: '255,92,122', size: 1.5 + Math.random()
          });
        }
      }
    }

    // 碰撞怪物（一帧一判）
    for (let j = S.enemies.length - 1; j >= 0; j--) {
      const en = S.enemies[j];
      if (en.delay > 0) continue;
      
      const dx = k.x - en.x, dy = k.y - en.y;
      const rr = k.r + en.r;
      
      if (dx * dx + dy * dy < rr * rr) {
        en.hp -= 1;
        en.hitFlash = 0.1;
        
        let durabilityCost = 2;
        if (en.type === 'shooter') durabilityCost = 3;
        else if (en.type === 'splitter') durabilityCost = 4;
        else if (en.type === 'hunter') durabilityCost = 3;
        else if (en.type === 'boss') durabilityCost = 10;
        
        k.durability -= durabilityCost;
        
        if (Math.random() < 0.5) {
          for (let c = 0; c < 2; c++) {
            const ca = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 100;
            S.particles.push({
              x: k.x, y: k.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
              life: 0.2, maxLife: 0.2, color: '232,244,255', size: 1.5 + Math.random()
            });
          }
        }
        
        if (en.hp <= 0) killEnemy(j, 0.5);
      }
    }

    const mapW = S.map ? S.map.w : W, mapH = S.map ? S.map.h : H;
    if (k.durability <= 0 || k.time > MELEE_MAX_LIFE ||
        k.x < -50 || k.x > mapW + 50 || k.y < -50 || k.y > mapH + 50) {
      S.knives.splice(i, 1);
      
      for (let c = 0; c < 8; c++) {
        const ca = Math.random() * Math.PI * 2, sp = 40 + Math.random() * 120;
        S.particles.push({
          x: k.x, y: k.y, vx: Math.cos(ca) * sp, vy: Math.sin(ca) * sp,
          life: 0.3, maxLife: 0.3, color: '95,184,255', size: 1.5 + Math.random() * 2
        });
      }
    }
  }
}

function spawnPowerupAt(x, y, force = false) {
  if (!force) {
    for (const pu of S.powerups) if (Math.hypot(pu.x - x, pu.y - y) < 60) return false;
    if (S.powerups.length >= POWERUP_MAX_GROUND) return false;
  }
  
  const r = Math.random();
  let type = 'fireRate';
  if (r < 0.19) type = 'fireRate';
  else if (r < 0.36) type = 'spread';
  else if (r < 0.51) type = 'sniper';
  else if (r < 0.62) type = 'melee';
  else if (r < 0.70) type = 'egg';
  else if (r < 0.79) type = 'heal';
  else if (r < 0.88) type = 'vision';
  else if (r < 0.95) type = 'bomb';
  else type = 'secondChance';

  S.powerups.push({
    x, y, type, life: POWERUP_LIFE, maxLife: POWERUP_LIFE,
    bob: Math.random() * Math.PI * 2, spawnT: 0
  });
  return true;
}

function spawnRandomPowerup() {
  const map = S.map;
  const v = viewRect();
  for (let tries = 0; tries < 40; tries++) {
    const x = v.l + 100 + Math.random() * Math.max(1, v.w - 200);
    const y = v.t + 100 + Math.random() * Math.max(1, v.h - 200);
    if (map && (x < 60 || x > map.w - 60 || y < 60 || y > map.h - 60)) continue;
    if (S.player && Math.hypot(x - S.player.x, y - S.player.y) < 120) continue;
    if (hitsWall(x, y, 26)) continue;
    if (spawnPowerupAt(x, y)) return;
  }
}

function spawnEcho() {
  if (S.energy < ECHO_COST || S.echoCd > 0 || S.echoes.length >= MAX_ECHO) return;
  const now = performance.now();
  const windowMs = 2000;
  const recent = S.history.filter(h => now - h.t < windowMs);
  if (recent.length < 2) return;
  S.energy -= ECHO_COST; S.echoCd = 0.5;
  const t0 = now - windowMs;
  const path = recent.map(h => ({ dt: (h.t - t0) / 1000, x: h.x, y: h.y }));
  S.echoes.push({
    path, elapsed: 0, life: ECHO_LIFE, maxLife: ECHO_LIFE,
    shootCd: 0.1, r: 9, color: '#5fb8ff', x: path[0].x, y: path[0].y,
    hp: ECHO_HP, maxHp: ECHO_HP, hitFlash: 0
  });
  for (let i = 0; i < 10; i++) {
    const a = Math.random() * Math.PI * 2, sp = 30 + Math.random() * 100;
    S.particles.push({
      x: S.player.x, y: S.player.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: .4, maxLife: .4, color: '95,184,255', size: 2 + Math.random() * 2
    });
  }
  sfx(880, 0.1, 'sine', 0.04);
  updateHUD();
}

function detonateEchoes() {
  if (S.detonateCd > 0 || S.echoes.length === 0) return;
  S.detonateCd = DETONATE_CD;
  const echoes = [...S.echoes];
  S.echoes = [];
  for (const e of echoes) {
    const power = 2 + Math.floor(e.hp);
    for (let i = S.enemies.length - 1; i >= 0; i--) {
      const en = S.enemies[i];
      const d = Math.hypot(en.x - e.x, en.y - e.y);
      if (d < 100) {
        en.hp -= power; en.hitFlash = 0.15;
        if (en.hp <= 0) killEnemy(i, 0.3);
      }
    }
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2, sp = 80 + Math.random() * 200;
      S.particles.push({
        x: e.x, y: e.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.6, maxLife: 0.6, color: '95,184,255', size: 2 + Math.random() * 4
      });

    S.particles.push({
      x: e.x, y: e.y, vx: 0, vy: 0,
      life: 0.4, maxLife: 0.4, color: '95,184,255', size: 45, ring: true
    });
  }
  S.shake = Math.max(S.shake, 12);
  sfx(120, 0.3, 'sawtooth', 0.06);
  updateHUD();
}

function destroyEcho(echo) {
  const idx = S.echoes.indexOf(echo);
